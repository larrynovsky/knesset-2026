# Правило состава оракула направления. Объявлено ДО того, как состав тронут.
#
# ГРАНИЦА §3 — что автор видел и чего не видел:
#   ВИДЕЛ: прогон 12.08 по 57 актам. Подложено семь актов, до оракула дошло
#     шесть, у всех шести ожидаемый ответ −1. Седьмой (2198907, Основной
#     закон об изучении Торы, 717 знаков) отсеивается раньше классификации
#     как «структуры нет» — единственный такой акт в корпусе, и он же
#     единственный неминусовый подлог. Исход: попаданий 10, промах 1.
#     Распределения знаков: anthropic {−1: 23, 0: 14, +1: 17},
#     openai {−1: 16, 0: 23, +1: 15}.
#   НЕ ВИДЕЛ: ни одного акта с ожидаемым +1 в оракуле — их там нет вовсе.
#     Не искал кандидатов, не читал текстов под этим углом.
#
# Повод. Вчерашний доклад «кворум 6 из 6» я подал как доказательство
# исправности. Он им не был: постоянный классификатор, отвечающий −1 всегда,
# набирает на этом оракуле 6 из 6. Прибор не отличал точность от склонности
# к знаку, и узнать это по его собственному выводу было нельзя.
#
# Почему правило, а не добор актов. Добрать акт с +1 после того, как провал
# увиден, — правка прибора под известный результат, ровно того класса,
# который §3 запрещает. Сначала правило состава, потом состав.

rule:
  id: ORACLE_FITNESS
  statement: >
    Оракул направления годен как замер точности только тогда, когда никакой
    ПОСТОЯННЫЙ классификатор не набирает на нём больше половины попаданий
    среди актов, ДОШЕДШИХ до классификации.
  floor: >
    Дошедших актов не меньше шести. Ниже этого доля перестаёт быть величиной:
    на четырёх актах «половина» отличается от «двух третей» одним актом.
  reached_not_planted: >
    Считается по ДОШЕДШИМ, а не по подложенным. Подлог, отсеянный конвейером
    раньше классификации, вычитается из прибора целиком — это другой прибор,
    а не тот же с меньшим числом наблюдений. Именно на этом различении
    оракул и выродился незаметно.
  on_failure: >
    Негодный оракул НЕ отменяет прогон и НЕ правит пороги. Он отменяет одно
    утверждение — «прогон точен». Результаты остаются, вывод о точности
    снимается до починки состава. Эскалация владельцу, не автоправка.
  what_it_does_not_claim: >
    Правило защищает от вырождения, а не от общего заблуждения всех вендоров
    и не от малости выборки. Сбалансированный оракул из шести актов остаётся
    слабым замером точности — он лишь перестаёт быть замером склонности.

predictions:

  - id: P31
    about: "актов, усиливающих проверяемое, в корпусе мало"
    claim: >
      Среди 57 актов пилота кандидатов на ожидаемый ответ +1 — таких, где
      усиление проверяемости читается по тексту без спора, — окажется не
      больше восьми.
    why_it_matters: >
      Если их почти нет, сбалансировать оракул внутри пилота нельзя, и
      правило заставит расширять корпус, а не подбирать удобные акты. Это
      дороже, но именно эту цену правило и обязано вскрыть заранее.
    confidence: 0.55

  - id: P32
    about: "точность на сбалансированном оракуле окажется ниже"
    claim: >
      На оракуле, прошедшем ORACLE_FITNESS, доля попаданий пары вендоров
      упадёт с нынешних 10 из 11 (91%) в диапазон 60–85%.
    why_it_matters: >
      Нынешние 91% измерены прибором, который постоянный классификатор
      проходит начисто. Если после балансировки точность НЕ упадёт — моя
      модель происходящего неверна, и вендоры действительно читают текст, а
      не угадывают знак по типу акта.
    confidence: 0.65

  - id: P33
    about: "крен OpenAI к нулю проявится именно на плюсовых актах"
    claim: >
      На актах с ожидаемым +1 расхождение anthropic/openai по общему знаку
      будет чаще, чем на актах с ожидаемым −1, и типичная форма расхождения —
      OpenAI ставит 0 там, где Anthropic ставит +1.
    why_it_matters: >
      Распределения уже показали крен: у OpenAI нулей 23 против 14 у
      Anthropic. Если крен подтвердится на подлогах с известным ответом, это
      свойство оценщика, а не корпуса, и кворум из двух моделей для знака
      негоден без третьей.
    confidence: 0.6

notes:
  - >
    Акт 2198907 из подлога НЕ заменяется и НЕ чинится. То, что конвейер его
    отсеивает, — честный факт про конвейер, и он обязан остаться видимым.
    Правило требует годного состава среди ДОШЕДШИХ, а не спасения каждого
    подложенного акта.
  - >
    Пороги уверенности (0.60 / 0.30 / 0.75 / одна треть) этим файлом не
    трогаются. Они живут в criteria/direction_confidence_2026-08-01.yaml.
  - >
    Правило написано так, чтобы его нарушение было ВЫЧИСЛИМЫМ, а не
    предметом суждения: доля лучшего постоянного ответа среди дошедших.
    Механизм — oracle_fitness() в scripts/classify_direction.py, красный при
    вырождении и при недоборе до шести.

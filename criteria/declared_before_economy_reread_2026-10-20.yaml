# Объявлено ДО выгрузки текстов и до чтения (§3). Владелец 20.10 14:46: «вариант А» —
# перечитать экономические законы по полным текстам, как ось суда.
why: >-
  Codex v94: «ясной линии нет» по экономике у 16 из 19 линий чувствительно к спорным знакам по названиям
  (только согласованные знаки — 12/19, без новых спорных — 7/19). Знак по названию — слабое свидетельство.
universe: >-
  Все законопроекты с ненулевым знаком economy в criteria/full_signs_K20..K25.json, которых нет в
  criteria/theme_signs_economy.json (там знаки уже по полным текстам, они не трогаются). На 20.10 — 561:
  K20 243, K23 35, K24 94, K25 189. Нулевые знаки по названию не перечитываются: проход может только
  снять знак, но не добавить его (как второе прочтение оси). Эта асимметрия печатается на странице методики.
texts: >-
  data/bill_texts/<bill>.txt; выгрузка — scripts/fetch_bill_texts.py (лучший документ нормы на законопроект,
  та же предпочтительность форматов и пороги извлечения). Нет текста или текст не извлёкся — знак по названию
  остаётся, такие законы считаются и печатаются отдельно (не «подтверждены»).
meaning: >-
  Признак economy из criteria/themes.yaml без изменений: плюс — норма увеличивает права и возможности бизнеса
  (производителя), снижает налоги, поборы, барьеры; минус — обратное; только эффект для производителя.
  0 — норма не меняет условий производителя; null — по тексту нельзя установить общий знак (с причиной).
readers: >-
  Два независимых читателя полного текста: Claude (субагенты) и Codex. Знак по названию читателям НЕ показывается;
  каждый фиксирует свои знаки (файл + SHA-256) до сравнения.
rule: >-
  Знак по названию остаётся, если ни один читатель полного текста не дал другого числового знака (null — не довод против).
  Если хотя бы один читатель дал другой числовой знак (включая 0) — знак снимается (0), не переворачивается.
  Перевороты (оба читателя дали противоположный знак) считаются и печатаются, но в стрелку не идут — как у оси.
output: criteria/economy_second_reading_2026-10-20.json; применяется в theme_arrows.load_signs после setdefault из full_signs.
effect_boundary: >-
  Эффект на стрелки и траекторию до этого файла не считался. После применения пересчитываются arrow_robustness,
  траектория, карточки и весь сайт; оракулы Codex обновляются под этот текст.

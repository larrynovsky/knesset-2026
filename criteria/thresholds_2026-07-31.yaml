# выбора только нашим словом. Здесь слово заменено датой коммита.

# =============================================================================
# ГРАНИЦА §3 — что видел автор порогов, а что нет
# =============================================================================
# §3-channel: direction-thresholds
# §3-data-markers: data/direction_full_*.json, data/matrix_*.json
#
# ВИДЕЛ:
#   - пилот 29.07 на 57 законопроектах ДВУМЯ вендорами: согласие по общему
#     знаку 83,3%, расхождений 9, из них 7 — незакрытые места в критериях;
#   - что корпус оси 1 составляет 258 голосований из 7562;
#   - что в 25-м Кнессете 92% голосований электронные и поимённые.
#
# НЕ СМОТРЕЛ:
#   - ни одного прогона тремя вендорами: кворум не считался ни разу;
#   - распределение направлений по фракциям — не вычислялось;
#   - распределение `contrast` по корпусу — не смотрел, и порог спрятанности
#     ниже выбран из смысла правила, а не из гистограммы;
#   - экономические знаки — ось описательная, к ней не приступали.
#
# Это ЗАЯВЛЕНИЕ, не механизм. Механизируемая часть: коммит с этим файлом
# обязан быть старше первых прогонов. Проверяет check_criteria_order.py.
# =============================================================================


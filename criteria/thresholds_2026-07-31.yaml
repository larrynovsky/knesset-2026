# ----------------------------------------------------- 1. КВОРУМ ТРЁХ ВЕНДОРОВ
quorum:
  правило: значение записи — знак, данный не менее чем двумя вендорами из трёх
  объявлено_ранее: >-
    plans/PLAN_direction_2026-07-31b.md, коммит 1bb8b1a. Здесь повторено,
    чтобы пороги лежали в одном месте, а не искались по планам.
  ожидание_доли_кворума: >-
    не менее 95% записей. Отсутствие большинства требует ТРЁХ РАЗНЫХ знаков из
    трёх возможных — это должно быть редкостью.
  ожидание_доли_единогласия: >-
    70–85%. На двух вендорах согласие по общему знаку было 83,3%; при трёх
    единогласие обязано быть НИЖЕ, иначе третий вендор ничего не добавил.
  ниже_90_процентов_кворума: >-
    ЭСКАЛАЦИЯ владельцу, а НЕ правка кодбука. Рефлекс «низкое согласие ⇒
    правка критериев» и создал двенадцать ревизий за пять дней.
  единогласие_выше_90_процентов_тоже_сигнал: >-
    Если три модели сходятся почти всегда, они, вероятно, читают текст
    одинаково НЕ потому, что он однозначен, а потому что обучены схоже.
    Кворум тогда защищает от идиосинкразии и не защищает ни от чего больше.
    Это не отказ, но обязано быть сказано в отчёте.

# ------------------------------------------------ 2. СПРЯТАННОСТЬ (СОРТИРОВКА)
hiddenness:
  что_это: >-
    Низкое значение поля `contrast` при знаке ≠ 0 — признак того, что норма
    проведена внутри пакета. Поле считается как 1/число структурных единиц
    закона и одинаково для всех норм одного закона.
  роль: >-
    ТОЛЬКО сортировка и пометка в отчёте (K2b). В отборе направления НЕ
    участвует — см. исправление K10 от 31.07. Смешение сортировки с отбором и
    было дефектом.
  порог: 0.05
  что_означает_порог: >-
    contrast <= 0.05 значит, что закон разобран на двадцать и более
    структурных единиц, то есть норма — не более двадцатой части пакета.
    Число выбрано ИЗ СМЫСЛА правила, а не из гистограммы: распределение
    `contrast` по корпусу я не смотрел и смотреть до прогона не буду.
  цена_ошибки_низкая: >-
    Порог влияет на ПОРЯДОК строк в отчёте и ни на один знак. Неудачное
    значение делает отчёт хуже читаемым и не делает его неверным.

# --------------------------------------- 3. ЗАЩИТА ОСИ ЭКОНОМИКИ ОТ ЗЕРКАЛА
economy_mirror_check:
  когда: перед первой публикацией экономических знаков, не в этом заходе
  правило: >-
    Сравнить наши знаки по оси экономики с экспертной оценкой lrecon из
    CHES-Israel по тем же партиям. Ранговая корреляция Спирмена.
  порог_тревоги: 0.85
  что_означает: >-
    |rho| >= 0.85 значит, что мы переоткрыли экспертный опрос, а не измерили
    поведение: месяц работы дал то, что лежит в открытом датасете. Это НЕ
    доказательство ошибки, но обязано быть названо в отчёте вслух.
  что_означает_расхождение: >-
    |rho| <= 0.5 значит, что наш канал говорит о партиях нечто иное, чем
    эксперты. Тогда объяснять расхождение обязаны мы, а не они.
  честная_граница: >-
    lrecon меряет ПОЗИЦИЮ партии, наш знак — поведение по нормам. Это разные
    конструкты, и совпадение двух измерителей разного не валидирует ни один.
    Проверка ловит вырождение прибора в зеркало, а не его правильность.

# ------------------------------- 4. СОПОСТАВЛЕНИЕ ФРАКЦИЙ СО СПИСКАМИ БЮЛЛЕТЕНЯ
ballot_lineage:
  когда: после закрытия приёма списков ЦИК, 8–9 сентября 2026
  почему_объявляется_сейчас: >-
    Списков ещё не существует. Правило, написанное после их появления, будет
    подобрано под уже увиденные составы — а это ровно та подгонка, против
    которой написан §3. Сорок дней форы тратятся на то, чтобы правило было
    старше данных.
  единица_сопоставления: >-
    Не название списка и не «правопреемство»: набор ЛЮДЕЙ. Список — это
    множество кандидатов, фракция 25-го Кнессета — множество депутатов.
  правило: >-
    Фракция F связывается со списком L, если среди первых десяти кандидатов L
    доля депутатов фракции F составляет не менее 0,5 И превышает долю любой
    другой фракции не менее чем вдвое.
  порог_первой_десятки: 0.5
  почему_первая_десятка: >-
    Проходной барьер 3,25% даёт примерно четыре мандата; десятка покрывает
    реалистичный размер фракции и не размывается хвостом списка, куда ставят
    кого угодно.
  неоднозначные_случаи: >-
    Раскол пополам, слияние трёх фракций, список без единого действующего
    депутата — правило НЕ применяется, случай идёт владельцу с прочтением и
    указанием, чем это прочтение опровергается. Прочтение готовит ассистент,
    решение принимает владелец: «решение принимает человек» не означает «человек
    делает работу».
  новый_список_без_депутатов: >-
    Связи нет и быть не может. Такой список получает базовую ставку (§7), а не
    молчание: «данных нет» тихо конвертируется в «претензий нет» и даёт новым
    спискам незаслуженное преимущество.

# Ожидания к разбору 80 расхождений между прямым ключом и сшивкой по имени.
#
# Что заставило пересмотреть. P18 объявлял «прямой ключ строго богаче имени,
# потеря ровно ноль» и был опровергнут прогоном: 80 пар из 209 расходятся.
# Диагностика показала, что посылка P18 неверна: сшивка по имени не «бедна, но
# проверена» — при тёзках она выбирала из одноимённых актов ПЕРВОГО встречного
# (setdefault), то есть наугад. В переписи 317 актов из 1017 имеют тёзку.
#
# Уже измерено (01.08.2026):
#   80 расхождений = 77 «прямой нашёл другой акт» + 3 «прямой не нашёл ничего»
#   из 77: 38 — найденный акт ТЁЗКА названного именем (имя выбрало не того)
#          39 — найденный акт с ДРУГИМ названием (не решается механически)
#
# Порог P18 НЕ ослабляется: ослабить порог, увидев результат, — подгон того
# класса, который §3 запрещает. Оракул заменяется по существу: вместо одного
# «ноль потерь» — три класса с разными правами, и молчание невозможно ни в
# одном из них.

predictions:

  - id: P22
    about: "39 содержательных расхождений — поправки к одному закону"
    claim: >
      У половины и более из 39 оба акта — названный именем и найденный
      прямым ключом — относятся к одному закону: нормализованные имена
      совпадают до первой открывающей скобки (закон один, поправки разные).
    why_it_matters: >
      Если так, расхождение объясняется устройством предмета: голосование
      идёт по пункту повестки, объединившему несколько поправок, и прямой
      ключ называет пункт, а имя — одну из поправок. Тогда правильный ответ
      не «выбрать ключ», а хранить оба и сказать это вслух.
    confidence: 0.5

  - id: P23
    about: "прямой ключ не выбирал"
    claim: >
      У 80% и более из 39 голосований пара (SessionID, ItemID) единственна:
      прямой ключ не стоял перед выбором между несколькими пунктами.
    why_it_matters: >
      Низкое значение означало бы, что прямой ключ тоже разрешает
      неоднозначность молча, и тогда он не лучше имени, а просто другой.
    confidence: 0.75

  - id: P24
    about: "три настоящие потери"
    claim: >
      Все три голосования, где прямой ключ не нашёл ничего, не имеют пункта
      повестки вовсе — пары (SessionID, ItemID) нет в KNS_PlmSessionItem.
      Ни одно из трёх не отсеяно по типу пункта.
    confidence: 0.6

oracle_replacement:
  # Заменяет P18. Классы взаимно исключающие, разбиение обязано быть полным.
  - class: "тёзка"
    rule: >
      Найденный прямым ключом акт имеет то же нормализованное имя, что и
      выбранный сшивкой по имени. Имя выбрало из одноимённых наугад, ключ
      выбрал по структуре. Принимается автоматически, считается, печатается.
  - class: "содержательное"
    rule: >
      Имена разные. НЕ решается механически. Каждый случай обязан иметь
      запись в criteria/vote_link_adjudication_<дата>.yaml с вердиктом.
      Случай без записи — отказ сборки.
  - class: "потеря"
    rule: >
      Прямой ключ не нашёл ничего. Каждый случай обязан быть НАЗВАН
      поимённо в том же файле с причиной. Неназванная потеря — отказ.
  invariant: >
    сумма трёх классов равна числу расхождений; расхождение, не попавшее ни
    в один класс, — отказ, а не строчка в отчёте.

# Критерий: каким МЕХАНИЗМОМ обязательство стало (или не стало) деньгами
#
# ЗАФИКСИРОВАН ДО ВЗГЛЯДА НА ДАННЫЕ ВТОРОЙ ПАРТИИ (§3). На момент коммита
# по Яадут ха-Тора не открыт ни один бюджетный запрос и не прочитан ни один
# пункт соглашения. Проверяется git-историей, а не этим утверждением.
#
# Зачем отдельный файл, а не правка budget_mapping.yaml: там записано, КАК
# сопоставлять обязательство со строкой. Здесь — гипотеза о том, ПОЧЕМУ
# сопоставление так часто не находится, и что считать её опровержением.
# Смешивать нельзя: первое — процедура, второе — утверждение о мире, и у
# них разная цена ошибки.
#
# Происхождение гипотезы названо честно: она родилась ПОСЛЕ разбора четырёх
# обязательств ШАС 30–31.07.2026. Поэтому ШАС в проверку НЕ входит — он
# порождающий материал. Это ровно §8: интерпретация, построенная на одном
# периоде, прогоняется по материалу, в который до этого не смотрели.

# =============================================================================
# ГРАНИЦА §3 — что видел автор правила, а что нет
# =============================================================================
# §3-channel: mechanism-coding-holdout
# §3-data-markers: data/mechanism_coding_*.json, cards/yahadut-*.yaml
#
# ВИДЕЛ (порождающий материал, из него и родилась гипотеза):
#   - соглашение ШАС: 34 денежные строки, четыре обязательства разобраны
#     целиком и лежат в cards/shas-1095-gov37.yaml;
#   - бюджет по ветке 00220102 за 2022-2025, база и исполнение по всем
#     16 строкам; отсутствие статьи 0022010203 во все три года;
#   - схему obudget целиком: 21 231 строка, из них 17 791 уровня תקנה;
#   - публикации Израильского института демократии и Globes о коалиционных
#     деньгах, прочитаны 2026-07-31. Это ЧУЖОЙ анализ, не наша выгрузка:
#     ни одной строки их данных у нас нет.
#
# НЕ СМОТРЕЛ (сторона, на которой проверяется гипотеза):
#   - соглашение Яадут ха-Тора: не открыта ни одна строка. Не знаю ни
#     сколько в нём денежных пунктов, ни о чём они;
#   - ни одного бюджетного запроса по предмету обязательств второй партии;
#   - решения правительства о коалиционных средствах: не выгружены вовсе,
#     ни по одной партии;
#   - composition variance не считалась ни по одной ветке, включая ту,
#     про которую ожидание объявлено ниже.
#
# Это ЗАЯВЛЕНИЕ, не механизм. §3 сверяет даты коммитов; взгляд артефакта не
# оставляет. Механизируемая часть: порядок коммитов и то, что коммит с
# разметкой visibility_value старше первого бюджетного запроса по второй
# партии. Проверяет scripts/check_criteria_order.py.
# =============================================================================

version: "1.0"
status: ЧЕРНОВИК НА УТВЕРЖДЕНИЕ
drafted_at: "2026-07-31"
drafted_by: Claude
approved_at: null
approved_by: null

# ---------------------------------------------------------------- 1. ГИПОТЕЗА
hypothesis:
  short: >-
    Обязательство коалиционного соглашения, сформулированное в предметах
    (объект, услуга, здание), систематически НЕ становится бюджетной строкой,
    названной по этому предмету. Деньги — если приходят — приходят широкой
    базой, переносами или субсидиями, то есть механизмами, в которых предмет
    не поименован и потому не проверяем.
  why_it_matters: >-
    Если верно, то зазор, который ищет проект, в большинстве случаев не
    «обещал 30, дал 10», а «обещал в единицах, которых в учёте не существует».
    Это меняет форму отчёта: «не найдено» перестаёт быть неудачей поиска и
    становится содержательным результатом.
  competing_explanation: >-
    Тот же след в бюджете даёт объяснение без всякого замысла: создать новую
    статью административно тяжело, влить деньги в существующую широкую —
    легко. Путь наименьшего сопротивления. Эти две гипотезы по итоговому
    распределению НЕ различаются, и различающий признак объявлен ниже (§4).
  known_prior: >-
    Израильский институт демократии ведёт учёт «коалиционных денег» с
    трёхуровневой градацией, где уровень 3 — целевое выделение узкой
    секторальной направленности, которого без политического соглашения не
    было бы. Их данные: рост примерно с 2,5 млрд ₪ (2015–2016) до ~11,2 млрд
    (2023–2024). Отдельно важна оговорка Globes: деньги, вошедшие В БАЗУ
    бюджета, коалиционными НЕ считаются — то есть официальная категория
    систематически исключает ту форму, которую партии и просят
    («תתוקצב בבסיס התקציב»). Проверено 2026-07-31 по публикациям, не по
    выгрузке; выгрузки этого источника у нас нет.

# --------------------------------------------------- 2. ПОРЯДОК РАБОТЫ, ЖЁСТКИЙ
procedure:
  # Двухтактность — единственная защита от подгонки. Признак-предиктор
  # кодируется из текста соглашения, коммитится, и только после этого
  # открывается бюджет. Иначе visibility_value будет проставлен задним
  # числом под уже увиденный механизм, и проверка выродится в описание.
  step_1: >-
    прочитать соглашение второй партии, выписать ВСЕ денежные пункты
    (перепись, не отбор), проставить каждому visibility_value.
  step_2: >-
    закоммитить разметку шага 1 отдельным коммитом. До этого коммита ни один
    бюджетный запрос по второй партии не делается.
  step_3: >-
    открыть бюджет, проставить mechanism каждому пункту.
  step_4: >-
    посчитать таблицу 2×N и сверить с объявленными ожиданиями ниже.

  not_a_card: >-
    Эта разметка НЕ является карточкой и не публикуется как утверждение о
    партии. §4 (поиск опровержения), §5 (два прочтения) и §6 (уверенность с
    причиной) к ней не применяются — они применяются к карточке. Смешение
    этих двух вещей уже раз стоило этапу: тяжёлая форма на двадцати пунктах
    не доезжает, а лёгкая форма, выданная за карточку, была бы подлогом.
    Разметка живёт в data/ как рабочий материал; в отчёт идёт только то,
    что стало карточкой.

# ------------------------------------------- 3. ПРИЗНАК, КОДИРУЕМЫЙ ДО БЮДЖЕТА
visibility_value:
  question: >-
    Может ли избиратель этой партии назвать предмет обязательства и увидеть
    его результат? Кодируется ТОЛЬКО по тексту соглашения.
  values:
    high: >-
      назван узнаваемый объект, услуга или адресат: здание, учреждение,
      сооружение, община, праздник, конкретная категория людей.
      Примеры формы: «ремонт синагог», «строительство микв», «связь с
      общинами за рубежом».
    low: >-
      названы ставка, коэффициент, порядок, штат, критерий распределения,
      административная процедура. Избирателю неназываемо и невидимо.
      Примеры формы: «ערך הנקודה», «תקן», «מפתח חלוקה», порядок признания.
    mixed: >-
      и предмет, и порядок в одном пункте. Кодируется отдельно и в
      различающий счёт не идёт.
  hard_rule: >-
    Заглядывать в бюджет на этом шаге запрещено. Если по тексту неясно —
    ставится mixed, а не «посмотрю и решу».

# ----------------------------------------------- 4. МЕХАНИЗМ, КОДИРУЕМЫЙ ПОСЛЕ
mechanism:
  values:
    base_named: >-
      в базе бюджета есть строка, название которой отсылает к предмету
      обязательства. Это ЕДИНСТВЕННОЕ значение, означающее «обещание стало
      видимой строкой».
    base_broad: >-
      деньги в базе, но строка шире предмета: предмет в названии не
      поименован, строка покрывает и другое.
    transfer: >-
      исполнение существенно превышает базу строки, то есть деньги приходят
      переносами. Порог существенности объявляется здесь заранее:
      исполнение ≥ 1,5 × базы.
    coalition_decision: >-
      пункт присутствует в правительственных решениях о коалиционных и
      политических средствах либо в приложении к соглашению, вне базы.
    support: >-
      деньги идут субсидиями учреждениям (תמיכות), слой supports_data.
    not_found: >-
      ни в одном из перечисленного на выгруженной глубине.
    not_budgetary: >-
      обязательство не денежное или не расходное.
  channel_not_fetched: >-
    Если канал не выгружен, пункт помечается «канал не выгружен: <какой>», а
    НЕ not_found. Молчание невыгруженного источника не является
    свидетельством отсутствия. На момент фиксации критерия не выгружены:
    coalition_decision и support. Если они не будут выгружены до конца
    этапа, все пункты, чей исход мог бы там лежать, останутся неразрешёнными,
    и об этом будет сказано числом, а не умолчанием.

# ---------------------------------------------- 5. ОЖИДАНИЯ, ОБЪЯВЛЕННЫЕ ДО
expectations:
  # §23 применённый к суждению: ожидание объявляется грубо и вслух ДО
  # взгляда. Неверное объявленное ожидание всё равно срабатывает;
  # отсутствие ожидания не срабатывает никогда.
  base_named_share: >-
    ожидаю 0–15% всех денежных пунктов второй партии. Больше 30% —
    гипотеза опровергнута, и её надо снять, а не спасать уточнениями.
  low_visibility_share: >-
    ожидаю 20–40% пунктов в visibility_value: low. Если окажется меньше 15%,
    вариации по предиктору нет и различающий тест НЕ ПРОВОДИТСЯ. Это
    вероятный исход: у ШАС все четыре разобранных пункта были high.
    Отсутствие вариации записывается как отсутствие вариации, а не как
    подтверждение.
  rejection_share: >-
    не дублируется здесь. Ожидание доли отказов 30–65% уже объявлено в
    criteria/budget_mapping.yaml, раздел holdout, и действует.

discriminating_test:
  what_it_separates: >-
    «стратегия» (партия выбирает механизм) против «процедура» (механизм
    выбирает за всех одинаково).
  prediction_strategy: >-
    доля base_named СРЕДИ high-visibility пунктов заметно выше, чем среди
    low. Партия добивается видимой строки там, где видимость ей нужна.
  prediction_procedure: >-
    доля base_named одинаково низка в обеих группах: механизм не зависит от
    того, нужна ли партии видимость.
  thresholds:
    supports_strategy: разница ≥ 25 процентных пунктов в предсказанную сторону
    refutes_strategy: разница ≤ 10 п.п. либо направлена в обратную сторону
    undecided: >-
      от 10 до 25 п.п. — НЕ РАЗЛИЧИЛИ. Это законный и, вероятно, самый
      частый исход. Записывается как исход, а не как слабое подтверждение.
  honest_bound: >-
    При ~20 пунктах на партию ячейки таблицы 2×2 содержат по пять
    наблюдений. Это счёт в клетках, а не статистика. Никаких p-значений,
    доверительных интервалов и слова «значимо». Такой счёт способен только
    грубо развернуть картину или не развернуть — и на большее не
    претендует.
  already_failed_once: >-
    Сильная версия гипотезы («всё ради витрины») уже провалила проверку на
    материале ШАС: если бы партия хотела только нераспределённой ёмкости,
    она не просила бы возобновить ИМЕНОВАННУЮ статью с названным кодом
    22010203. Она просила. Проверяется поэтому только слабая версия:
    партия хочет и того и другого и получает то, что дешевле дать.

# ---------------------------------------------- 6. ОТДЕЛЬНАЯ МЕТРИКА, PI-2
composition_variance:
  # Заимствовано у PEFA (индикатор PI-2, expenditure composition outturn).
  # Он отделяет ровно то, что мы сейчас не отделяем: PI-1 меряет общий
  # объём, PI-2 — отклонение СОСТАВА, то есть насколько перераспределение
  # между категориями при исполнении разошлось с утверждённым бюджетом.
  # По построению нечувствителен к общему росту бюджета — и потому снимает
  # возражение «база выросла на 156%, но ведь и всё выросло».
  what_is_computed: >-
    по каждой ветке восьмизначного кода за 2023–2025: отклонение доли
    исполнения от доли утверждённого плана, при контроле общего объёма.
    Считается из data/budget_takanot.json, никаких новых источников.
  declared_before_run: >-
    ожидаю, что ветка 00220102 (религиозные учреждения) окажется ВЫШЕ
    медианы composition variance по всем веткам того же порядка. Ниже
    медианы — свидетельство против гипотезы о переносах как основном канале.
  what_it_cannot_do: >-
    не различает, кто именно инициировал перераспределение. Высокая
    вариация состава есть свойство ветки, а не доказательство действия
    партии.

# ------------------------------------------------- 7. ПРАВИЛО ОСТАНОВКИ
stopping_rule:
  scope: >-
    ВСЕ денежные пункты соглашения одной второй партии — перепись, не отбор.
    Отбор «методологически различных» случаев, законный для первой карточки,
    здесь запрещён: он и есть то смещение, против которого написан §3.
  cap: >-
    если денежных пунктов больше тридцати, берутся первые тридцать в порядке
    документа — по порядку, а не по интересности, — и число отброшенных
    называется.
  when_to_stop: >-
    после одной второй партии. Третья не добавляется, пока результат по
    второй не записан целиком, включая исход «не различили».

# ------------------------------------------------- 8. ЧЕГО ЭТОТ КРИТЕРИЙ НЕ ДЕЛАЕТ
not_decided_here:
  - >-
    не решает, выполнено обязательство или нет. Механизм — это как деньги
    двигались, а не оценка партии. §13 в силе.
  - >-
    не различает «партия добилась» и «министерство так устроено». Атрибуция
    требует сравнения с ветками министерств других партий за тот же период;
    это отдельная работа и она не объявлена.
  - >-
    не покрывает канал А (голосования) ничем.
  - >-
    не заменяет двух независимых кодировщиков, которых требует сравнительная
    литература по выполнению обещаний. Кодировщик один, и он же автор
    гипотезы. Это названо как есть и не лечится в оставшееся время.

notes:
  - >
    PublicationDate законопроекта — дата публикации предложения, а не дата
    внесения. Для выбора редакции закона это допустимо: между внесением и
    публикацией проходят дни, а редакции закона меняются месяцами. Но это
    ДРУГАЯ величина, и в артефакте она обязана называться своим именем.
  - >
    Даты из текста акта НЕ заменяются датами из реестра там, где текст дату
    несёт. Реестр — запасной источник, а не основной: дата в подписи
    принадлежит самому документу, дата в реестре — записи о нём.

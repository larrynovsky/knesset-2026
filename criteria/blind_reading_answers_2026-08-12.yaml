  - bill: 2196634
    verbatim: "не имеет отношения к органам власти"
    maps_to: НЕ ОПРЕДЕЛЕНО
    why: >
      «Вне предмета» и «0 не меняет» — разные утверждения. В контрольном
      наборе кодбука случай «вне оси» допускает и 0, и прочерк
      (ctl-k7-outside, expect_sign (0, None)). Записать это как 0 значит
      решить за читателя вопрос, который он не решал.

  - bill: 2196637
    verbatim: "усиливает сдерживание"
    maps_to: 1

  - bill: 2196793
    verbatim: "не могу сказать"
    maps_to: отказ

  - bill: 2197276
    verbatim: "скорее усиливает сдерживание"
    maps_to: 1
    caveat: >
      «Скорее» сохранено. Для оракула это слабее, чем ответ без оговорки:
      подлог с неуверенным известным ответом штрафует вендора за то, в чём
      не уверен и человек.

  - bill: 2197645
    verbatim: "не имеет отношения к органам власти"
    maps_to: НЕ ОПРЕДЕЛЕНО
    why: то же, что у 2196634.


# Ответы владельца на чтение вслепую. Записаны ДО сверки с вендорами.
#
# ГРАНИЦА §3 — что видел отвечавший и чего не видел:
#   ВИДЕЛ: восемь актов в русском переводе (мой перевод, глоссарий решающих
#     слов, иврит рядом), чек-лист дословно, три варианта ответа и отказ.
#   НЕ ВИДЕЛ: ни одного ответа вендора по этим актам, ни моего мнения о
#     знаке, ни того, что вендоры вообще про них сказали.
#   Автор файла (я) на момент записи ответов вердиктов по этим восьми актам
#   тоже не открывал. Сверка — следующим шагом и отдельным коммитом.
#
# Формат ответа сохранён ДОСЛОВНО. Перевод формулировки в знак НЕ сделан:
# три из восьми ответов не ложатся в тройку −1/0/+1 без домысливания, и
# домысливать за читателя значит подделать оракул.

answers:


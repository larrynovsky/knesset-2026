# budget_mapping — правило сопоставления денежного обязательства из
# коалиционного соглашения с бюджетной строкой. v1.0, ЧЕРНОВИК НА УТВЕРЖДЕНИЕ.
#
# Обоснования и разбор альтернатив — docs/explanation/budget_mapping.md.
# Здесь только норма: что делать и что запрещено.
#
# Объявление канала для scripts/check_criteria_order.py. Сторож проверяет,
# что данных по этим маркерам на момент добавления файла ещё не существовало.
# Маркеры сверяются с ключами data/MANIFEST.json и с путями дерева.
# §3-channel: B-budget
# §3-data-markers: obudget:*, data/budget_*.json, data/commitment_map_*.json, cards/*budget*
#
# =============================================================================
# ГРАНИЦА §3 — что видел автор правила, а что нет
# =============================================================================
# ВИДЕЛ (сторона обязательства и схема):
#   - data/agreements_ocr/CA37-Shas.txt: прочитаны 34 строки, где число стоит
#     рядом с денежной единицей; текст доступен целиком;
#   - схема obudget: имена колонок, длины кодов, покрытие по годам.
#
# НЕ СМОТРЕЛ (сторона результата):
#   - ни одного запроса к бюджету по предмету обязательств. Ни «בתי כנסת»,
#     ни «מקוואות», ни «חינוך» в поле title не искались. Правило написано,
#     не зная, найдётся ли хоть что-нибудь.
#
# Это ЗАЯВЛЕНИЕ, не механизм. §3 сверяет даты коммитов; взгляд артефакта не
# оставляет. Механизируемая часть: порядок коммитов + sha256 этого файла в
# выходном артефакте. Проверяет scripts/check_criteria_order.py.
# =============================================================================

version: "1.0"
status: ЧЕРНОВИК НА УТВЕРЖДЕНИЕ
drafted_at: "2026-07-30"
drafted_by: Claude, по решениям владельца D-1/D-2/D-3 того же дня
approved_at: null
approved_by: null

# Граница §3. Всё, что закоммичено после этого файла по каналу Б, — данные.
# Правка отсюда и далее — только коммитом с префиксом `criteria-revision:`
# и полем «что заставило пересмотреть».

# -----------------------------------------------------------------------------
# 1. ЕДИНИЦА И ПЕРИОД (§1)
# -----------------------------------------------------------------------------
unit: обязательство × год
# Не «партия × обязательство»: обязательство «15 млн ₪ ежегодно» — это три
# наблюдения за 2023, 2024, 2025, и они могут расходиться.

period:
  id: 1095-gov37            # criteria/periods.yaml, валидатор отвергает чужой
  party_he: ש"ס
  start: 2022-12-29
  finish: 2025-07-22
  budget_years: [2023, 2024, 2025]
  excluded_years:
    2022: >-
      правительство сформировано 29.12.2022, бюджет 2022 принят предыдущим
      составом — обязательство физически не могло в него попасть
    2026: >-
      факта нет: raw_budget за 2026 даёт 5 622 строки плана и ноль строк
      net_executed (проверено 2026-07-30)
  # ⚠️ Бюджет 2023–2024 принят ОДНИМ законом в мае 2023. Два года считаются
  # раздельно, но «первоначально утверждённый» для обоих — та же дата принятия.
  # Следствие: у 2023 между подписанием соглашения и утверждением бюджета
  # пять месяцев, у 2024 — семнадцать. Сопоставимость лет этим ограничена,
  # и это записывается в карточку, а не сглаживается.

# -----------------------------------------------------------------------------
# 2. ИСТОЧНИК (§11, §23)
# -----------------------------------------------------------------------------
source:
  api: https://next.obudget.org/api/query
  table: raw_budget
  code_length: 10           # תקנה תקציבית; length(code)=10
  why_not_budget_table: >-
    таблица `budget` — подмножество того же дерева (2023: 1 245 строк против
    7 138), причина отбора не установлена. Обязательство в 30 млн ₪ в ней не
    находится по построению. До выяснения не использовать.
  transfers_table: budget_changes
  snapshot_required: true   # дата + sha256 строки на каждый использованный код

# -----------------------------------------------------------------------------
# 3. ЧТО СЧИТАЕТСЯ ИСПОЛНЕНИЕМ — решение владельца D-1, 2026-07-30
# -----------------------------------------------------------------------------
# Записываются ВСЕ ЧЕТЫРЕ канала. Единого флага «выполнено» не существует:
# §13 запрещает балл, а бинарный флаг — балл с двумя значениями.
channels:
  - key: net_allocated
    what: первоначально утверждённый бюджет
    role: база сравнения по §11
  - key: net_revised
    what: пересмотренный к концу года
    role: показывает, что произошло внутри года
  - key: net_executed
    what: фактически исполненный
    role: показывает, дошли ли деньги
  - key: transfers_in
    what: входящие переносы из budget_changes по тому же коду и году
    role: >-
      различает «дали переносом» и «не дали вовсе». Без него эти два
      противоположных факта сливаются в один ложный «не выполнено»

transfers_query:
  mandatory: true
  # §24-стиль: ловим ОТСУТСТВИЕ. Сопоставление без записанного ответа о
  # переносах — отказ модуля, а не пропуск. Пустой ответ тоже записывается.
  empty_answer_is_an_answer: true
  targeting_proven_default: false
  targeting_note: >-
    перенос в широкую строку НЕ доказывает, что деньги пошли на узкое
    обязательство. Поле targeting_proven поднимается только вручную и только
    при названном свидетельстве (например, текст explanation переноса).

# -----------------------------------------------------------------------------
# 4. ОТБОР ОБЯЗАТЕЛЬСТВ — перепись, не выборка (D-3)
# -----------------------------------------------------------------------------
# Берутся ВСЕ денежные пункты документа. Отбора нет: спорить можно с
# правилом извлечения, но не с тем, что из корпуса выбрали удобное.
extraction:
  money_units: ['מלש"ח', 'מש"ח', 'אלש"ח', 'מיליון', 'מליון', 'מיליארד', 'מליארד', '₪', 'ש"ח', 'שח']
  # Формы, повреждённые распознаванием. Не подобраны руками под удобный
  # результат: найдены НЕЗАВИСИМЫМ детектором — поиском обломка единицы
  # (מלש|מליו|מיליו|שקל|לש'י…) в строках с числом, которые каноническим
  # списком НЕ ловятся. Метод воспроизводим, список — его выход.
  damaged_units: ["מלש'יח"]
  requires_digit: true
  candidate_lines_expected: 42
  # §23: ожидание получено ДВУМЯ путями. 39 — канонический список единиц;
  # +3 — независимый скан обломков (строки 89, 553, 1518).
  #
  # Прежняя редакция объявляла 34 и была НЕВЕРНА: число снято grep'ом по
  # более узкому списку единиц, чем записан здесь же строкой выше (не было
  # מש"ח, אלש"ח, מליארד, שח). Объявленное ожидание расходилось с объявленным
  # правилом — ровно тот дефект, против которого §23 и написан, только внутри
  # самого §23. Расхождение при прогоне — повод остановиться, а не подкрутить.
  #
  # Цена ошибки была бы не арифметической: строка 553 — «строительство синагог
  # 50 млн ₪», строка 1518 — 50 млн ₪ с ЯВНО НАЗВАННЫМ кодом תקנה 22010203.
  # Оба пункта выпали бы из переписи молча, и документ выглядел бы полным.

  # Если текст сам называет код бюджетной статьи (строка 1518: «תחודש תקנה
  # תקציבית 22010203»), сопоставление задано автором соглашения, а не нами.
  # Такой код берётся напрямую, granularity = exact_takana, поиск по терминам
  # не выполняется. Это единственный случай, когда сопоставление не является
  # решением человека, — потому что решение уже принято и опубликовано.
  explicit_code_in_text:
    pattern: 'תקנה תקציבית\s+(\d{8,10})'
    granularity: exact_takana

  # Заголовок перечня и наследование. Правка v1.2, повод — разбор 30.07.
  # Соглашение устроено так: «תתוקצב בבסיס התקציב בנייה ושיפוצים של מבני הדת
  # בסכומים הבאים:» и ниже семь подпунктов, каждый с суммой. Заголовок СУММЫ
  # НЕ СОДЕРЖИТ, поэтому прежняя редакция его не видела вовсе — и все семь
  # подпунктов теряли и «в базе бюджета», и слово «религиозные здания»,
  # то есть ровно тот термин, по которому они находятся.
  heading_inheritance:
    heading_is: >-
      строка без денежной единицы, несущая глагол выделения и оканчивающаяся
      двоеточием либо содержащая «בסכומים הבאים»
    item_is: 'строка, начинающаяся с маркера перечня: א. ב. ג. … · 1. 2. … · +'
    inherit: [in_budget_base, terms]
    stop_at: первая строка, не являющаяся подпунктом

  # Классификация кандидата. Категории закрытые, четвёртой быть не может
  # без criteria-revision.
  categories:
    commitment: >-
      будущее выделение денег государством: יוקצו · תתוקצב · תתקצב · יעמוד על ·
      יתווסף · לייעד · הקצאה של · תקציב בסך של · ייכנס לבסיס התקציב
    status_quo: >-
      описание существующего положения, не обещание: ניתן כיום · הנמצאים כיום ·
      настоящее время без глагола выделения. Пример: строка 1652
      «ניתן כיום סך של כ-3.5 מיליארד ₪» — это база, от которой считают добавку
    unit_rate: >-
      ставка на единицу, а не бюджетная строка: ₪ в месяц, ₪ за точку.
      Примеры: строка 725 (653 ₪ ערך הנקודה), строка 889 (1 200 ₪ לחודש).
      В бюджете ищется не сумма, а строка, из которой ставка платится
    continuation: >-
      продолжение предыдущего пункта, не отдельное обязательство.
      Примеры: строки 1645–1647 продолжают 1644
  # В карточку идут только commitment. Остальные три категории ЗАПИСЫВАЮТСЯ
  # с причиной: «не обязательство» — это результат, а не отсутствие результата.

# -----------------------------------------------------------------------------
# 5. ПОИСК КАНДИДАТА В БЮДЖЕТЕ
# -----------------------------------------------------------------------------
candidate_search:
  method: >-
    ILIKE по raw_budget.title и title_level4/6/8 терминами, ВЫПИСАННЫМИ ИЗ
    ТЕКСТА ОБЯЗАТЕЛЬСТВА. Термин, которого нет в тексте соглашения,
    использовать запрещено: иначе поиск подгоняется под найденное.
  terms_source: цитата обязательства, поле quote_he
  llm_allowed: false
  # §12 Rationale: сопоставление обязательства с бюджетной строкой — решение
  # человека. Не экономия на модели, а граница ответственности.
  max_candidates_shown: 10
  human_decides: true

  # Ранжирование. Правка v1.2, повод — первый прогон по ШАС.
  # Прежняя редакция считала СКОЛЬКО терминов совпало и не смотрела, какие.
  # Слово שיפוץ («ремонт») стоит в сотнях названий статей, מקומות קדושים —
  # в трёх; они весили одинаково, и частое слово топило цитату целиком:
  # «ремонт синагог» вытягивал «ремонт дома Фромина» и «ремонт тюрем», а
  # ветка религиозных зданий не попадала в кандидаты ни разу.
  #
  # Объявляется ФОРМУЛОЙ, а не списком «хороших» слов: список можно подобрать
  # под желаемый результат, формулу — нет. Это единственная защита от того,
  # что правило написано уже после взгляда на результат (см. holdout ниже).
  ranking:
    term_weight: 1 / (1 + df), где df — число статей длины 10, в названии
      которых встречается термин
    row_score: сумма весов совпавших терминов
    rare_term_max_articles: 50
    require_rare_term: true
    # Цитата, в которой нет ни одного термина редче порога, не различает
    # ничего — это и есть законный term_too_generic. Порог 50 из 17 791
    # статьи (0,3%) объявлен здесь и до прогона.

  # §8 — проверка на отложенном материале. Правило изменено ПОСЛЕ взгляда на
  # результат по ШАС, поэтому обязано быть прогнано на партии, результат по
  # которой автор не смотрел. Расхождение доли отказов больше чем вдвое —
  # признак подгонки, а не успеха.
  holdout:
    party: יהדות התורה
    file: CA37-YT.txt
    checked_at: null
    expected_rejection_share: >-
      объявляется ДО прогона: на ШАС отказов было 10 из 21 (48%). Ожидание
      для holdout — 30–65%. Выход за диапазон в любую сторону разбирается,
      а не объявляется результатом

# -----------------------------------------------------------------------------
# 6. ГРАНУЛЯРНОСТЬ — закрытый список (риск R-B1)
# -----------------------------------------------------------------------------
granularity:
  exact_takana: обязательство совпадает с одной строкой длины 10
  subset_of_line: >-
    обязательство — часть строки, в строке есть посторонние расходы.
    ЧИСЛОВОЙ ФАКТ ЗАПРЕЩЁН. Значение строки публикуется только как
    помеченная верхняя граница
  spread_over_lines: обязательство ложится на несколько строк
  not_found: строки не нашлось ни по одному термину из цитаты
  not_budgetary: обязательство неденежное или не через бюджет (см. категории выше)

numeric_fact_allowed_for: [exact_takana]
# Для spread_over_lines числа складываются только при явном решении человека
# с записанным перечнем кодов.

# -----------------------------------------------------------------------------
# 7. В БАЗЕ БЮДЖЕТА ИЛИ РАЗОВО
# -----------------------------------------------------------------------------
in_budget_base:
  # Соглашение само проводит это различение — 12 строк содержат
  # «בבסיס התקציב». Обязательство «в базе» и разовая подачка — разные
  # обещания, и путать их значит терять то, что партия себе прописала.
  agreement_side_marker: בבסיס התקציב | לבסיס התקציב | בבסיס
  budget_side_field: raw_budget.non_repeating
  values: [required_in_base, one_off, not_specified]

# -----------------------------------------------------------------------------
# 8. ПРИЧИНЫ ОТКАЗА — закрытый список
# -----------------------------------------------------------------------------
rejection_reasons:
  no_term_match: ни один термин из цитаты не дал строк
  term_too_generic: >-
    термин дал больше max_candidates_shown строк и сузить его словами из
    цитаты не удалось
  ocr_unreadable: цитата повреждена распознаванием, сумма или предмет не читаются
  not_a_line: обязательство адресовано учреждению, а не строке — искать в supports_data
  human_undecided: человек посмотрел и не смог решить — легальный исход (§4)
# «Не найдено» без одной из этих причин результатом НЕ является.

# -----------------------------------------------------------------------------
# 9. ПРАВИЛО ОСТАНОВКИ
# -----------------------------------------------------------------------------
stopping_rule:
  max_manual_decisions: 25
  on_exceed: остановиться и спросить владельца, не дорешивать самостоятельно
  # Объявлено ДО прогона. Повод: на прошлом этапе про 43% отбракованных
  # ответов узнали постфактум.
  rejected_share_expectation: >-
    доля кандидатов, уходящих в not_found + not_budgetary, заранее неизвестна.
    Ожидание объявляется грубо и вслух: если not_found превысит половину
    категории commitment — это вердикт о непригодности глубины, а не
    неудачный прогон, и он идёт в отчёт как результат

# -----------------------------------------------------------------------------
# 10. ЧТО ЗДЕСЬ НЕ РЕШЕНО (сознательно)
# -----------------------------------------------------------------------------
not_decided_here:
  publication_form: >-
    какие из четырёх чисел карточка покажет читателю и в какой форме —
    решение этапа отчёта. Меняется без criteria-revision: это форма, не
    критерий. Разделение слоёв — причина, по которой D-1 удалось решить
  card_schema: >-
    структура cards/*.yaml, validate_cards.py и build_report.py — отдельная
    задача с отдельным ритуалом

# =============================================================================
# 11. РЕВИЗИЯ 2026-10-10 (v1.3): ПРАВИЛО НА НЕСКОЛЬКО СОГЛАШЕНИЙ
# =============================================================================
# Что заставило пересмотреть: раздел 1 зашивал один период (1095-gov37) и
# один файл; распознанных соглашений 37-го правительства восемь, обязательства
# вытащены из одного. Владелец 10.10: «поехали». Правило извлечения, категории,
# пороги, правило остановки — без изменений; меняется только область.
#
# ГРАНИЦА §3 этой ревизии.
# ВИДЕЛ: шапки восьми OCR-файлов (чьё соглашение, дата); число кандидатов по
#   каждому файлу, снятое ДВУМЯ путями до любого сопоставления (канонический
#   список единиц через map_commitments.candidates + независимый скан обломков
#   единиц в строках с цифрой, не пойманных каноном); criteria/periods.yaml.
# НЕ ВИДЕЛ: ни одного кандидата по существу, ни одного запроса к бюджету по
#   новым файлам, ни одной бюджетной строки под них.
# ЧЕМ ЭТО ГРЯЗНО: автор уже разобрал 4 обязательства ШАС и знает, как
#   выглядит «не нашлось»; ожидания ниже — числа строк-кандидатов, не исходы.
revision_v1_3:
  date: "2026-10-10"
  reason: "область правила: одно соглашение → все распознанные соглашения 37-го правительства"
  unchanged: [extraction, candidate_search, granularity, in_budget_base, rejection_reasons]
  counting_method: >-
    два пути, как в v1.2: (1) map_commitments.candidates по объявленному списку
    единиц; (2) строки с цифрой и обломком единицы (מלש|מליו|מיליו|מליאר|שקל|
    לש'י|אלש|מש"ח|₪|ש"ח), не пойманные путём (1); «במליאה» — не единица
    (ложное срабатывание обломка «מליא», исключено явно).
    На всех восьми файлах путь (2) не добавил ни одной строки к пути (1).

agreements:
  - file: CA37-Shas.txt
    period_id: 1095-gov37
    faction_id: 1095
    party_he: ש"ס
    budget_years: [2023, 2024, 2025]
    candidate_lines_expected: 42
    note: >-
      как в v1.2; регрессия — items не меняются
  - file: CA37-RZ.txt
    period_id: 1105-gov37

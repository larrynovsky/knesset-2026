#
# ГРАНИЦА §3 — что владелец видел и чего не видел, ставя пометки.
# ВИДЕЛ: название акта на иврите и по-русски, год, стадию, пересказ автора
# документа (≤3 предложений, без словаря направления — проверено грепом),
# дословные цитаты норм с переводом.
# НЕ ВИДЕЛ: ни одной позиции фракции, ни одного исхода голосования, ни
# одной даты заседания. Страница собрана render_owner_reading.py, который
# отказывает, если на ней есть имя фракции.
# ЧЕМ ЭТО ГРЯЗНО: владелец читает новости и помнит, кто проводил судебную
# реформу 2023 года; слепота на громких актах иллюзорна, и это названо в
# объявлении до чтения. Запрет имён фракций делает её проверяемой, не
# полной. Пересказы писал автор, знающий метки моделей.
#
# Контроли из объявления, проверены при записи:
#   all_equal_void: пометки НЕ одинаковы (1 допустимо, 4 недопустимо) — результат действителен
#   unreadable_set: «не могу судить» 0 из 5 — набор читаем
#
# §3: этот файл не правится после того, как владелец увидел, кто голосовал.
# Если после показа оснований он скажет, что пометил бы иначе, зная позиции
# фракций, — это записывается отдельным файлом как опровержение слепоты,
# а не правкой этого.


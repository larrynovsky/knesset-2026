# Весь сайт 25-го Кнессета — на полной выгрузке (владелец 20.10, вопрос 6, вариант А).
# Объявлено ДО пересчёта обзора, шпаргалки, страниц списков и динамики.
#
# ГРАНИЦА §3 — ВИДЕЛ: траекторию на полной выгрузке (метки 19 линий, в т.ч. 25-й кусок Ликуда: суд 41–230, экономика 45–31);
#   НЕ ВИДЕЛ: стрелки обзора, устойчивость оси суда, деньги/законы владельца, динамику по полугодиям на полной выгрузке.
#
# §3-channel: site-full
# §3-data-markers: data/arrow_robustness.json, data/dynamics_25.json

votes: >-
  data/votes_25.json заменяется содержимым data/votes_full_25.json (все 1645 законопроектов, голосовавшихся в пленуме, 6773 голосования);
  прежняя выборка сохраняется как data/votes_25_sample_2026-10-07.json. Поимённые по новым голосованиям копируются из
  data/named_votes_cache_full в data/named_votes_cache (тот же vote_id — та же перекличка).
signs: >-
  Ось суда: прежний конвейер build_line_cards.axis_directions (большинство трёх моделей, решающий голос Claude, второе прочтение)
  без изменений; для законов, которых в нём нет, — знак rule_of_law из criteria/full_signs_K25.json (setdefault, как решающий голос Claude).
  Темы: theme_signs_<тема> без изменений; для законов, которых там нет, — criteria/full_signs_K25.json (setdefault).
  Поправка 20.10 (после сверки Codex v92): фильтр второго прочтения (criteria/axis_second_reading_2026-10-19.json) применяется
  и к новым знакам оси — знак по названию, прямо противоречащий прочтению полного текста, снимается (0), как и знак большинства.
  Порядок: прежние источники и setdefault из full_signs, затем фильтр второго прочтения. На 20.10 это меняет один закон: 2204742 (+1 по названию, −1 по тексту → 0).
  Новые знаки — по названиям (Claude + Codex v89b, третье чтение), не выверены вручную; это ниже стандарта «решающей оси» из
  criteria/themes.yaml, и на странице методики это говорится прямо. Устойчивость стрелки (arrow_robustness) пересчитывается на новом составе.

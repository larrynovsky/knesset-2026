# Ожидания к Ф27c: сшивка голосований прямым типизированным ключом
#
# Записаны ДО первого link-only прогона. Коммит с этим файлом обязан быть
# старше data/vote_links_*.json. Промах публикуется наравне с попаданием —
# сегодня уже дважды платили по этому счёту (P1, P3).

version: "1.0"
drafted_at: "2026-07-31"
drafted_by: Claude
повод: >-
  Прежняя сшивка шла по нормализованному имени законопроекта и теряла 77 из 258
  голосований (30%), причём теряла ровно те акты, которые СТАЛИ ЗАКОНАМИ:
  Кнессет переименовывает הצעת חוק X → חוק X при принятии, а заголовок
  голосования хранит имя на момент голосования.

# =============================================================================
# ГРАНИЦА §3 — что видел автор ожиданий, а что нет
# =============================================================================
# §3-channel: vote-links
# §3-data-markers: data/vote_links_*.json, data/votes_25.json
#
# ВИДЕЛ:
#   - что KNS_PlmSessionItem существует (168 887 строк) и несёт ItemID,
#     PlenumSessionID, ItemTypeID, ItemTypeDesc, Ordinal, Name, StatusID;
#   - три голосования по реформе вещания (44626, 46018, 46501) с ItemID=1042100
#     и пункт повестки с ItemTypeID=2, ItemTypeDesc=הצעת חוק;
#   - что LastUpdatedDate в KNS_BillName — дата записи, а не интервал действия:
#     имена первого и второго-третьего чтений проштампованы одной секундой
#     2026-07-08T19:32:15, тогда как первое голосование было 2025-11-04;
#   - прежние числа сшивки: 258 голосований / 119 актов, затем 212 / 144.
#
# НЕ СМОТРЕЛ:
#   - долю голосований, у которых (SessionID, ItemID) вообще резолвится;
#   - распределение ItemTypeID по 7540 заголовкам;
#   - сколько ItemID с типом 2 существуют в KNS_Bill.
#
# Мост найден второй головой (параллельный агент), а не мной: моя разведка
# 30.07 пробовала имя KNS_PlenumSessionItem, получила HTTP-ошибку и записала
# «моста нет». Отказ инструмента на угаданном имени был прочитан как факт о
# мире. Записано здесь, потому что это причина, по которой ожидания ниже
# вообще понадобились.
# =============================================================================

предсказания:

  - id: P7
    что: сколько нынешних сшитых голосований восстановит прямой ключ
    ожидание: "не менее 190 из 212, и все три потерянных акта"
    почему: >-
      Прямой ключ не зависит от имени и потому не должен страдать от
      переименования. Нижняя граница 190 оставляет запас на голосования, где
      пункт повестки отсутствует или имеет иной тип.
    чем_опровергается: >-
      Меньше 150 означает, что прямой ключ не несущий, и история имён
      возвращается из запасного пути в основной. Это законный исход, и он
      обязан быть назван, а не обойдён добавлением второго механизма молча.

  - id: P8
    что: доля ItemID с ItemTypeID=2, существующих в KNS_Bill
    ожидание: "не ниже 0.95"
    почему: >-
      Тип «законопроект» обязан означать, что идентификатор принадлежит
      пространству законопроектов. Три примера это подтверждают, но три примера
      не выборка.
    чем_опровергается: >-
      Ниже 0.95 означает, что ItemTypeID не означает того, что мы думаем, и
      прямой ключ нельзя принимать по одному лишь типу. Тогда нужен третий
      признак, а не понижение порога.
    почему_важно: >-
      Это единственная защита от полиморфного ItemID: процедурное голосование,
      чей ItemID случайно совпал с BillID, получило бы направление закона.

  - id: P9
    что: сколько принятых связей имеют более одного BillID
    ожидание: "ноль"
    почему: >-
      Не «мало». Связь с двумя кандидатами — не связь. Неоднозначность
      записывается отдельным исходом и считается, но НИКОГДА не разрешается
      порядком строк в файле, как сейчас (dict.setdefault).
    чем_опровергается: >-
      Любое ненулевое значение означает, что механизм где-то всё-таки выбирает
      молча, и его надо искать, а не округлять.

  - id: P10
    что: сколько актов переписи не доживает до сшивки из-за схлопывания имён
    ожидание: "после правки — ноль; до правки — 193"
    почему: >-
      1017 актов переписи превращаются в 824 нормализованных имени. Разница в
      193 акта сейчас исчезает внутри словаря молча. Это не «риск перепутать»:
      эти акты перестают существовать для сшивки вовсе.
    чем_опровергается: >-
      Ненулевая потеря после правки означает, что схлопывание переехало в
      другое место, а не исчезло.

что_НЕ_предсказывается: >-
  Итоговое число сшитых голосований. Рост покрытия не является успехом:
  триста связей со слабым основанием хуже полутораста доказанных. Считается
  распределение по КЛАССАМ доказательства, а суммарный показатель «стало
  больше» объявляется бессмысленным заранее, чтобы им нельзя было отчитаться.

классы_исхода_сшивки:
  правило: >-
    Классы обязаны образовывать полное разбиение всех 7540 заголовков: сумма по
    классам равна общему числу, иначе где-то тихая потеря.
  перечень:
    direct_bill_id: >-
      (SessionID, ItemID) подтверждён пунктом повестки с ItemTypeID=2, и ItemID
      существует в KNS_Bill.
    unique_alias: >-
      прямого ключа нет, но точное историческое имя указывает ровно на один
      BillID.
    ambiguous: >-
      кандидатов больше одного. Связь НЕ принимается, запись считается.
    non_bill_item: >-
      пункт повестки существует, но не законодательный. НЕ терминальный класс:
      вотум недоверия, назначения, роспуск и создание следственных комиссий
      затрагивают пункты B2, C1, D3 чек-листа. Классификатор их не берёт —
      единица наблюдения по K2 есть норма в тексте закона, — но молчание про
      них в отчёте читается как «претензий нет» (§7). Класс обязан быть
      посчитан и назван, а не закрыт.
    unmatched: >-
      не нашлось ничего. Считается и печатается.

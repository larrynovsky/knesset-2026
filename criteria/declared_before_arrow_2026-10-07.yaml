# Правило стрелки канала А. Объявлено ДО первого платного запроса и ДО того,
# как автор увидел, сколько актов пройдёт эти пороги.
#
# Стрелка — это значение клетки обзора: укрепляла фракция названную ось,
# ослабляла, или и туда и обратно. Сейчас в клетке стоит «мы сюда не дошли»
# по всем шестнадцати строкам, и это правда: классификация направления встала
# 29.07.2026 на согласии вендоров 83,3% против объявленного порога 85%.
#
# ПРАВИЛО БЫЛО НАПИСАНО 14.08.2026 И ПОТЕРЯНО: контейнер сессии вычистили, а
# закоммитить не удалось — мост к Маку в тот вечер лежал. Это восстановление
# объявленного, не новое решение. Отличия от версии 14.08 ровно два, и оба
# названы: горизонт данных теперь 2026-09-01 (было 2026-07-18), и добавлена
# часть «смысл за» — её в версии 14.08 не было вовсе.
#
# ГРАНИЦА §3 — что автор видел и чего не видел:
#   ВИДЕЛ: что прямым ключом достигается 277 актов переписи против 144 в
#     выгрузке от 31.07; что голосований, сшитых прямым ключом, 1809;
#     распределение уверенности на ПРЕЖНЕМ составе 57 актов
#     (data/direction_v3.json: high 6 · medium 11 · low 31 · none 7 на 55
#     актах с ответом обоих вендоров); средние токены по 318 вызовам кэша.
#   НЕ ВИДЕЛ: ни одного направления на новом составе; ни одной стрелки ни у
#     одной фракции; какое согласие вендоров даст новый состав; сколько актов
#     переживёт очистку. Поимённые результаты на момент написания этого файла
#     ещё выкачиваются — автор не знает, у кого сколько голосов.
#   ЧЕМ ЭТО ГРЯЗНО: все пять порогов ЗАИМСТВОВАНЫ из чужих методик и ни один
#     не калиброван на этих данных. Заимствование — не доказательство
#     пригодности. Объявлены они заранее именно потому, что калибровать порог,
#     увидев результат, — подгон того класса, который §3 запрещает.
#
# §3-channel: direction-arrow
# §3-data-markers: data/direction_arrow_*.json, data/arrow_*.json
#   Маркеры описывают то, что канал ПОРОДИТ. data/votes_25.json,
#   data/bill_texts и data/direction_v3.json — вход, они существуют с июля и
#   августа; стоять в маркерах они не имеют права, иначе критерий объявил бы
#   нарушением сам факт, что есть материал, ради которого он написан.

run_id: arrow_2026-10-07
horizon: 2026-09-01          # там, где кончились данные, а не календарь
# объявлено в criteria-revision 13.08; google в прогон не идёт
pair: [anthropic, openai]
unit: фракция × ось          # §1: канал А считает фракцию, не партию-в-правительстве

# ── ЧАСТЬ 0. СМЫСЛ «ЗА» (§10) ─────────────────────────────────────────────
# §10 запрещает предполагать, что означает голос «за». На выгрузке от 31.07
# все 212 голосований укладывались в десять пар описаний, и «против» во всех
# десяти было одно: «отклонить предложение». На новом составе (1809
# голосований) набор пар будет ШИРЕ, и сколько в нём значений — автор не
# знает. Поэтому объявляется не таблица, а правило её построения.
sign_meaning:
  table: docs/reference/for_option_sign_<дата>.json
  built_by: пересчётом всех различных пар (for_option_desc, against_option_desc)
  committed: до первого запуска стрелки, как reference
  rule: >-
    у каждой пары ровно одно из трёх значений: carries — «за» продвигает сам
    акт и знак акта переносится на фракцию как есть; inverts — «за» означает
    отклонить или вернуть, знак переворачивается; none — голос не несёт знака
    акта вовсе.
  none_known_so_far:
    oговорка: >-
      לקבל את ההסתייגות — «принять оговорку». Оговорка часто двигает закон в
      сторону, ПРОТИВОПОЛОЖНУЮ законопроекту. На выгрузке от 31.07 таких было
      24 из 212, то есть каждое девятое голосование.
    решение: >-
      לקבל את ההחלטה בדבר — «принять решение по вопросу»: не законопроект.
    передача: >-
      לקבל את המלצת ועדת הכנסת להעביר את הצעת החוק מוועדה לוועדה — передача из
      комитета в комитет: процедура без содержания.
  unknown_value: >-
    ОТКАЗ прогона, а не умолчание. Значение for_option_desc, которого нет в
    таблице, останавливает стрелку. Неверно объявленная таблица всё равно
    сработает; отсутствующая — никогда (§23 в приложении к смыслу).

# ── ЧАСТЬ 1. ОЧИСТКА ──────────────────────────────────────────────────────
cleaning:
  drop_lopsided_below: 0.025
  min_acts_for_arrow: 20
  source: >-
    W-NOMINATE: XVMIN=0.0250 (акт, где меньшинство меньше 2,5% голосов, не
    несёт различающей информации) и KVMIN=20 (минимум голосований на единицу).
  transfer_named: >-
    KVMIN=20 объявлен у W-NOMINATE для ДЕПУТАТА. Здесь единица — фракция, и
    это перенос, а не теорема. Проверить переносимость нечем, поэтому порог
    объявлен заранее и назван переносом. Если у фракции меньше 20 актов после
    очистки, стрелки нет и в клетке остаётся «мы сюда не дошли» — не «ничего
    не делала».
  запрещено: >-
    Snyder, LSQ 1992: отбор актов ПО ИХ РАЗДЕЛЯЮЩЕЙ СИЛЕ раздувает
    поляризацию и не обнаруживается проверкой результата. Отбрасывание по
    заранее объявленному порогу единогласия — обратная операция и законно;
    отбор по тому, как хорошо акт делит фракции, запрещён.

# ── ЧАСТЬ 1.5. ПОЗИЦИЯ ФРАКЦИИ ИЗ ГОЛОСОВ ДЕПУТАТОВ ───────────────────────
# Добавлено 07.10.2026, до коммита этого файла и до того, как автор посмотрел
# хоть на одну позицию хоть одной фракции: выгрузка в этот момент ещё качается.
# Решение всплыло при написании кода и было бы принято молча внутри него —
# поэтому выписано сюда. Единица канала А объявлена как «фракция × действие ×
# дата», но КАК из голосов отдельных депутатов получается голос фракции, не
# было сказано нигде.
faction_position:
  rule: >-
    сторона, за которую подано больше голосов «за»/«против» среди депутатов
    фракции. Воздержавшиеся и отсутствующие в знаменатель не входят: они не
    позиция, а её отсутствие.
  split_measure: индекс Райса — |за − против| / (за + против)
  split_below: 0.5
  split_outcome: >-
    голосование не даёт позиции фракции и в стрелку не входит. Не «фракция
    воздержалась» и не «фракция против» — у фракции в этом голосовании нет
    одной позиции, и это отдельное состояние.
  source: >-
    Rice 1925, индекс когезии партии в легислатуре — стандартная мера с
    1925 года. Порог 0.5 означает, что меньшинство внутри фракции больше
    четверти поданных голосов.
  transfer_named: >-
    САМ ИНДЕКС заимствован, ПОРОГ — нет: у Райса это мера, а не правило
    отсечения, и 0.5 выбран здесь. Это перенос, объявленный заранее именно
    потому, что обосновать его нечем. Израильский антидефекционный закон
    делает фракции очень когезивными, поэтому ожидается, что порог почти
    никогда не сработает; если он срежет больше десятой части голосований —
    порог не годится, и это замер, а не мнение.
  why_it_matters: >-
    Без правила раскол читался бы как позиция большинства, то есть фракции
    приписывалось бы единство, которого в этом голосовании не было. При
    одном голосе перевеса из восьми поданных — особенно заметно.

# ── ЧАСТЬ 2. СОГЛАСИЕ ВЕНДОРОВ ────────────────────────────────────────────
agreement:
  measure: альфа Криппендорфа
  unit: акт
  thresholds:
    acceptable: 0.800
    tentative: 0.667
  source: Krippendorff — ≥0.800 приемлемо, 0.667–0.800 предварительно, ниже непригодно
  boundary_named: >-
    Согласие двух вендоров НЕ валидирует вывод. Оба читают один и тот же
    ивритский текст одним и тем же промптом: общая систематическая ошибка даёт
    ВЫСОКОЕ согласие. Инвариант external_anchor_is_not_validation про это
    дословно. Поэтому согласие само по себе не может поднять формулировку —
    см. часть 3.

# ── ЧАСТЬ 3. ФОРМУЛИРОВКА ─────────────────────────────────────────────────
wording:
  source: GRADE — четыре уровня определённости, четыре готовых шаблона
  level: худшее из (согласие, охват)
  coverage_floor: >-
    охват ниже половины актов темы принудительно опускает до низшего уровня,
    каким бы ни было согласие. Это то место, где согласие вендоров не может
    купить уверенность.
  templates:
    high: "фракция {X} по этой оси: {стрелка}"
    moderate: "вероятно {стрелка}; у нас {N} актов из {M}"
    low: "свидетельства расходятся; что мы видим — {стрелка}, и мы в этом не уверены"
    very_low: "сказать нечего: {причина}"
  forbidden_words: >-
    в шаблонах нет слов «лучшая», «худшая», «рейтинг», «балл» (§13) и нет
    нашего внутреннего языка (список — scripts/check_report_canon.FORBIDDEN).
  # ── criteria-revision 07.10.2026, причина названа ────────────────────────
  level_at_miss: >-
    при miss уровень — very_low, причина — число актов; формула «худшее из
    (согласие, охват)» к нему не применяется. ПРИЧИНА ПРАВКИ: уровень
    уверенности относится к утверждению, а при miss утверждения нет —
    считать уверенность в отсутствующем знаке значит дать читателю
    «уверенно нечего сказать». Расхождение между формулой и кодом нашёл
    Кодекс в состязательном ревью 07.10; код здесь оказался правее
    объявления, поэтому правится объявление, а не код. Правка внесена ДО
    того, как по этому правилу посчитана хоть одна живая клетка: в
    карточках 0 блоков axis_institutions, платный прогон не закончен.
  level_reason_required: >-
    у very_low причина обязана быть названной (§6). Если уровень опущен
    охватом — причина «охват N из M: меньше половины актов темы». Пустая
    строка в шаблоне «сказать нечего: {причина}» не причина, а её
    отсутствие, выданное за причину.

# ── ЧАСТЬ 4. «И ТУДА И ОБРАТНО» ───────────────────────────────────────────
both_ways:
  measure: 95% интервал Уилсона на доле актов, сдвинутых фракцией вниз
  rule: интервал накрывает 0.5 ⇒ ↕ «и туда и обратно»
  source: >-
    Manifesto Project (Benoit, Laver, Mikhaylov 2009) мерит неопределённость
    бутстрапом. Уилсон отвечает на тот же вопрос дешевле и без симуляции —
    это осознанная замена, а не незнание первоисточника.
  why_it_matters: >-
    Без этой части фракция с 11 актами вниз и 9 вверх получила бы ↓, как если
    бы она последовательно ослабляла. ↕ — не отговорка, а утверждение: по этой
    оси фракция вела себя не в одну сторону.

# ── ЧАСТЬ 5. ВЕС ──────────────────────────────────────────────────────────
weighting:
  rule: все акты равны
  why: >-
    Взвешивание по важности — это и есть отбор, и он подгоняется задним числом
    незаметно (§3). Отказ от веса объявлен, а не получился сам собой: акт о
    продлении чрезвычайных постановлений и акт о полномочиях юридического
    советника весят одинаково, и это заведомо неверно по существу. Но
    неверность здесь объявлена и одинакова для всех фракций, а веса были бы
    неверностью в пользу того, кто их расставил.

# ── ЧЕГО ЭТО ПРАВИЛО НЕ ДЕЛАЕТ ────────────────────────────────────────────
not_transferred:
  единица: >-
    не переносит направление акта на партию: единица канала А — фракция ×
    парламентское действие × дата (§1), и строка бюллетеня получает стрелку
    только через утверждённую преемственность.
  тема: >-
    не читается как «партия такая»: стрелка про поступки по одной объявленной
    теме, и оговорка «по вопросам правового государства» обязана стоять ПРИ
    стрелке, а не в подвале (инвариант votes_need_theme_caveat).
  связь: >-
    не заполняет клетку у строки со статусом lineage_unresolved: там не
    «не дошли», а неизвестно чья фракция, и это другое состояние (§7).

# ── ЧЕМ ЭТО ОПРОВЕРГАЕТСЯ ─────────────────────────────────────────────────
falsification:
  согласие_ниже_порога: >-
    если альфа Криппендорфа на новом составе окажется ниже 0.667 — стрелка не
    публикуется вовсе, и в клетке остаётся «мы сюда не дошли». Это законный
    исход, объявленный заранее.
  порог_переноса_негоден: >-
    если после очистки у больше чем половины фракций меньше 20 актов — порог
    переноса KVMIN=20 для фракций не годится, и это замер, а не мнение.
  стрелка_против_соглашения: >-
    если у фракции, бывшей в правительстве весь период, стрелка окажется
    противоположной её же подписанному соглашению — либо знак прочитан
    неверно, либо соглашение не исполнялось; различить это стрелкой нельзя, и
    такой случай останавливает публикацию до ручного разбора.

# Чтение актов владельцем: правило отбора, форма пометки, контроль. Объявлено
# ДО того, как владелец увидел хоть один акт, и до того, как собрана страница.
#
# §3-channel: owner-reading
# §3-data-markers: criteria/owner_marks_*.yaml, report/owner_reading_*.html, data/selection_owner_reading_*.json
#
# ГРАНИЦА §3 — что автор видел и чего не видел.
#
# ВИДЕЛ: все 1809 поимённых голосований темы «правовое государство» с
# позициями 15 фракций; таблицу 14 актов с наибольшим числом голосований и
# то, что на них зал делится строго по коалиционной линии; метки обеих
# моделей (кодбуки 1.2 и 1.3) по 275 актам, включая знак и нормы с цитатами.
# НЕ ВИДЕЛ: ни одной пометки владельца — их не существует.
# ЧЕМ ЭТО ГРЯЗНО: автор знает, какие акты модели сочли ослабляющими, и будет
# писать русский пересказ актов. Защита ниже: правило отбора механическое и
# не использует ни меток, ни позиций фракций; цитаты отбираются механически;
# пересказу запрещён словарь направления и любые имена фракций, и это
# проверяется грепом, а не обещанием.

declared_at: 2026-10-10
owner_decision: "10.10.2026: «Да, давай» — владелец читает акты и помечает"
decision_date: 2026-10-27

why:
  purpose: >-
    Замысел (docs/ZAMYSEL.md): документ, после которого можно вычеркнуть
    два-три списка и объяснить себе почему. Свод (§13, criteria/themes.yaml)
    запрещает документу ставить вердикт «ослабляла»: факт держим, вердикт
    делает читатель. Машинная метка направления дважды не прошла порог,
    объявленный до прогона (α 0,5781 < 0,667; условие 4 пилота 1.3).
    Значит суждение о направлении акта принадлежит владельцу. Здесь
    объявляется, как оно снимается, чтобы его нельзя было подогнать.
  what_this_is_not: >-
    Не замена метки по 275 актам. Не оценка партий. Не порог «сколько актов
    достаточно» — порога в документе нет (§13), владелец читает основания
    и решает сам 27.10.

population:
  source: data/votes_25.json
  snapshot: "2026-10-07T10:19:25"
  window_end: "2026-09-01"
  rule: >-
    акты темы rule_of_law, у которых есть хотя бы одно голосование, где
    «за» двигает сам акт (sign_of ≠ none по docs/reference/for_option_sign_2026-10-07.json)
  expected_size: 277   # перепись карточек; при расхождении — назвать, не править

selection:
  size: 5
  part_a:
    n: 3
    rule: >-
      три акта с наибольшим числом поимённых голосований (всех видов,
      включая оговорки); при равенстве — меньший bill_id
    why: >-
      число голосований — механический признак спорности, уже используемый
      в render_landmark_table.py. Он НЕ использует ни позиции фракций,
      ни метки моделей. Автор знает, что это даст коалиционный раскол —
      именно поэтому нужна часть b.
    expected: [2207472, 2201200, 2201202]   # §23: ожидание записано до запуска
  part_b:
    n: 2
    rule: >-
      два акта, взятые random.Random(seed).sample из популяции без части a;
      seed = sha256("owner-reading-2026-10-10|" + snapshot).hexdigest()
    why: >-
      контроль, что владелец не помечает всё подряд: случайные акты темы
      с вероятностью ~0,9 не являются громкими (14 громких из 277).
    expected: unknown   # не вычислялось до коммита этого файла; проверяется тем же seed
  order_shown: random.Random(seed).shuffle над пятью — без привязки к части

page:
  path: report/owner_reading_2026-10-10.html
  per_act_shows:
    - название на иврите и по-русски (docs/reference/vote_names_ru_*.json)
    - год и стадия принятия (без дат голосований — дата выдаёт сессию и зал)
    - пересказ «что изменилось в праве» ≤ 3 предложений — АВТОР ДОКУМЕНТА
    - цитаты норм: иврит + перевод
  quotes_rule: >-
    механически: нормы из сохранённых ответов обеих моделей (кодбук 1.2,
    data/direction_arrow_2026-10-07.json) с quote_found == "exact",
    дедупликация по quote_he, порядок — по позиции цитаты в тексте акта;
    знак, пункт чек-листа и имя модели НЕ показываются
  per_act_forbidden:
    - любое имя фракции или списка (criteria/faction_names_ru.yaml, обе колонки)
    - слова: ослабля, усилива, сдерж, коалиц, оппозиц, правительств, большинств
    - число голосов за/против и исход голосования
  why_forbidden: >-
    слепота снимает один перекос — симпатию к партии. Холодное чтение 08.10
    показало, что на громких актах слепота иллюзорна (владелец помнит, кто
    проводил судебную реформу). Запрет не делает её полной; он делает её
    проверяемой: страница, на которой есть имя фракции, не собирается.

marks:
  file: criteria/owner_marks_2026-10-<день>.yaml
  scale: [недопустимо, допустимо, не_могу_судить]
  per_act_optional: why — одна-две фразы владельца, свободный текст
  one_sitting: true
  commit_rule: >-
    пометки коммитятся ПОСЛЕ этого файла (check_criteria_order.py видит
    порядок) и НЕ правятся после того, как владелец увидел, кто голосовал

controls:
  all_equal_void: >-
    если все пять пометок одинаковы — результат недействителен: прибор
    измерил расположенность, а не акты. Страницу оснований не собирать.
  unreadable_set: >-
    если «не могу судить» на трёх и более из пяти — непригодны пересказы,
    а не владелец; набор НЕ расширять без нового объявления
  what_would_falsify_method: >-
    владелец, посмотрев потом колонки голосований, говорит, что пометил
    бы иначе, зная, кто голосовал. Тогда слепота не работала и основания
    принадлежат не ему. Записать как есть.

grounds:
  rule: >-
    для каждого акта с пометкой «недопустимо» документ показывает: кто
    голосовал ЗА на последней стадии, где «за» двигает акт (обычно третье
    чтение); кто ПРОТИВ; у кого позиции нет — с числом поимённых в этом
    голосовании, чтобы 64 против 120 было видно (уход из зала неотличим
    от отсутствия); плюс все предыдущие стадии акта той же таблицей
  no_threshold: >-
    документ не говорит «вычеркнуть». Он говорит «проголосовали за акт,
    который ты пометил». Сколько таких актов нужно, решает владелец.
  not_a_score: §13 — никакой колонки с числом, по которой можно отсортировать

cost:
  owner_hours: "1.5–2, один заход"
  author_hours: "6–8"
  api_usd: 0

oracles:
  - scripts/render_owner_reading.py --selftest:
      - подложить имя фракции в пересказ → сборка отказывает
      - подложить слово из per_act_forbidden → отказывает
      - selection при том же seed даёт те же 5 bill_id (детерминизм)
      - part_a == expected, иначе красный с перечислением
      - цитата с quote_found != exact не попадает на страницу
  - scripts/check_criteria_order.py: этот файл старше owner_marks_*.yaml
  - нет оракула на правильность пересказа — его может оспорить только
    читающий законодательный иврит, по цитатам рядом; это названо на странице

# Пилот структурированного диффа. Объявлено ДО первого платного запроса.
#
# Вопрос пилота ровно один: слабость канала А — это дефект ПОДАЧИ акта
# вендору или дефект самого акта? Нынешняя подача — сплошной ивритский текст
# поправочного закона: «в статье 15, вместо "X" читать "Y"». Гипотеза: вендор
# возвращает пустое множество норм не потому, что норм нет, а потому что не
# держит в голове, что именно меняется. Структурированная подача (адрес +
# тип операции + фрагмент «было» + фрагмент «станет») даёт то же содержание
# без синтеза: «станет» лежит в самом акте после «יבוא».
#
# ГРАНИЦА §3 — что автор видел и чего не видел:
#   ВИДЕЛ: распределение уверенности по data/direction_v3.json (55 актов с
#     ответом обоих вендоров: high 6 · medium 11 · low 31 · none 7); разбивку
#     38 слабых актов по причинам (пусто 20 · разные множества 12 · чтение 6);
#     число актов с извлекаемыми операциями (12) и их номера — они ниже;
#     число слабых актов без операций, но с уже выкачанной базой закона (15).
#   НЕ ВИДЕЛ: ни одного ответа вендора в структурированном режиме. Ни одного
#     собранного описания операции. Как выглядит акт после переупаковки —
#     не проверял ни на одном.
#   ЧЕМ ЭТО ГРЯЗНО: номера двенадцати актов получены разовым кодом в сессии,
#     а не скриптом репозитория. Поэтому список ниже объявлен как ПРЕДСКАЗАНИЕ
#     P44, которое обязан воспроизвести scripts/select_structdiff_pilot.py.
#     Если селектор даст другой список — красное, и виноват замер, а не акты.

# §3-channel: direction-structdiff
# §3-data-markers: data/structdiff_*.json, data/pilot_structdiff_*.json
#   Маркеры описывают то, что этот канал ПОРОДИТ, а не то, что он читает.
#   data/direction_v3.json и data/bill_texts — вход, они существуют с 11.08 и
#   в маркерах стоять не имеют права: иначе критерий объявил бы нарушением
#   сам факт, что есть исходный замер, ради которого он написан.

run_id: structdiff_2026-08-13
source_of_weak: data/direction_v3.json
pair: [anthropic, openai]
instrument: scripts/direction_confidence.py   # verdict(), закоммичен 01.08

# ── АРИФМЕТИКА, КОТОРАЯ ОГРАНИЧИВАЕТ СМЫСЛ ПИЛОТА ─────────────────────────
# Ориентир владельца (о6, 12.08): каналу нужно 60% актов с medium|high.
# Сейчас 17 из 55 (31%). Порог — 33 акта. Значит спасти надо +16.
# Пилот трогает 12 актов. ДАЖЕ ПОЛНЫЙ УСПЕХ ПИЛОТА НЕ ЗАКРЫВАЕТ КАНАЛ:
# 17 + 12 = 29 из 55 = 53% < 60%. Это записано здесь, чтобы удачный исход
# нельзя было прочитать как «канал спасён».
# Что пилот РЕАЛЬНО решает: оправдан ли второй, дорогой заход. Из 26 слабых
# актов без извлекаемых операций у 15 адрес указывает на закон, база которого
# уже выкачана (data/law_texts.json) — там «было» берётся из базы, а не из
# акта. 12 + 15 = 27; 17 + 27 = 44 из 55 = 80%. Дорога до 60% существует
# только если работают ОБЕ половины. Дешёвая проверяется первой.
ceiling:
  acts_measured: 55
  strong_now: 17
  target_share: 0.60
  target_acts: 33
  pilot_touches: 12
  best_case_after_pilot: 29
  best_case_share: 0.53
  reachable_with_base: 27      # 12 операций + 15 адресов с выкачанной базой
  unreachable_now: 11          # 8 адресов без базы + 3 акта без адреса

# ── ЗАПРЕТ НА СМЕШИВАНИЕ ВМЕШАТЕЛЬСТВ ─────────────────────────────────────
# Поправка второго агента (13.08) принята. Владелец в о4 согласился оплатить
# один прогон, и соблазн был сложить в него два изменения сразу:
# структурированную подачу И откат промпта к редакции «ПОЛНОТА». Запрещено:
# при двух вмешательствах в одном прогоне ни один исход не атрибутируется.
# Промпт в режимах N и S БАЙТ В БАЙТ ОДИН И ТОТ ЖЕ, меняется только тело акта.
forbidden_in_this_run:
  - "откат или правка промпта (в т.ч. возврат блока ПОЛНОТА)"
  - "смена вендоров, моделей или температуры"
  - "добавление третьего вендора в пару уверенности"

# ── ЧТО СЧИТАЕТСЯ ИЗВЛЕКАЕМОЙ ОПЕРАЦИЕЙ ───────────────────────────────────
# Три вида, и все три извлекаются из ТЕЛА АКТА, без базового текста закона.
# Тело режется operative() из scripts/resolve_law_ref.py — до «דברי הסבר»,
# потому что пояснительная записка цитирует те же обороты и даёт фантомы.
# Кавычки: ASCII ", ивритский гершаим ״ (U+05F4), типографская ” (U+201D).
operations:
  replace:
    shape: 'במקום "X" יבוא "Y"'
    rx: 'במקום\s+["״”]([^"״”\n]{2,200})["״”]\s*יבוא\s+["״”]([^"״”\n]{2,400})["״”]'
    gives: [before, after]
  insert:
    shape: 'אחרי / בסוף / לפני "X" יבוא "Y"'
    rx: '(?:אחרי|בסוף|לפני)\s+["״”]?([^"״”\n]{0,120})["״”]?\s*יבוא\s+["״”]([^"״”\n]{2,600})["״”]'
    gives: [anchor, after]
  delete:
    shape: 'X – בטל'
    rx: '^\s*(.{2,200}?)\s+[–\-]\s*בטל\s*\.?\s*$'
    gives: [before]
eligibility: "не менее одной операции любого вида в operative(тело акта)"

# ── СОСТАВ ПИЛОТА ─────────────────────────────────────────────────────────
# Перекос назван, а не сглажен: категория «чтение» даёт НОЛЬ пригодных актов.
# Значит пилот ничего не скажет про случай, когда вендоры видят одни нормы и
# читают их противоположно. Он говорит только про НЕИЗВЛЕЧЕНИЕ.
composition:
  weak_total: 38
  by_reason: {пусто: 20, разные_множества: 12, чтение: 6}
  eligible_by_reason: {пусто: 9, разные_множества: 3, чтение: 0}
  acts:                        # bill_id: [категория, замен, вставок, отмен]
    2195773: [пусто, 1, 0, 0]
    2196634: [пусто, 2, 2, 0]
    2196793: [пусто, 0, 0, 2]
    2197033: [пусто, 0, 3, 0]
    2198130: [пусто, 0, 4, 0]
    2198577: [пусто, 3, 0, 0]
    2199186: [пусто, 0, 3, 0]
    2202381: [пусто, 0, 1, 0]
    2207173: [пусто, 3, 0, 1]
    2203980: [разные_множества, 1, 0, 0]
    2220431: [разные_множества, 3, 2, 0]
    2230836: [разные_множества, 6, 11, 0]

# ── ТРИ РЕЖИМА ────────────────────────────────────────────────────────────
# Промпт и вопрос во всех трёх идентичны. Меняется ТОЛЬКО тело акта.
modes:
  N:
    what: "нынешняя подача — сплошной текст акта, как в direction_v3"
    role: "контроль прибора: вендор мог просто подрейфовать с 11.08"
  S:
    what: >
      акт как список операций: закон · адрес статьи · вид операции ·
      фрагмент «было» · фрагмент «станет». Всё извлечено из самого акта,
      ничего не синтезировано и не дописано. Порядок операций — как в акте.
    role: "проверяемое вмешательство"
  P:
    what: >
      та же структурная форма, но операции взяты из ДРУГОГО акта пилота,
      ближайшего по числу операций; шапка (название, номер) — целевого акта.
    role: >
      плацебо на ФОРМУ. Если структура сама по себе заставляет вендоров
      согласиться друг с другом — согласие в P будет не хуже, чем в S, и
      тогда прирост в S измеряет послушание форме, а не понимание.

# ── ЧТО СЧИТАЕТСЯ «АКТ СПАСЁН» ────────────────────────────────────────────
# Два условия, и второе важнее первого. Без него любой рост согласия можно
# получить, заставив вендоров цитировать одно и то же вымышленное.
saved:
  cond_1: "verdict() из direction_confidence.py даёт medium или high"
  cond_2: >
    привязка к фрагментам: не менее половины ОБЩИХ норм пары (тех, что
    сопоставились в pair_norms) нормализованно входят в конкатенацию
    фрагментов операций ЭТОГО акта.
  threshold_note: >
    Половина — объявленная произвольная величина, не выведенная. Она может
    оказаться слишком мягкой: вендор способен процитировать один фрагмент
    буквально и второй сочинить. Что при 0.5 проходит именно такой случай —
    названная дыра, а не забытая.
  placebo_note: >
    В режиме P cond_2 проваливается ПО ПОСТРОЕНИЮ: фрагменты чужие. Поэтому
    P — оракул на измеритель, а не только на вмешательство: если хоть один
    акт «спасён» в P, значит cond_2 сломан, и весь прогон читать нельзя.

# ── ОБЪЯВЛЕННЫЙ ОБЪЁМ (§23) ───────────────────────────────────────────────
# 12 актов × 3 режима × 2 вендора = 72 запроса. Со стоп-правилом — 36.
# Число фактически сделанных запросов обязано быть РОВНО 36 либо РОВНО 72.
# Любое третье значение — отказ, а не строка в логе: значит часть актов
# молча выпала, и доли считаются от неизвестного знаменателя.
volume:
  acts: 12
  modes: 3
  vendors: 2
  calls_full: 72
  calls_after_futility_stop: 36
  legal_call_counts: [36, 72]
# КЭШ — ловушка этого прогона. data/llm_cache ключуется по промпту и телу.
# Тело в N и S разное, значит коллизии быть не должно; но если ключ считается
# по bill_id — режим S молча получит ответ режима N, и пилот покажет «разницы
# нет» при неработающем вмешательстве. Проверка обязана стоять В КОДЕ:
# три режима одного акта дают три РАЗНЫХ ключа кэша, иначе отказ до запросов.
cache_guard: "три режима одного акта ⇒ три разных ключа кэша; совпадение — отказ"

# ── ПОРЯДОК И СТОП-ПРАВИЛО ────────────────────────────────────────────────
# Первая шестёрка намеренно НЕ «первые шесть по номеру»: так в неё попали бы
# одни «пусто», и стоп-правило проверяло бы одну категорию из двух.
batch_1: [2195773, 2196634, 2196793, 2197033, 2203980, 2220431]
batch_2: [2198130, 2198577, 2199186, 2202381, 2207173, 2230836]
futility_stop: >
  Если после batch_1 в режиме S спасено НОЛЬ актов из шести — прогон
  останавливается, batch_2 не оплачивается, вмешательство считается
  опровергнутым. Один спасённый из шести стоп не отменяет автоматически:
  он обязан быть предъявлен владельцу с решением «продолжать или нет».

# ── ПРО ОСЛЕПЛЕНИЕ, ЧЕСТНО ────────────────────────────────────────────────
# Рандомизация порядка и ярлыки A/B/C здесь были бы театром: подсчёт целиком
# механический, руки автора между ответом вендора и вердиктом нет. Ослепление
# обеспечено тем, что ПРИБОР НАПИСАН РАНЬШЕ: direction_confidence.verdict()
# закоммичен 01.08 и в этом прогоне не правится ни на строку. Единственная
# новая деталь прибора — привязка к фрагментам (cond_2); она обязана быть
# закоммичена ДО первого запроса, иначе порог подгоняется под увиденное.
blinding: "прибор закоммичен раньше данных; cond_2 — до первого запроса"

predictions:

  - id: P44
    about: "воспроизводимость состава пилота"
    claim: >
      scripts/select_structdiff_pilot.py, прогнанный на data/direction_v3.json
      и data/bill_texts, вернёт РОВНО двенадцать номеров из composition.acts —
      ни одним больше, ни одним меньше, с теми же числами операций.
    why_it_matters: >
      Список получен разовым кодом в сессии. Ровно так же был получен вердикт
      «канал А не даёт направления», который потом нигде не жил и не
      воспроизводился (§14). Предсказание превращает разовый счёт в оракул.
    refuted_if: "селектор даёт другой состав или другие числа операций"

  - id: P45
    about: "работает ли структурированная подача"
    claim: "В режиме S спасено не менее 6 из 12 актов."
    why_it_matters: >
      Это половина. Меньше половины на самых благоприятных актах пилота — при
      том что у остальных 26 слабых даже операций не извлекается — означает,
      что подача не была узким местом, и дорогая половина (база закона) не
      оправдана этим доводом.
    refuted_if: "спасено 2 или меньше"
    partial_if: "спасено 3–5 — решение владельца, не автоматическое продолжение"

  - id: P46
    about: "не покупаем ли мы согласие формой"
    claim: "В режиме P спасено не более 0 актов, и строго меньше, чем в S."
    why_it_matters: >
      Структура сама по себе может дисциплинировать вендора настолько, что он
      начнёт выдавать одинаково оформленные ответы на что угодно. Тогда рост
      уверенности — артефакт прибора, и его нельзя нести в документ о партиях.
    refuted_if: "в P спасён хоть один акт — прибор сломан, весь прогон невалиден"

  - id: P47
    about: "контроль дрейфа вендора"
    claim: >
      В режиме N не менее 10 из 12 актов остаются слабыми (low|none), то есть
      воспроизводят вердикт data/direction_v3.json от 11.08.
    why_it_matters: >
      Если акты спасаются сами, без вмешательства, сравнение S с v3 меряет
      календарь, а не подачу. Прогон в этом случае недействителен целиком.
    refuted_if: "в N спасено 3 и более актов"

# ── ИСХОДЫ, ОБЪЯВЛЕННЫЕ ДО ПРОГОНА ────────────────────────────────────────
# Порядок проверки жёсткий: сначала валидность прогона, потом результат.
# Иначе соблазн прочитать P и N задним числом как «шум».
outcomes:
  - order: 1
    check: "P46 — плацебо"
    if_failed: "прогон невалиден, результат не читается, cond_2 переписывается"
  - order: 2
    check: "P47 — дрейф"
    if_failed: "прогон невалиден, нужен новый контроль, S с v3 несравним"
  - order: 3
    check: "P45 — вмешательство"
    result:
      "0–2":  "опровергнуто: подача не была узким местом канала А"
      "3–5":  "частично: недостаточно для расширения, решение владельца"
      "6–12": "правдоподобно: дорогая половина (15 актов с базой) оправдана"

# ── ЧЕГО ЭТОТ ПИЛОТ НЕ РЕШАЕТ ─────────────────────────────────────────────

# ── ЧЕМ КРАСНЕЕТ САМО ЭТО ОБЪЯВЛЕНИЕ (§20, §24) ──────────────────────────
# Файл в criteria/ ничего не защищает сам по себе: check_criteria_order.py
# сверяет только ПОРЯДОК коммитов, не содержание. Механизмы этого прогона:
#   1. scripts/select_structdiff_pilot.py --selftest — оракул на P44;
#   2. cache_guard — отказ ДО запросов, если ключи режимов совпали;
#   3. legal_call_counts — отказ, если запросов не 36 и не 72;
#   4. cond_2 — привязка норм к фрагментам, красит плацебо по построению.
# Пока пункты 1–4 не написаны, пилот НЕ объявляется готовым к прогону, а это
# объявление — намерение, а не защита. Так и написано, чтобы через неделю не
# перепутать.
status: "объявлено; прогон запрещён до появления механизмов 1–4"

# Предрегистрация эксперимента «выгодно ли уточнять» — §3, коммит ДО чтения выборок.
# План: plans/PLAN_refine_experiment_2026-10-20.md. Решение владельца 20.10 16:54: «давай три линии, да».
# =============================================================================
# ГРАНИЦА §3 — что видел автор объявления, а что нет
# =============================================================================
# ВИДЕЛ:
#   - итог перечитки экономики (counts: kept 513, removed 31, flipped 9; «без линии» 16->12 из 19);
#   - метки устойчивости стрелок data/arrow_robustness.json по темам;
#   - число ненулевых знаков по темам и наличие полных текстов (474/561/97/223; тексты у 62 из 631 неэкономических).
# НЕ ВИДЕЛ:
#   - ни одного полного текста законов, которые попадут в выборки E2/E4 (выборки не построены);
#   - результата E1 (сборка с выключенным econ2_filter и контроль удаления не запускались);
#   - ни одного второго прочтения по rule_of_law, religion_state, security.
declared_at: 2026-10-20
unit_of_outcome:
  verdicts:
    trajectory_label: линия × тема (data/trajectory.json)
    arrow_25: фракция × тема (стрелка 25-го Кнессета)
  material_change: смена направления ИЛИ переход направленный <-> ненаправленный
  minor_change: смена между ненаправленными метками (напр. «мало данных» <-> «ясной линии нет»)
  zero_compared_is_failure: true   # KNS-L005: сравнение без сравнённых выводов — отказ, не «нет изменений»
decision_rule_per_theme:   # три зоны владельца, по СУЩЕСТВЕННЫМ сменам линий траектории темы
  no_refine: "<= 1 линия"
  refine: ">= 3 линии"
  gray: "ровно 2 линии -> решение по тому, задеты ли пограничные для владельца списки; не названы -> вопрос владельцу"
e1_calibration:
  compare: econ2_filter выключен vs включён (те же входы, одна сборка)
  deletion_control: {n_removed: 40, population: ненулевые знаки экономики, seed: 2026102001}
  model: arrow_robustness с p = (removed+flipped)/read по экономике; промах модели более чем вдвое -> модель не используется
e2_pilot:
  themes: [rule_of_law, religion_state, security]
  frame: уникальные bill_id с ненулевым знаком темы в criteria/full_signs_K20..K25.json
  n_per_theme: 20
  seed: 2026102002
  selection: random.Random(seed).sample(sorted(frame), n)   # отдельный Random на тему, темы в указанном порядке
  error: знак по полному тексту (два слепых читателя, при расхождении — третье чтение) != знак по названию; снятие (->0) и переворот считаются отдельно
  sequential:
    ">=4 ошибок": перепись темы
    "<=1 ошибки": стоп, только если модель E1 годна и предсказывает <=1 существенную смену линии при верхней границе 95% ошибки; иначе расширить до 50
    "2-3 ошибки": расширить до 50 тем же зерном (первые 20 входят), решить заново
  readers_disagree_over_20pct: тема уходит владельцу вопросом, не в перепись
e4_zeros:
  frame: bill_id с нулём во всех 4 темах
  n_total: 150
  strata: {keyword_hit: 75, random: 75}
  seed: 2026102004
  keywords: объявляются в отдельном файле этим же коммитом или до чтения — иначе слой keyword_hit не читается
sign_conflicts_across_knessets: 8 пар (тема, закон) с разными знаками в разных K-файлах — разобрать до E3; правило выбора объявить до пересчёта
predictions:   # prediction_before_anchor — мои, Claude, до данных
  e1: фактических существенных смен по экономике больше нетто-счётчика 16->12 (>=5 линий); контроль удаления даёт >=2 смены сам по себе
  e2_error_rate: {rule_of_law: "3-6%", security: "3-6%", religion_state: "8-12%"}
  after_census_material_lines_per_theme: "<=2"
  e4_hidden_rate: "<=1% нулей на тему"

e2_extension_revision_2026-10-20:   # criteria-revision: до построения и чтения расширения
  why: "«расширить до 50 тем же зерном (первые 20 входят)» невыполнимо: random.sample(…, 50) при n=97 и n=223 выбирает другим алгоритмом, и пилот не входит в выборку 50 (проверено). Для rule_of_law (n=474) совпадает."
  rule: "расширение темы = пилотные 20 + random.Random(2026102003).sample(sorted(frame - pilot), 30); отдельный Random на тему, темы в порядке e2_pilot.themes"
  pilot_outcome_before_extension: "читатели согласны 56/60; с названием расходятся (согласные): rule_of_law 1 (снят), security 1 (перевёрнут); 4 пары у арбитра. При любом исходе арбитража ни одна тема не достигает 4/20; модель E1 отвергнута (факт 3 смены стрелок 25-го против ожидаемых 0,8) → по правилу все три темы расширяются до 50."

e3_census_2026-10-20:   # criteria-revision: объявлено ДО чтения переписи (тексты скачиваются, ни один не прочитан)
  owner: "владелец 20.10 18:00: «перечитай, да» — перепись rule_of_law, religion_state, security"
  e2_result: "ошибок знака по названию: rule_of_law 8/50 (16%, 95% 8–29%), religion_state 3/50 (6%, 2–16%), security 3/49 (6%, 2–17%); все 14 ошибок — у знака +1 (P≈0.0007 при случайном распределении)"
  universe: все уникальные bill_id с ненулевым знаком темы в criteria/full_signs_K20..K25.json (631 закон; пар тема×закон 794)
  readers: два слепых читателя полного текста (Claude, Codex), инструкция reviews/refine/census/READER.md = e2/READER.md; пары выборок E2/E2x не перечитываются — берутся их чтения
  apply_rule: "ТО ЖЕ, что экономика (criteria/declared_before_economy_reread_2026-10-20.yaml, принято владельцем 20.10): знак по названию остаётся, если ни один читатель не дал другого числового знака; иначе — 0 (снят, не перевёрнут). null — не довод против. Нет текста — знак остаётся, считается отдельно."
  why_same_rule: одинаковое правило во всех четырёх темах; правило с переворотом — отдельное решение владельца, не принималось
  outcome_measure: смены выводов траектории по теме до/после — по трём зонам e2 (≤1 / 2 / ≥3 линии), классификация смен в трёх трактовках Codex (literal / conditional / pattern), пока владелец не решил про «меняется»
  definition_caveat: "ограничение слова с антидискриминационной целью по READER.md = −1; это вопрос определения, владельцу не задан"
  prediction_claude: "rule_of_law: снято 12–20% знаков, существенных смен линий ≥3; religion_state и security: 4–9% снято, смен ≤2"

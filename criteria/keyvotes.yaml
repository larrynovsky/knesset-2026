# keyvotes — критерии отбора голосований. v1.0, ЧЕРНОВИК НА УТВЕРЖДЕНИЕ.
#
# ЗАФИКСИРОВАНО ДО ПРОСМОТРА РЕЗУЛЬТАТОВ (§3). Данные о том, кто как голосовал,
# на момент написания не запрашивались. Собран только предметный перечень —
# какие законы принимались и когда, — без поимённых результатов.
# Доказательство порядка остаётся в публичной git-истории.
#
# =============================================================================
# ГЛАВНОЕ РЕШЕНИЕ: НЕ ОТБОР, А ПЕРЕПИСЬ
# =============================================================================
# Классическая уязвимость «ключевых голосований» — Snyder (LSQ 1992): тот, кто
# отбирает голосования, отбирает те, что максимально разделяют своих и чужих,
# и распределение становится искусственно поляризованным. Публикация критериев
# ослабляет проблему, но не снимает: критерий тоже можно подобрать.
#
# Снимается она иначе. Если брать НЕ «ключевые», а ВСЕ голосования по
# законопроектам, попадающим в опубликованный предметный чек-лист, — отбора
# нет вообще. Есть перепись по объявленному признаку. Спорить можно с
# чек-листом, но не с тем, что из корпуса выбрали удобное: выбирать не из чего.
#
# Цена: больше шума, часть голосований окажется процедурной и малосодержательной.
# Принято сознательно. Шум честнее подобранной выборки.
#
# =============================================================================

version: "1.0"
status: УТВЕРЖДЕНО ВЛАДЕЛЬЦЕМ
approved_at: "2026-07-28"
approved_by: Саша
# Граница §3. Всё, что после этого коммита, — данные. Любая правка критериев
# отсюда и далее обязана идти коммитом с префиксом `criteria-revision:`
# и полем «что заставило пересмотреть». Порядок доказывается git-историей
# и проверяется scripts/check_criteria_order.py на обеих машинах.
theme: rule_of_law
principle: перепись по предметному признаку, не отбор значимых

provenance:
  - "V-Dem Codebook: v2jureform, v2jureview, v2jupack, v2jupurge, v2lgotovst,
     v2lgqstexp, v2lginvstp, v2lgoppart, v2elembaut, v2cseeorgs, v2mecenefm"
  - "DEED (Democratic Erosion Event Dataset) v4/v7, категории Reduction in
     Horizontal Accountability"
  - "Court-curbing bills: Clark AJPS 2009; Leonard SPPQ; Catalano — 7 типов"
  - "Huq & Ginsburg 2018 — пять механизмов constitutional retrogression"
  - "Scheppele 2018 — Autocratic Legalism, техники захвата институтов"
  - "IDI, Fuchs & Blander 2015 — единственная схема, применявшаяся к биллям Кнессета"

# =============================================================================
# ЧЕК-ЛИСТ: когда законопроект относится к оси
# =============================================================================
# Достаточно ОДНОГО совпадения. Каждое совпадение фиксируется в карточке
# с номером пункта и цитатой из текста закона.

checklist:
  A_суд:
    A1: создаёт, отменяет или сужает конституционный либо судебный надзор
    A2: вводит механизм преодоления судебного решения парламентом; выводит
        категорию актов из-под обжалования
    A3: меняет юрисдикцию суда, кворум, требуемое большинство для отмены
        закона, стандарты пересмотра (в т.ч. стандарт разумности)
    A4: меняет порядок назначения судей, состав отбирающего органа, число
        судейских должностей, пенсионный возраст, сроки, требования
    A5: меняет порядок смещения или дисциплины судей, их зарплату,
        бюджет судов, право суда формировать составы и процессуальные правила
    A6: меняет доступ к суду (правоспособность, сроки, пошлины) либо
        доступные средства защиты

  B_парламент_и_оппозиция:
    B1: меняет полномочия по вызову и допросу должностных лиц
    B2: меняет полномочия по расследованиям, состав следственных комиссий
    B3: меняет права оппозиции — регламент, право выступать и вносить
        поправки, квоты в комитетах, председательство в контрольном комитете
    B4: меняет бюджетную автономию парламента; расширяет делегированное
        законотворчество, ускоренные процедуры, обход комитетов
    B5: меняет правила изменения Основных законов

  C_независимые_органы:
    C1: меняет назначение, увольнение, срок или подчинённость юридического
        советника правительства, генпрокурора, госконтролёра, омбудсмена,
        ЦИК, комиссара госслужбы, регулятора вещания, глав силовых ведомств
    C2: делает правовые заключения таких органов необязательными; разделяет
        должность; вводит политическое назначение юрсоветников министерств
    C3: переводит орган под прямой контроль исполнительной власти либо
        создаёт параллельную структуру с дублирующими полномочиями
    C4: меняет подчинение полиции, военной прокуратуры, органов расследования
        должностных преступлений

  D_электоральные_правила:
    D1: меняет порог, нарезку, формулу распределения мандатов
    D2: меняет правила регистрации либо дисквалификации партий и кандидатов
    D3: меняет состав или полномочия ЦИК, правила финансирования кампаний,
        порядок и сроки роспуска парламента

  E_свободы_как_инфраструктура_контроля:
    E1: НКО — регистрация, лицензирование, налогообложение иностранного
        финансирования, ограничение процессуальной правоспособности,
        ограничение политической деятельности и участия в протестах
    E2: пресса — цензура прямая и косвенная (частоты, госреклама, тарифы,
        требования регистрации), статус общественного вещателя, его бюджет,
        состав и полномочия регулятора, криминализация высказываний
    E3: собрания и протест; академическая свобода; полномочия спецслужб
        в отношении политических оппонентов

  F_чрезвычайное_и_структурное:
    F1: чрезвычайные полномочия — основания, срок, продление, кто объявляет
        и кто контролирует, приостановка законов или прав
    F2: централизация — сокращение автономии муниципалитетов, назначаемость
        вместо выборности
    F3: персональный или конъюнктурный закон — норма под конкретное лицо,
        дело либо срок

# =============================================================================
# НАПРАВЛЕНИЕ: обязательно двустороннее
# =============================================================================
# Кодировка заимствована у V-Dem v2jureform, где ровно три значения и среднее
# из них — «без изменений», а не «плохо/не плохо».
#
#   -1  законопроект ОСЛАБЛЯЕТ сдержки исполнительной власти
#    0  затрагивает предмет, но баланс не меняет (техническое, процедурное)
#   +1  законопроект УСИЛЯЕТ сдержки
#
# Это несущее требование, а не оформление. Тема объявлена владельцем, у него
# есть позиция, и инструмент, способный фиксировать только ослабление, будет
# не измерением, а её подтверждением.
#
# ПРОВЕРКА РАБОТОСПОСОБНОСТИ (обязательна перед публикацией):
#   если по завершении сбора в корпусе НЕТ НИ ОДНОГО голосования со знаком +1 —
#   это не вывод о партиях, это красный флаг на чек-лист. Значит он написан
#   так, что усиление сдержек в него не пролезает. Пересматривать чек-лист,
#   а не публиковать результат.

direction_coding:
  values: [-1, 0, +1]
  meaning:
    -1: ослабляет сдержки исполнительной власти
    0: предмет затронут, баланс не меняется
    +1: усиливает сдержки
  required_evidence: цитата из текста закона плюс номер пункта чек-листа
  sanity_gate: >
    отсутствие в корпусе голосований со знаком +1 означает дефект чек-листа,
    а не свойство израильской политики; публикация до пересмотра запрещена

# =============================================================================
# КОДБУК НАПРАВЛЕНИЯ v1.1 — criteria-revision 2026-07-29
# =============================================================================
# ЧТО ЗАСТАВИЛО ПЕРЕСМОТРЕТЬ (обязательное поле §3):
# Пилот на 57 законопроектах ядра, два вендора. Расхождений 9 из 57 (16%).
# При разборе оказалось, что СЕМЬ из девяти — не ошибки моделей: обе цитируют
# одну и ту же норму, читают её одинаково и расходятся в том, как её засчитать.
# То есть расхождения показали не качество оценщиков, а ОТСУТСТВУЮЩИЕ РЕШЕНИЯ
# в критериях. На батче в 667 те же три класса дали бы систематическую массу,
# а не случайный шум.
#
# Формулировка поля составлена мной по выборам владельца в диалоге 2026-07-29,
# а не продиктована им дословно. Помечено честно: владелец может заменить.
#
# Пилот окупился ровно так, как обещал перенос из kegan-iooh: вскрыл дефект
# глоссария, а не текста, и до батча, а не после.

direction_codebook:
  version: "1.1"
  revised_at: "2026-07-29"
  revised_by: Саша

  K1_отчётность_без_полномочия_это_ноль:
    правило: >
      +1 ставится, когда норма даёт кому-то ПРАВО ЧТО-ТО СДЕЛАТЬ: вызвать,
      отказать, отменить, заблокировать назначение, приостановить, обжаловать,
      потребовать одобрения. Голая обязанность информировать — 0, даже если
      адресат парламентская комиссия и даже если периодичность закреплена.
    почему: >
      Отчётность — самый дешёвый способ выглядеть надзором. Правило «появилось
      право» читатель проверяет по тексту закона; «повысилась прозрачность»
      он проверить не может. Та же логика, по которой отвергнут суммарный балл.
    цена_названа: >
      Отчётность иногда работает по-настоящему, потому что министр не хочет
      объясняться публично. Такие случаи мы обнулим и об этом сказано здесь.

  K2_единица_записи_это_норма_а_не_законопроект:
    правило: >
      Один законопроект порождает СТОЛЬКО записей, сколько норм чек-листа он
      затрагивает. Каждая запись несёт свой знак, свою цитату и свой пункт.
      Схлопывать законопроект в один знак запрещено.
    почему: >
      Основной закон о государственном хозяйстве (поправка 13) содержит и
      норму, дающую правительству обход обычной процедуры, и норму, требующую
      одобрения финансовой комиссии. Обе модели прочли верно, каждая свой кусок.
      Это свойство закона, а не разногласие оценщиков. Любое схлопывание требует
      суждения о том, что весомее, — то есть возвращает субъективность, ради
      устранения которой выбрана перепись вместо отбора, и делает это суждение
      невидимым для читателя.
    цена_названа: >
      Партия, голосовавшая за омнибус, окажется одновременно и за ослабление,
      и за усиление. Вывод «кто хороший» из этого не следует — он и не заказан
      (§13): карточка сообщает, что партия сделала, вывод делает читатель.

  K2b_спрятанная_норма_обязана_выпячиваться:
    слова_владельца: >
      «многие законы могут приниматься из-за одной незаметной нормы.
      Поэтому её нужно выпячивать и так, чтобы она не терялась»
    правило: >
      K2 запрещает терять норму при ЗАПИСИ. K2b запрещает терять её при
      ЧТЕНИИ. Запись, утонувшая среди двадцати технических записей того же
      закона, эквивалентна отсутствующей.
      Каждая запись несёт КОНТРАСТ — отношение объёма нормы к объёму
      законопроекта — и записи со знаком ≠ 0 при высоком контрасте
      поднимаются в отчёте наверх и помечаются явно.
    почему_механизируется: >
      Признак наблюдаем без суждения: знак известен, объёмы считаются.
      «Сорок страниц поправок к законодательству, одна строка меняет порядок
      назначения судей» — это верх списка, а не строка номер девятнадцать.
    оракул_который_из_этого_следует: >
      Ноль записей с высоким контрастом во ВСЁМ корпусе — красный флаг.
      Либо в Кнессете так не делают, либо способ резать закон на нормы
      слишком груб и мелкое тонет. Второе вероятнее. Раньше это было
      непроверяемо, теперь краснеет.

  K2c_запись_двухуровневая:
    слова_владельца: "Две записи — общий знак и сильнейшая норма"
    правило: >
      У ЗАКОНОПРОЕКТА один общий знак — им карточка цепляется за голосование.
      Отдельно живут записи по нормам (K2), и среди них помечена СИЛЬНЕЙШАЯ —
      та, ради которой закон, возможно, и принимался (K2b).
      Два уровня, не конкурирующие за одно поле.
    какую_дыру_закрывает: >
      K2 объявил единицей норму — и оставил дыру, названную, но не закрытую:
      голосуют за законопроект ЦЕЛИКОМ, и приписать одному голосу двадцать
      знаков нечем. Двухуровневая запись снимает это: уровень голосования
      и уровень содержания перестают конкурировать.
    запрет: >
      Общий знак НЕ выводится усреднением или суммой знаков норм — это был бы
      агрегирующий скоринг, запрещённый §13 в другом месте и по той же причине.
      Общий знак — отдельное суждение о законопроекте как целом, с собственной
      цитатой.

  K2d_пометка_об_основании_обязательна_в_карточке:
    слова_владельца: "По острию + пометка в карточке"
    правило: >
      Когда общий знак законопроекта дан по ОДНОЙ норме из омнибуса, карточка
      обязана нести видимую строку об этом — не в примечании, не в подвале.
      Формулировка вида «знак дан по одной норме; остальной закон технический».
      Пометка несёт ВЕС, а не только факт: «по одной норме из ста» — не то же
      самое, что «по одной норме». Доля берётся из contrast (K2b), не на глаз.
    почему: >
      Без пометки карточка молча утверждает, что весь закон об этом. Это
      неправда, и читатель не сможет с ней спорить — он не увидит основания.
      §14 требует воспроизводимости цифры; здесь то же требование к суждению.
    механизм: >
      Валидатор карточек: при contrast выше порога и общем знаке ≠ 0 поле
      basis_note обязано быть непустым. Отсутствие пометки — отказ, не warning.

  K3_полномочие_и_его_рамки_считаются_раздельно:
    правило: >
      Когда норма ОДНОВРЕМЕННО даёт власти инструмент и ставит ему рамки —
      две записи даже внутри ОДНОГО пункта чек-листа: новое полномочие −1,
      новые ограничения на него +1.
    почему: >
      Закон о биометрической съёмке для полиции впервые даёт распознавание лиц
      в публичном пространстве и впервые вводит для него условия соразмерности,
      лимит срока и переоценку. Закон о юрсоветнике премьера вводит должность
      личного доверия и вводит для неё правила конфликта интересов.
      Отсчёт «от практики» («так и делали, теперь ограничили») отвергнут:
      подтвердить наличие практики источником мы не можем, это стало бы моим
      словом, а §0 требует выводить из источников, а не заявлять.
    цена_названа: >
      Агрегация усложняется ещё на шаг. Разрешающая способность выбрана выше
      компактности сознательно и дважды подряд (K2, K3).

  K4_область_оси_любой_институт_с_политическим_назначением:
    правило: >
      Ось не ограничена исполнительной, судебной властью и парламентом.
      Входит любой институт, чьи назначения или полномочия меняются
      политическим решением: президент, раввинат, муниципалитеты,
      Банк Израиля, армейские и силовые назначения, регуляторы.
    почему: >
      Поправка о дисквалификации кандидата в президенты с действующим
      обвинением формально не касается исполнительной власти, но по существу
      это норма об институциональной добропорядочности. В Израиле борьба за
      контроль часто идёт именно на периферии — в раввинате, в муниципалитетах.
    цена_названа: >
      Корпус вырастет, и в него попадёт материал, к узурпации отношения не
      имеющий. Лексикон и перепись подлежат пересчёту под расширенную область.

  K5_обоснованный_отказ_это_расхождение_а_не_промах:
    правило: >
      Оракул штрафует ТОЛЬКО неверный знак. Отказ поставить знак с названной
      причиной приравнивается к расхождению вендоров и идёт в список на
      человеческий просмотр, а не в статистику промахов.
    почему: >
      На Основном законе об изучении Торы отказ оказался единственным
      механизмом, поймавшим дефект выгрузки: извлеклось 717 символов — это
      титульный лист, а не норма, и фильтр длины его пропустил. Прибор,
      штрафующий за признание нехватки, получит меньше отказов и больше
      выдуманных знаков — прямо против §20.
    открытая_дыра: >
      Отличить «не взялась, потому что невозможно» от «не взялась, потому что
      трудно» механически нельзя. Пока отказов единицы — видно глазами.
      На сотне отказов понадобится правило, и его нет.

intensity:                       # по Catalano: тип × уровень органа × охват
  level: [частный случай, отдельный орган, весь надзорный контур]
  instrument: [обычный закон, поправка к Основному закону, новый Основной закон, регламент]
  note: конституционный уровень весит больше обычного закона

# =============================================================================
# ЧТО ВХОДИТ В ПЕРЕПИСЬ
# =============================================================================
scope:
  knesset: 25                    # 2022-11-15 .. 2026-07-17
  include:
    - все голосования пленума по законопроектам, совпавшим с чек-листом,
      НА ВСЕХ СТАДИЯХ — предварительное, первое, второе-третье
    - все голосования по поправкам к Основным законам, независимо от предмета
    - вотумы недоверия (KNS_PlenumVote.IsNoConfidenceInGov)
  rationale_all_stages: >
    реформу замораживали, возобновляли и проводили частями; одни и те же
    партии голосовали по-разному в разные месяцы. Брать только финальные
    чтения — стирать ровно тот сигнал, ради которого всё затевалось.

  exclude:
    - голосования по законопроектам, не совпавшим ни с одним пунктом чек-листа
    - процедурные голосования без предметного содержания (снятие с повестки,
      перенос) — помечаются, но в счёт направления не идут

# =============================================================================
# ЛОВУШКИ ИСТОЧНИКА — обязательны к соблюдению
# =============================================================================
traps:
  for_option: >
    ForOptionDesc / AgainstOptionDesc определяют, ЧТО означает «за» в конкретном
    голосовании: принять, передать в комитет, отклонить. Классификация без
    чтения этих полей запрещена (§10)
  readings_merged: >
    Кнессет объединяет второе и третье чтения в одно голосование — наивный
    подсчёт стадий даст неверную картину
  no_knesset_num: >
    KNS_PlenumVote не имеет поля KnessetNum; режется по VoteDateTime,
    границы каденции из KNS_KnessetDates
  legacy_endpoint: >
    Odata/Votes.svc отдаёт HTTP 200 и ноль записей за 25-й Кнессет. Запрещён (§9)

# =============================================================================
# ОРАКУЛ ОТБОРА — механизм обязан находить заведомо известное
# =============================================================================
# Список составлен из открытых источников ДО обращения к данным о голосованиях.
# Если автоматический проход по чек-листу не находит эти акты — сломан проход,
# а не список. Это оракул результата, а не процесса (перенос из lab_recognizer).

validation_set:
  - {date: 2022-12-27, act: "Основной закон о правительстве, поправка 11", checklist: [F3], expect: -1}
  - {date: 2022-12-28, act: "Указ о полиции, поправка 37", checklist: [C4], expect: -1}
  - {date: 2023-03-23, act: "Основной закон о правительстве, поправка 12", checklist: [B5, F3], expect: -1}
  - {date: 2023-07-24, act: "Основной закон о судебной власти, поправка 3 — отмена стандарта разумности", checklist: [A1, A3], expect: -1}
  - {date: 2025-03-04, act: "Закон об омбудсмене по жалобам на судей", checklist: [A5], expect: -1}
  - {date: 2025-03-27, act: "Основной закон о судебной власти, поправка 4 — комиссия по назначению судей", checklist: [A4], expect: -1}
  - {date: 2026-07-15, act: "Закон о юридическом советнике правительства", checklist: [C1, C2], expect: -1}
  - {date: 2026-07-15, act: "Основной закон об изучении Торы", checklist: [B5], expect: 0}
  - {date: 2026-07-16, act: "Закон о реформе вещания", checklist: [E2], expect: -1}
  minimum_hit_rate: 1.0          # найдены обязаны быть ВСЕ

# =============================================================================
# ЧЕГО КРИТЕРИИ НЕ ДЕЛАЮТ — названо заранее
# =============================================================================
limits:
  - >
    Чек-лист определяет ПРЕДМЕТ, направление кодирует ЧЕЛОВЕК по тексту закона.
    Это суждение, и оно не машинное. Двойная сверка двумя моделями разных
    вендоров (P2-3) ловит грубые расхождения, но не гарантирует правильность.
  - >
    Перепись снимает смещение отбора, но не снимает смещение чек-листа.
    Чек-лист собран из V-Dem, DEED и court-curbing литературы — она написана
    людьми с определённым взглядом на то, что такое эрозия демократии.
    Это названо, а не спрятано.
  - >
    Голосование показывает позицию фракции, не депутата (§1). При дисциплине
    близкой к сплошной это корректно, но означает: карточка говорит о партии.
  - >
    Не принятые законопроекты тоже входят в перепись. Голосование за
    непроходной законопроект — дешёвый сигнал, и это надо помнить при чтении:
    оно показывает намерение, а не результат.

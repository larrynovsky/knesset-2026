# Объявления, сделанные ДО взгляда — Ф20 плана PLAN_calibration_2026-07-31
#
# Три вещи, каждая из которых бесполезна, если записана после:
#   1) предсказание о том, что скажут внешние эксперты про ШАС;
#   2) решение о том, что делать при каждом исходе диагностики канала А;
#   3) ожидания негативного контроля.
#
# Общий принцип один и он из §23: неверное объявленное ожидание всё равно
# срабатывает; отсутствие ожидания не срабатывает никогда. Здесь то же
# правило применено не к объёму выгрузки, а к суждению.

# =============================================================================
# ГРАНИЦА §3 — что видел автор объявления, а что нет
# =============================================================================
# §3-channel: external-anchors
# §3-data-markers: data/external/*, data/placebo_*.json, data/roll_call_share.json
#
# ВИДЕЛ:
#   - карточку ШАС целиком, её четыре обязательства и ветку 00220102;
#   - публикации IDI и Globes о коалиционных деньгах (агрегаты по стране);
#   - СТРАНОВОЙ вывод из досье DALP II по Израилю в пересказе: «программность
#     ниже большинства развитых демократий, клиентелизм около мировой
#     медианы». Это загрязнение признаю: страновой уровень я уже знаю, и
#     предсказание ниже делается не с чистого листа.
#   - факт существования CHES-Israel (две волны, 16 списков, 50 экспертов) и
#     список переменных, включая antielite_salience и corrupt_salience.
#
# НЕ СМОТРЕЛ:
#   - ни одного ПАРТИЙНОГО значения ни в DALP II, ни в CHES-Israel. Ни по
#     ШАС, ни по любой другой партии. Файлы не открывались;
#   - бюджет 2022 в связке с обязательствами ШАС (плацебо-период);
#   - ни одной ветки бюджета, кроме 00220102, в связке с обязательствами;
#   - долю поимённых голосований в Кнессете — запрос не делался.
#
# Это ЗАЯВЛЕНИЕ, не механизм. Механизируемая часть: коммит с этим файлом
# обязан быть старше первого обращения к внешним датасетам и к плацебо-
# прогонам. Проверяет scripts/check_criteria_order.py.
# =============================================================================


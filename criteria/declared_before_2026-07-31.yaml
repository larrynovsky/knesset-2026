# ------------------------------------------- 1. ПРЕДСКАЗАНИЕ О ВНЕШНИХ ОЦЕНКАХ
prediction_external:
  what_for: >-
    Сверка нашего прочтения ШАС с независимыми экспертными оценками. Без
    записанного заранее предсказания сверка выродится в подгонку: прочитав
    число, я перечитаю карточку в его сторону и не замечу этого. Второй раз
    прочитать досье «не зная» уже нельзя — якорь одноразовый.

  shas_dalp2:
    clientelism_b15: >-
      предсказываю ЗАМЕТНО ВЫШЕ израильской медианы — верхняя треть среди
      израильских партий выборки.
    programmaticness_cosalpo: >-
      предсказываю НИЖЕ израильской медианы.
    basis: >-
      ШАС построена вокруг сети социальных услуг и учреждений собственной
      общины — учебниковый профиль клиентелистской связи. Плюс наше
      наблюдение по четырём обязательствам: все адресные, предметные,
      обращены к учреждениям, а не к правилу.

  shas_ches_israel:
    antielite_salience: >-
      предсказываю СРЕДНЮЮ или ВЫСОКУЮ. Основание: историческое ядро партии —
      противопоставление себя ашкеназскому истеблишменту.
    corrupt_salience: >-
      предсказываю НИЗКУЮ. Основание: тема невыгодна партии, чей лидер имеет
      судимость; партии не поднимают значимость тем, где уязвимы.
    economic_position: >-
      предсказываю ЛЕВЕЕ центра по экономике при правой позиции по
      социокультурной оси. Классический профиль религиозной партии, живущей
      перераспределением в пользу своего электората.

  what_would_falsify_our_reading: >-
    если DALP II покажет ШАС как ПРОГРАММНУЮ партию с клиентелизмом ниже
    израильской медианы — наше прочтение («деньги приходят адресно и
    безымянно») противоречит независимой оценке того же предмета, и
    объяснять это придётся нам, а не эксперту.

  what_agreement_does_NOT_prove: >-
    Согласие НЕ валидирует нашу метрику. DALP меряет тип связи партии с
    избирателем, CHES — позиции и значимость тем; мы меряем зазор между
    аренами. Это разные конструкты, и совпадение двух измерителей разного не
    доказывает валидности ни одного. Единственная законная формулировка при
    согласии: «независимая оценка типа связи не противоречит нашему
    прочтению». Слово «валидирует» запрещено.

  time_boundary: >-
    DALP II собран 2022–2024, CHES-Israel — весна 2022 и зима 2023. Наши
    данные — бюджет 2023–2025 и период участия ШАС в правительстве до
    2025-07-22. Любое утверждение о согласии или расхождении ограничивается
    пересечением: 2023 год и начало 2024. V-Party в сверку НЕ идёт — он
    обрывается на 2019 и к этому периоду отношения не имеет.

# ------------------------------------- 2. РЕШЕНИЕ ПО КАНАЛУ А, ДО ПРОВЕРКИ
channel_a_verdict:
  question: >-
    Публикует ли Кнессет позицию фракции по голосованиям, которые не идут
    поимённо? В Нидерландах поимённо проходит 1,5% голосований, но позиция
    каждой фракции известна почти по всем: при голосовании поднятием рук
    фиксируется результат по фракциям.

  decided_by: владелец, 2026-07-31, до проведения проверки
  decision_if_not_published: >-
    ВАРИАНТ (а). Канал А объявляется измеряющим САМОПРЕЗЕНТАЦИЮ, а не
    поступок. Ограничение пишется в отчёте открытым текстом, рядом с любым
    утверждением, опирающимся на голосования, а не в примечании и не в
    методологическом разделе. Канал не замораживается: материал остаётся,
    но меняется то, чем он является.

  why_this_and_not_freezing: >-
    Заморозка сильнее по гигиене и выбрасывает работу двух дней; названное
    ограничение дешевле и честнее. Названная слабость варианта (а): такие
    ограничения имеют обыкновение исчезать из виду за неделю — ровно так уже
    вышло с ловушкой на сто строк, записанной в SOURCES.md за час до того,
    как в неё наступили.

  therefore_mechanism: >-
    Раз слабость названа, она обязана получить механизм, а не обещание.
    Валидатор карточки: если утверждение опирается на голосование, а
    самопрезентационное ограничение не объявлено в карточке — блок.
    Формулировка проверки пишется ПОСЛЕ того, как известен исход Ф22, но
    обязательство её написать зафиксировано здесь и сейчас.

  decision_if_published: >-
    канал А расширяется с 258 поимённых голосований до всех, где известна
    позиция фракции; возражение о самоотборе снимается и об этом пишется
    отдельно, потому что оно снималось не нами.

# ----------------------------------------- 3. ОЖИДАНИЯ НЕГАТИВНОГО КОНТРОЛЯ
negative_control:
  why: >-
    Инструмент, который везде находит зазор, — не инструмент. Обе проверки
    ниже устроены как негативное тестирование: нарушается условие,
    необходимое для того, чтобы связь вообще могла существовать. Признак
    выбора контроля в обоих случаях НЕ смотрит на исход — иначе проверка
    тавтологична.

  placebo_period:
    setup: >-
      прогнать утверждения карточки ШАС по бюджету 2022 года — до подписания
      соглашения. Связь невозможна хронологически.
    declared_expectation: >-
      Утверждения вида «слова X нет среди названий статей» ожидаю ИСТИННЫМИ и
      в 2022 году. Это ожидание неприятное и объявляется именно поэтому: если
      оно подтвердится, значит отсутствие микв и синагог в номенклатуре —
      КОНСТАНТА бюджетной классификации, а не следствие невыполнения
      обязательства. Тогда формулировку вывода в карточке придётся ослабить,
      и это будет правкой по §15, а не «уточнением».
    what_it_kills: >-
      если ожидание подтвердится, утверждение «обязательство не отражено в
      бюджете» перестаёт быть фактом о партии и становится фактом о бюджетной
      номенклатуре. Разница для читателя решающая.

  placebo_branch:
    setup: >-
      прогнать поиск кандидатов по терминам обязательств ШАС на ветке,
      выбранной СЛУЧАЙНО с зафиксированным зерном, среди восьмизначных кодов
      вне 00220102. Связь невозможна предметно.
    seed: 20260731
    declared_expectation: >-
      доля обязательств, для которых на случайной ветке находится
      правдоподобный кандидат, ожидается НЕ ВЫШЕ четверти.
    refutation_threshold: >-
      если кандидаты находятся для половины обязательств и более — поиск не
      различает предмет, и его результаты перестают быть свидетельством
      чего-либо. Это отказ методики поиска, а не повод подкрутить пороги.
      Подкрутка порогов уже была четыре раза за 30 июля и не дала ничего.

  honest_bound: >-
    Оба контроля — наши собственные, и потому слабее третьего оракула,
    которого у нас нет: внешнего наблюдателя. Единственная проверка этого
    этапа, исход которой мы не контролируем вообще, — Ф22: либо Кнессет
    публикует позицию фракции, либо нет.

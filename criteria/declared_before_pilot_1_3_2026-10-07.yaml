# ════════════════════════════════════════════════════════════════════════
# ГРАНИЦА §3. Объявлено ДО пилота кодбука 1.3.
#
# Что объявляется: состав пилота, базовая линия под кодбуком 1.2, ожидание
# объёма (§23) и ПРАВИЛО РЕШЕНИЯ — какие числа разрешают полный
# перепрогон, а какие его запрещают. Решение принимается арифметикой, не
# впечатлением от результата.
#
# Почему это объявление вообще нужно. Правка кодбука (K11, неприменимость)
# внесена ПОСЛЕ просмотра результатов прогона 07.10. Это записано в самой
# правке. Единственная защита от подгонки — объявить заранее, что считать
# успехом, и не двигать это после.
# ════════════════════════════════════════════════════════════════════════

declared_at: "2026-10-07T20:50+03:00"
codebook_from: "1.2"
codebook_to: "1.3"
changes_in_1_3: >-
  единственное изменение: вводится статус «неприменимо» (ни один пункт
  чек-листа актом не затронут) как отдельное поле ответа, НЕ как значение
  шкалы. Шкала остаётся [-1, 0, +1]. Правило — criteria/keyvotes.yaml,
  K11_неприменимость_это_не_ноль, коммит 7647175. Ничего другого в
  кодбуке, промпте и чек-листе не меняется: иначе пилот измерит смесь.

# ── СОСТАВ: ТОТ ЖЕ, ЧТО УЖЕ ПРОЙДЕН ПОД 1.2 ──────────────────────────────
# Акты берутся ПО ПОРЯДКУ ID из состава прогона 07.10 — первые тридцать, у
# которых под 1.2 есть полная числовая пара Anthropic/OpenAI. Не выбраны по
# результату: порядок задан идентификаторами, а не знаками.
composition:
  rule: первые 30 актов состава по порядку bill_id с полной парой A/O под 1.2
  n: 30
  bills: [1045979, 1046280, 1046556, 1046557, 1056886, 1057405, 1057406,
          2168881, 2192117, 2194599, 2195856, 2195990, 2195992, 2196056,
          2196154, 2196198, 2196342, 2196386, 2196659, 2196666, 2196684,
          2196837, 2196908, 2196924, 2196934, 2196976, 2196986, 2197107,
          2197160, 2197177]
  bills_note: >-
    список выписывается в этот файл до пилота и сверяется после: если
    прогон пойдёт по другому составу, сравнение «то же под другим
    кодбуком» разрушено, и результат непригоден.
  vendors: [anthropic, openai, google]
  vendors_note: >-
    тройка сохраняется ровно такой, какой шёл прогон 07.10. Вопрос
    «пара или тройка» в этом пилоте НЕ решается: менять две вещи сразу
    значит не узнать ни про одну.

# ── БАЗОВАЯ ЛИНИЯ ПОД 1.2, ЗАМЕРЕНА И ЗАФИКСИРОВАНА ДО ПИЛОТА ───────────
baseline_1_2:
  pairs: 30
  agree: 20
  agreement_share: 0.667
  alpha_nominal: 0.491817
  zero_vs_sign_conflicts: 9
  direction_disputes: 1
  measured_from: /tmp/arrow_run.log, первые 30 полных пар на 20:47 07.10

# ── ОЖИДАНИЕ ОБЪЁМА (§23) ───────────────────────────────────────────────
expectation:
  acts_sent: 30
  acts_classified: ">= 27"
  acts_classified_why: >-
    под 1.2 эти тридцать уже дали полную пару, значит структура у них есть
    и текст доступен. Допускаю до трёх потерь на сетевые отказы и
    непарсящийся ответ. Меньше 27 — пилот непригоден, а не «немного хуже».
  inapplicable_share: "0.20 … 0.50"
  inapplicable_share_why: >-
    под 1.2 пустые нормы при конфликте встречались у OpenAI в 15 случаях
    из 22 на 130 актах. На этих тридцати ожидаю, что «неприменимо» получат
    от шести до пятнадцати актов. Доля выше 0.50 означает, что чек-лист не
    дотягивается до темы вообще — это дефект чек-листа, а НЕ результат о
    партиях, и публикация до его пересмотра запрещена (прецедент
    direction_coding.sanity_gate). Доля ниже 0.20 означает, что статус не
    используется, то есть правка не дошла до модели.
  cost: "около 30 актов × три вендора; по измеренной цене прогона 07.10 ≈ $21"

# ── ПРАВИЛО РЕШЕНИЯ: ОБЪЯВЛЕНО ДО, НЕ ДВИГАЕТСЯ ПОСЛЕ ───────────────────
decision:
  full_rerun_allowed_only_if:
    - альфа номинальная на этих 30 актах >= 0.667
    - конфликтов «ноль против знака» не больше 4 (было 9, то есть падение
      не меньше чем вдвое)
    - доля «неприменимо» внутри объявленного коридора 0.20…0.50
  all_three_required: >-
    три условия выполняются ВМЕСТЕ. Альфа без падения конфликтов означает,
    что согласие выросло по другой причине, и переносить это на 275 актов
    нельзя. Падение конфликтов без альфы означает, что статус забрал
    спорные акты, но согласие на остальных не появилось.
  if_not_met: >-
    полный перепрогон НЕ делается. Канал А остаётся без стрелки, и это
    публикуется как объявленный заранее законный исход. Правка K11
    остаётся в своде как починка спецификации, а не как спасение замера.
  threshold_not_moved: >-
    0.667 — порог Криппендорфа, объявленный 07.10 до первого платного
    запроса, в criteria/declared_before_arrow_2026-10-07.yaml. Этот файл
    его НЕ меняет и не вводит второго.

# ── ЧЕМ ПИЛОТ ОПРОВЕРГАЕТСЯ ──────────────────────────────────────────────
falsification:
  состав_разошёлся: >-
    если прогон пойдёт не по выписанному списку из 30 bill_id — результат
    непригоден независимо от чисел.
  статус_противоречит_нормам: >-
    акт со статусом «неприменимо», у которого в norms есть хотя бы одна
    запись, — противоречие внутри одного ответа. Такие акты считаются и
    называются; больше трёх означает, что модель статус не поняла, и
    пилот измеряет не то, что объявлено.
  альфа_выросла_только_исключением: >-
    если альфа на 30 актах пройдёт порог, но ТОЛЬКО за счёт того, что
    спорные акты ушли в «неприменимо», — проверяется отдельно: альфа
    пересчитывается на подмножестве актов, где ОБА читателя дали знак и
    под 1.2, и под 1.3. Если там она не выросла, рост объясняется
    знаменателем, а не чтением, и полный перепрогон запрещён.

# ════════════════════════════════════════════════════════════════════════
# ПОПРАВКА 07.10.2026, 22:00. ВНЕСЕНА ДО ПЕРВОГО ОТВЕТА 1.3 — ни одного
# платного вызова по кодбуку 1.3 ещё не сделано.
#
# ЧТО ЗАСТАВИЛО: аудит Кодекса, заказанный специально на вопрос «как этот
# пилот может пройти ЛОЖНО», до траты денег. Он предъявил вход, который
# проходит все три объявленных условия, НЕ РАЗРЕШИВ ни одного настоящего
# расхождения: реальная база плюс шесть односторонних неприменимостей плюс
# одна совпавшая смена (−1,−1) → (+1,+1) дают альфу 0,7523, конфликтов
# «ноль против знака» 3 и долю 20%. Контрольная альфа тоже растёт — с
# 0,7490 до 0,7523. То есть защита, которую я считал достаточной, пропускает
# ровно тот случай, против которого написана.
# ════════════════════════════════════════════════════════════════════════

amendment:
  дыра_1_спор_о_применимости: >-
    При A = знак, O = «неприменимо» акт выпадает И из числовой альфы, И из
    контрольного подмножества «оба дали знак в обеих версиях». Назвать это
    случаем «ни один из них ничего не измерял» нельзя: один измерил, второй
    сказал, что мерить нечего. Это СПОР О ПРИМЕНИМОСТИ, и он не должен
    исчезать из счёта молча — иначе статус «неприменимо» становится
    инструментом удаления неудобных актов.
  статусы_объявлены: >-
    ответ каждого вендора по акту получает ровно один из четырёх ярлыков:
    знак (−1, 0, +1) · неприменимо · отказ (sign=null) · ошибка. Таблица
    A×O печатается по всем 37 актам; знаменатель долей — все заявленные
    акты, а не выжившие. Google считается ОТДЕЛЬНО и пару не меняет.
  условие_4_добавлено: >-
    односторонних споров о применимости (один вендор «неприменимо», второй
    знак) — НЕ БОЛЬШЕ ДВУХ из 30. Это четвёртое условие, и оно выполняется
    вместе с тремя прежними. Обоснование предела: предъявленный Кодексом
    ложный проход держится на шести таких спорах; два — предел, при котором
    они не могут объяснить ни падение конфликтов вдвое, ни переход альфы.
    Больше двух — перепрогон запрещён до ручного разбора этих актов по
    нормам, а не по знаку.
  условие_5_добавлено: >-
    на фиксированном подмножестве, где ОБА вендора дали числовой знак и под
    1.2, и под 1.3, число ПАР, расходившихся под 1.2 и расходящихся под 1.3,
    обязано УМЕНЬШИТЬСЯ. Рост одной альфы недостаточен: совпавшая смена
    знака у согласованного акта поднимает альфу, не разрешив ни одного
    спора. Если подмножество меньше 12 пар — величина не считается, и
    перепрогон запрещён как неизмеримый.
  коридор_пересчитан: >-
    верх коридора опущен с 0,50 до 0,30. Причина: гипотеза, которую пилот
    проверяет, — что в «неприменимо» уедут спорные акты, а их девять из
    тридцати, то есть максимум 0,30. Доля выше 0,30 означает, что статус
    забрал и бесспорные акты, и это НЕ подтверждение правки, а новый
    дефект. Низ опущен с 0,20 до 0,10 и разведён на два разных вопроса:
    любое ненулевое число «неприменимо» доказывает, что поле ДОШЛО до
    модели; содержательная частота проверяется коридором 0,10–0,30.
    Прежний низ 0,20 был взят переносом 15/22 на девять конфликтов
    (6,14 акта = 0,2045) — то есть ровно на границе, и попадание под неё
    ничего бы не сказало. Безусловный перенос 15/130 даёт 0,115.
  подложенные_контроли: >-
    к 30 актам сравнения добавляются 7 подложенных контролей из основного
    состава (2198130, 2198191, 2207472, 2219438, 2201200, 2197909,
    2198907). Они объявлены ОТДЕЛЬНЫМ набором и в сравнение согласия НЕ
    входят: их предмет — ловит ли прибор норму с известным знаком. Без них
    классификатор падает (sel["oracle"] обязателен), и это обнаружилось
    при подготовке запуска, а не при нём. Итого 37 актов, цена ≈$26.
  примесь_названа: >-
    прогон 1.2 шёл 07.10 с 20:00, пилот пойдёт позже; имена моделей те же,
    но провайдер мог обновить модель под тем же именем, и ПРОВЕРИТЬ это из
    репозитория нельзя. Это неустранимая примесь: часть разницы между 1.2 и
    1.3 может быть не кодбуком. Названа здесь, а не в сносках отчёта.
  чего_даже_прошедший_пилот_не_докажет: >-
    ни причинного вклада одного кодбука (примесь выше), ни правильности
    стрелки: общее неверное прочтение обоими вендорами даёт альфу 1.
    Пилот решает ровно один вопрос — стоит ли платить за полный прогон.
  вероятность_порога_конфликтов: >-
    P(X ≤ 4 | n=30, p=0,3) = 0,0302 при независимых одинаковых испытаниях.
    Значит порог «не больше четырёх» не является шумом — но p оценён по тем
    же отобранным актам, а независимость не установлена. Числом названо,
    доказательством не выдаётся.

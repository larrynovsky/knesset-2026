#     число конфликтов и куда пойдёт альфа.
#   ЧЕМ ЭТО ГРЯЗНО, НАЗЫВАЮ САМ: правка кодбука сделана ПОСЛЕ просмотра
#     результатов 1.2. Порядок «увидел — поправил — измерил» хуже, чем
#     «объявил — измерил», и никакая аккуратность этого не отменяет.
#     Защита здесь ровно одна: правило решения объявлено до пилота числами,
#     которые нельзя подвинуть незаметно, и порог 0,667 остаётся тем, что

#     согласие вендоров, альфу 0,505 на 135 парах, матрицу A×O, разбор
#     обоснований нулей, контрфакт Кодекса (исключение актов с пустыми
#     нормами даёт 0,577 номинальную и 0,624 ординальную). На этих тридцати

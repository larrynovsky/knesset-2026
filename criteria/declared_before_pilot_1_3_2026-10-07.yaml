#     «ноль против знака». Базовая линия потому и выписана сюда числом.
#   НЕ ВИДЕЛ: ни одного ответа под кодбуком 1.3 — его на момент этого
#     коммита не существует вовсе, статус «неприменимо» модели ещё не

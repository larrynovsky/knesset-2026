# Правило уверенности для направления акта. Объявлено ДО прогона.
#
# Решение владельца 01.08.2026, вариант В: согласие вендоров перестаёт быть
# рубильником на весь канал и становится уровнем уверенности КАЖДОГО акта.
# §6 требует уверенности с НАЗВАННОЙ причиной — здесь причина вычисляется.
#
# Почему двух чисел, а не одного. Разбор 01.08 показал два разных режима
# отказа, которые прежнее одно число («согласие по общему знаку») смешивало:
#   полнота извлечения — вендоры видят РАЗНЫЕ множества норм (6 против 0,
#     12 против 5); доминирует, три акта из четырёх;
#   чтение нормы — на ОБЩИХ нормах дают противоположные знаки; 3 из 7.
# Одно число не говорит, что чинить, и не даёт читателю названной причины.

matching:
  # Как две цитаты признаются одной нормой. Это место я уже сломал однажды:
  # первая редакция сравнивала СЫРЫЕ ивритские строки по 40-знаковому
  # префиксу и дала ложный ноль конфликтов, потому что у одного вендора
  # цитата начинается с «(ב) », а у другого нет.
  normalize: norm_he            # та же нормализация, что у цитат карточки
  rule: containment             # одна нормализованная цитата входит в другую
  rationale: >
    Равенство не годится: вендоры режут цитату по разной длине. Вхождение
    ловит и «(ב) X, тוך…» против «X», и обрезанную версию длинной нормы.

metrics:
  overlap:
    formula: "|A ∩ O| / |A ∪ O|"
    means: "видели ли вендоры одни и те же нормы (полнота извлечения)"
  reading:
    formula: "доля пар с равными знаками среди общих норм"
    means: "одинаково ли прочли то, что оба увидели"

# Пороги объявлены до данных. Это догадки, и в этом смысл: их нельзя
# подвинуть, увидев результат, иначе как коммитом criteria-revision:
# с названным поводом.
levels:
  - confidence: high
    when: "overlap >= 0.60 и reading == 1.00 и обе стороны нашли >= 1 норму"
    note: "потолок §8 действует поверх: пустой holdout не даёт high"
  - confidence: medium
    when: "overlap >= 0.30 и reading >= 0.75"
  - confidence: low
    when: "всё остальное при хотя бы одной найденной норме"
    reason_by_case:
      - if: "одна из сторон нашла 0 норм"
        confidence_reason: "один из вендоров не нашёл ни одной нормы"
      - if: "overlap < 0.30"
        confidence_reason: "вендоры извлекли разные множества норм"
      - if: "reading < 0.75"
        confidence_reason: "вендоры разошлись в чтении общих норм"
  - confidence: none
    when: "обе стороны нашли 0 норм"
    confidence_reason: "ни один вендор не выделил норм в этом акте"

# Канал целиком по-прежнему может быть объявлен непригодным — но по
# правилу, названному ДО прогона, а не по впечатлению от чисел.
channel_escape:
  rule: >
    Если доля актов с уверенностью low или none превышает ОДНУ ТРЕТЬ,
    канал А объявляется не дающим направления. Документ тогда строится на
    «голосовала за / против» с текстом опции (§10) и без интерпретации.
  rationale: >
    Не эстетика и не круглое число: документ существует, чтобы вычеркнуть
    2–3 списка из двенадцати. Если треть актов несёт «мы не знаем»,
    свидетельство по партии истончается ниже пригодности к решению, и
    честнее сказать это одной строкой, чем двенадцать раз по частям.
  status: объявлено до прогона, ни разу не применялось

# Порог 85% по среднему согласию отменяется этим файлом как критерий
# остановки. Причина не в том, что он строг, а в том, что он мерил
# смещённую выборку: приёмка K2d выбрасывала 26 ответов из 151, и 100% из
# них — акты с разнонаправленными нормами. Среднее по оставшимся отвечало
# на вопрос о лёгких актах.
supersedes:
  - "criteria/keyvotes.yaml: direction_codebook, порог среднего согласия 85%"

oracle:
  # Правило сопоставления обязано проверяться на том случае, который его
  # однажды обманул, — иначе это снова проверка на удобных данных.
  must_pair:
    - ["(ב) פרסום מכרז לאיוש משרה בשירות המדינה יבוצע בדרך של מכרז פומבי, תוך",
       "פרסום מכרז לאיוש משרה בשירות המדינה יבוצע בדרך של מכרז פומבי"]
  must_not_pair:
    - ["היועץ המשפטי לממשלה נושא באחריות למילוי תפקידו בפני הממשלה",
       "פרסום מכרז לאיוש משרה בשירות המדינה"]

# ГРАНИЦА §3 — что автор видел и чего не видел, когда писал этот файл
#
# ВИДЕЛ:
#   — статистику приёмки: 26 отказов из 151 по правилу K2d, 100% из них на
#     актах с разнонаправленными нормами;
#   — четыре акта, на которых вендоры разошлись по общему знаку, целиком:
#     их нормы, знаки, цитаты (2198130, 2201594, 2203822, 2224367);
#   — перекрытие и согласие на этих ЧЕТЫРЁХ актах: 6/0, 4/2, 12/5, 2/1 норм,
#     на семи общих нормах четыре согласия и три конфликта.
#
# НЕ ВИДЕЛ:
#   — распределения перекрытия и согласия по всем 57 актам: эти два числа до
#     сих пор не считались ни разу, файл вводит их впервые;
#   — ни одного результата после починки промпта; прогона не было.
#
# ЧЕСТНАЯ ОГОВОРКА, которую надо держать при чтении порогов. Числа 0.60,
# 0.30, 0.75 и «одна треть» выбраны ПОСЛЕ того, как я посмотрел четыре
# разошедшихся акта. Формально это загрязнение: величины подобраны человеком,
# видевшим часть данных. Смягчает его то, что четыре акта — это ровно те, где
# согласия НЕТ, то есть худший конец распределения, и подгонять пороги под них
# в свою пользу невозможно: они и так попадают в low при любом разумном
# выборе. Но полностью снять оговорку нельзя, и она остаётся здесь.
#
# Сдвиг любого из четырёх чисел после первого прогона — только отдельным
# коммитом criteria-revision: с названным поводом.

# ДОПОЛНЕНИЕ 01.08.2026, записано ВО ВРЕМЯ прогона и ДО его результатов.
#
# Обнаружено при запуске: вендоров три, не два — подключён gemini-2.5-pro, и
# в classify_direction есть кворум «два из трёх» для ЗНАКА. Правило выше
# написано для пары. Расширять его на тройку, уже видя результаты, нельзя:
# это подгон определения под данные.
#
# Решение: правило применяется БУКВАЛЬНО к объявленной паре
# (anthropic, openai) — той же, на которой оно выведено и на которой считан
# замер 65%. Третий вендор НЕ выбрасывается: его ответы сохраняются целиком
# и войдут в измерение по правилу, объявленному ОТДЕЛЬНО и ДО их первого
# использования. Выбрасывать данные дороже, чем сузить их потом.
#
# Почему не «худшая пара из трёх» и не «медиана»: обе величины пришлось бы
# определить сейчас, зная, что результаты уже считаются. Любой выбор
# выглядел бы обоснованным, и отличить его от подгонки было бы нечем.
#
# Кворум и это правило отвечают на РАЗНЫЕ вопросы и не заменяют друг друга:
# кворум решает, какой знак записать; правило — насколько ему верить.


# ─────────────────────────────────────────────────────────────────────────
# ПОПРАВКА 13.08.2026 — criteria-revision
#
# ЧТО ЗАСТАВИЛО ПЕРЕСМОТРЕТЬ. Второй агент, читая прибор, заметил: правило
# выше меряет согласие ПО НОРМАМ и нигде не требует, чтобы вендоры сошлись
# в ОБЩЕМ знаке акта. Проверено на живых данных — два акта из семнадцати
# «сильных» несут взаимоисключающие выводы:
#   2203822 — перекрытие 0.50, чтение 0.75, знаки −1 и +1 → числился medium
#   2226950 — перекрытие 0.67, чтение 0.75, знаки −1 и  0 → числился medium
#
# Это регресс, внесённый самой редакцией 01.08. Она сняла прежний критерий
# «согласие по общему знаку» — и сняла верно: он смешивал два режима отказа
# и не говорил, что чинить. Но вместе с ним ушла гарантия, что вендоры
# вообще пришли к одному выводу об акте. Замена лечила диагноз и потеряла
# то, что старое правило защищало неявно.
#
# Порог НЕ ослабляется и НЕ ужесточается: 0.30 / 0.60 / 0.75 остаются как
# были. Добавлено условие поверх них.
#
# Найдено чтением, а не механизмом. Оракула, который бы это поймал, в
# проекте не было и в этой поправке не появляется: проверка ниже стережёт
# уже названный случай, а не класс «правило потеряло гарантию».

amendment_2026_08_13:
  applies_to: [high, medium]
  rule: >
    Если оба вендора предъявили общий знак акта и знаки РАЗНЫЕ, уровень
    опускается до low с причиной «вендоры разошлись в общем знаке акта».
    Пороги перекрытия и чтения при этом не меняются.
  not_a_clash:
    - "знак не предъявлен ни одним — поправка не применяется"
    - "знак предъявлен одним из двух — не расхождение, а нехватка данных"
  why_not_silent_drop: >
    Акт не выбрасывается из замера, а получает названную причину: §6 требует
    причины, а §7 — чтобы «не смотрели» не выглядело как «смотрели и пусто».
  oracle: >
    scripts/direction_confidence.py --selftest, пять утверждений: понижение
    при расхождении, названная причина, отсутствие эффекта при совпадении,
    при None и при одном предъявленном знаке из двух.
  effect_declared_before_rerun: >
    Ожидание до прогона: сильных актов станет 15 вместо 17, доля слабых
    вырастет с 69% до 73%. Если прогон даст другое число — расхождение
    объясняется, а не подгоняется.

# themes — рамка владельца. v1.0, 2026-07-28.
#
# Это ПРЕДПОЧТЕНИЯ, а не исследуемые вопросы (различение введено 2026-07-28
# после ошибки с преемственностью). Здесь оракул — владелец, и заменить его
# нельзя. Что считается ДЕЛОМ по каждой теме — наоборот, исследуемый вопрос,
# и он живёт в criteria/keyvotes.yaml, а не здесь.
#
# §17: рамка объявляется на первом экране публикации. Темы выбраны владельцем,
# а не выведены из данных, и документ этого не скрывает.
#
# Методологическая опора: Chapel Hill Expert Survey, израильская версия
# (chesdata.eu/chesisrael; Zur & Bakker, Party Politics 2025) — 50 экспертов,
# 16 партий, волны 2022 и 2023. Оси взяты оттуда, кроме первой: её в CHES нет.

version: "2.0"
revised_at: "2026-07-31"
revised_by: Саша
что_заставило_пересмотреть: >-
  Владелец переформулировал замысел своими словами: прибор должен показывать
  поступки по осям, а не слова, и показывать, идёт ли партия в одну сторону
  или мечется. Разбор шести вопросов 31.07 вскрыл, что рамка v1.0 не
  различала РОЛЬ оси. Все четыре оси в ней выглядели одинаково, а работают
  по-разному: по одной владелец готов вычёркивать список, по трём — нет.
  Без этого различения правило «одна осечка перевешивает» ломается: при
  четырёх решающих осях осечка найдётся у всех, и прибор дисквалифицирует
  весь бюллетень.
source: "CHES-Israel (Zur & Bakker 2025) + V-Dem компоненты для оси 1"

themes:
  - id: rule_of_law
    role: РЕШАЮЩАЯ
    signed: true
    role_note: >-
      Единственная ось, по которой владелец готов вычеркнуть список. Только
      здесь делается ручной разбор расхождений между вендорами; знаки
      выверяются. Владелец 31.07: «решающая ось — rule_of_law, она же
      демократичность».
    columns: [равенство_внутри, правовой_режим_на_территориях]
    columns_note: >-
      Две колонки НЕ складываются (K9). Признак приписанного различия (K8)
      захватывает правовой режим на территориях, и если сложить, решающая
      ось начнёт делить партии по арабо-израильскому вопросу, а не по тому,
      ради чего создана. Разделение обратимо, слияние — нет.
    rank: 1
    title_ru: "Разделение властей и гражданские свободы"
    owner_words: "ограничение свобод, узурпация власти, разрушение баланса ветвей власти"
    # РЕШАЮЩАЯ. Владелец назвал её той, одна осечка по которой перевешивает
    # всё остальное. С неё начинается пилот, на ней калибруется конвейер.
    ches_mapping: "частично CIVLIB и DEMOCRATIC_V_JEWISH; полного аналога в CHES НЕТ"
    external_anchor: "V-Dem: судебные и законодательные ограничения исполнительной власти"
    channel_a_votes: сильный      # Основные законы, судебная реформа, поимённо
    channel_b_budget: слабый      # узурпация власти не покупается бюджетной строкой
    note: >
      Самая документированная ось каденции 2022-2026: реформу замораживали,
      возобновляли и проводили частями, одни и те же партии голосовали по-разному
      в разные месяцы. Раскол шёл не строго коалиция/оппозиция.
      §13 здесь режет по живому: «голосовала за ограничение судебного надзора,
      дата, номер» — факт; «разрушала баланс властей» — вердикт. Держим первое.

  - id: economy
    role: описательная
    signed: true
    role_note: >-
      Знаки машинные, ручного разбора расхождений НЕ будет. В отчёте
      помечается: «не выверено вручную, знаки могут быть неточны».
    signed_from: производитель
    признак: >-
      ПОЗИЦИЯ ВЛАДЕЛЬЦА, объявленная 31.07, а не нейтральное измерение, и
      §17 требует сказать это на первом экране. Дословно: «экономика
      строится на тех, кто производит, а не тех, кто потребляет».
      Плюс — норма увеличивает права и возможности бизнеса, снижает налоги
      и поборы, уменьшает преграды и барьеры. Минус — обратное.
      Смотрим ТОЛЬКО на то, что норма делает с производителем, независимо
      от того, ради чего принята: мотив законодателя мы читать не умеем.
      Защита прав трудящихся и потребителей плюса не даёт; если такая норма
      создаёт барьер производителю, она получает минус.
    убрано_31_07: >-
      «Повышает инвестиционную привлекательность» исключено из признака:
      читается только по экономической модели, которой у нас нет, и стало
      бы местом, куда складывается всё, что кодировщику показалось верным.
    защита_от_зеркала: >-
      У нас есть CHES-Israel с экспертной оценкой lrecon по всем партиям.
      Если наши знаки по этой оси почти совпадут с лево-правым делением
      экспертов — мы переоткрыли опрос, а не измерили поведение. Порог
      совпадения объявляется ДО прогона, отдельным коммитом.
    rank: 2
    title_ru: "Экономика: налоги, расходы, секторальные трансферты"
    owner_words: "противник социализма; важно видеть интенты — кто занимается экономикой, а кто растит налоги"
    ches_mapping: LRECON
    channel_a_votes: средний
    channel_b_budget: сильный
    axis_form: >
      Ось с двумя концами, НЕ охота за повышениями налогов. Партия, снижавшая
      налоги, попадает в тот же список с обратным знаком. Иначе это Snyder:
      отбор, максимально разделяющий своих и чужих, подтверждает искомое.
      Проверка: прибор обязан уметь удивить владельца. Если он не способен
      показать, что «правая» партия растила расходы — он зеркало, а не прибор.
    known_finding: >
      Крупнейшие получатели коалиционных фондов — религиозные правые партии.
      «Правый» в израильском смысле и «за меньшее государство» — не одно и то же.

  - id: religion_state
    role: описательная
    signed: true
    rank: 3
    title_ru: "Государство и религия"
    ches_mapping: "RELIGIOUS_PRINCIPLES, DEMOCRATIC_V_JEWISH"
    channel_a_votes: сильный
    channel_b_budget: сильный      # ешивы, призыв, коалиционные фонды

  - id: security
    role: описательная
    signed: false
    signed_note: >-
      ОСЬ БЕЗ ЗНАКА — только перепись фактов: за что голосовали, что
      финансировали, кто что подписал. Причина: 31.07 ось расщепилась.
      Её гражданско-правовая половина (задержания без суда, обыски без
      ордера, ограничение собраний, военные суды для гражданских) кодируется
      признаком K1 и потому принадлежит оси 1, где ей и место. Остаток —
      позиционные вопросы: поселения как политика, операции, оборонный
      бюджет. Там нет отношения «гражданин против государства», и знак
      означал бы позицию автора, а не свойство нормы.
      Следствие: эта ось НЕ участвует в определении направления партии и
      молчит в матрице последовательности. Сказано вслух, чтобы читатель не
      счёл это недоделкой.
    rank: 4
    title_ru: "Безопасность и конфликт"
    ches_mapping: "ISRAEL_PALESTINE, JEWISH_SETTLEMENTS, PALESTINIAN_STATE"
    channel_a_votes: средний
    channel_b_budget: средний      # бюджет поселений прослеживается, оборонный хуже

# СОЦИАЛЬНАЯ ПОЛИТИКА рассмотрена 31.07 и НЕ заводится отдельной осью.
# Она распадается: правила «кто кому обязан» идут в экономику, распределение —
# в бюджетный слой, принуждение — в ось 1. Пятая ось создала бы акты с тремя
# знаками сразу и вернула бы субъективность через заднюю дверь.
# Правило пересмотра объявлено заранее: если в корпусе окажется больше десятой
# части актов, не ложащихся ни в одну из четырёх осей, — ось нужна.
#
# «ПОЛИТИКА» из формулировки владельца 31.07 = ось 1. Отдельной оси про
# устройство политической системы (партийное финансирование, порог, выборное
# законодательство) не заводится: владелец её не подтвердил.
#
# ИСКЛЮЧЕНЫ ОСОЗНАННО: ARAB_WORLD, GENDER_EQUALITY, ANTI_ISLAM_RHETORIC.
# Причина не в важности, а в проверяемости: делами по нашим данным они
# не меряются, а спрашивать позицию владельца по тому, что нечем проверить
# у партий, — производить видимость работы.

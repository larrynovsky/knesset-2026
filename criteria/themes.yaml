# themes — рамка владельца. v1.0, 2026-07-28.
#
# Это ПРЕДПОЧТЕНИЯ, а не исследуемые вопросы (различение введено 2026-07-28
# после ошибки с преемственностью). Здесь оракул — владелец, и заменить его
# нельзя. Что считается ДЕЛОМ по каждой теме — наоборот, исследуемый вопрос,
# и он живёт в criteria/keyvotes.yaml, а не здесь.
#
# §17: рамка объявляется на первом экране публикации. Темы выбраны владельцем,
# а не выведены из данных, и документ этого не скрывает.
#
# Методологическая опора: Chapel Hill Expert Survey, израильская версия
# (chesdata.eu/chesisrael; Zur & Bakker, Party Politics 2025) — 50 экспертов,
# 16 партий, волны 2022 и 2023. Оси взяты оттуда, кроме первой: её в CHES нет.

version: "1.0"
source: "CHES-Israel (Zur & Bakker 2025) + V-Dem компоненты для оси 1"

themes:
  - id: rule_of_law
    rank: 1
    title_ru: "Разделение властей и гражданские свободы"
    owner_words: "ограничение свобод, узурпация власти, разрушение баланса ветвей власти"
    # РЕШАЮЩАЯ. Владелец назвал её той, одна осечка по которой перевешивает
    # всё остальное. С неё начинается пилот, на ней калибруется конвейер.
    ches_mapping: "частично CIVLIB и DEMOCRATIC_V_JEWISH; полного аналога в CHES НЕТ"
    external_anchor: "V-Dem: судебные и законодательные ограничения исполнительной власти"
    channel_a_votes: сильный      # Основные законы, судебная реформа, поимённо
    channel_b_budget: слабый      # узурпация власти не покупается бюджетной строкой
    note: >
      Самая документированная ось каденции 2022-2026: реформу замораживали,
      возобновляли и проводили частями, одни и те же партии голосовали по-разному
      в разные месяцы. Раскол шёл не строго коалиция/оппозиция.
      §13 здесь режет по живому: «голосовала за ограничение судебного надзора,
      дата, номер» — факт; «разрушала баланс властей» — вердикт. Держим первое.

  - id: economy
    rank: 2
    title_ru: "Экономика: налоги, расходы, секторальные трансферты"
    owner_words: "противник социализма; важно видеть интенты — кто занимается экономикой, а кто растит налоги"
    ches_mapping: LRECON
    channel_a_votes: средний
    channel_b_budget: сильный
    axis_form: >
      Ось с двумя концами, НЕ охота за повышениями налогов. Партия, снижавшая
      налоги, попадает в тот же список с обратным знаком. Иначе это Snyder:
      отбор, максимально разделяющий своих и чужих, подтверждает искомое.
      Проверка: прибор обязан уметь удивить владельца. Если он не способен
      показать, что «правая» партия растила расходы — он зеркало, а не прибор.
    known_finding: >
      Крупнейшие получатели коалиционных фондов — религиозные правые партии.
      «Правый» в израильском смысле и «за меньшее государство» — не одно и то же.

  - id: religion_state
    rank: 3
    title_ru: "Государство и религия"
    ches_mapping: "RELIGIOUS_PRINCIPLES, DEMOCRATIC_V_JEWISH"
    channel_a_votes: сильный
    channel_b_budget: сильный      # ешивы, призыв, коалиционные фонды

  - id: security
    rank: 4
    title_ru: "Безопасность и конфликт"
    ches_mapping: "ISRAEL_PALESTINE, JEWISH_SETTLEMENTS, PALESTINIAN_STATE"
    channel_a_votes: средний
    channel_b_budget: средний      # бюджет поселений прослеживается, оборонный хуже

# ИСКЛЮЧЕНЫ ОСОЗНАННО: ARAB_WORLD, GENDER_EQUALITY, ANTI_ISLAM_RHETORIC.
# Причина не в важности, а в проверяемости: делами по нашим данным они
# не меряются, а спрашивать позицию владельца по тому, что нечем проверить
# у партий, — производить видимость работы.

# Предсказание к ревизии 14: группа G «равенство перед законом»
#
# Зачем существует этот файл. Группа G заведена ПОСЛЕ того, как данные оси уже
# собраны, — это нарушение §3 в чистом виде. Ярлык `criteria-revision:` гасит
# машинную проверку канала, но не отменяет самой опасности: правило, написанное
# при виде данных, невозможно отличить от правила, подогнанного под данные,
# иначе как по тому, было ли сказано заранее, чего мы ждём.
#
# Поэтому: числа ниже записаны ДО первого прогона scan_bills с группой G.
# Коммит с этим файлом обязан быть старше новой версии data/bills_scan.json.
# Промах предсказания публикуется так же громко, как попадание.

version: "1.0"
drafted_at: "2026-07-31"
drafted_by: Claude
основание_ревизии: >-
  Слово владельца 31.07 после показанной цены: «сделай». До этого владелец
  выбрал вариант А по промпту и был предупреждён, что группа G обнулит кэш.
  Мораторий на правки критериев формально не начинался (он привязан к первому
  сквозному срезу, среза нет), но моё же предложение считать 13-ю ревизию
  последней — снято владельцем явно, а не обойдено молчанием.

# =============================================================================
# ГРАНИЦА §3 — что автор предсказания видел, а что нет
# =============================================================================
# §3-channel: direction-equality
# §3-data-markers: data/bills_scan.json, data/direction_full_*.json
#
# ВИДЕЛ:
#   - полный список названий 25-го Кнессета (data/bills_all_names.json, 7491)
#     и число совпадений грубых маркеров привилегии: ~75;
#   - что в старом корпусе оси (851) кандидатов на K8 ровно 1, и тот по
#     ситуативному признаку (нарушение слуха), а K8 такие исключает;
#   - десяток названий из этих 75, в том числе про отсрочку от службы по
#     основанию религиозного обучения и про позитивную дискриминацию друзов.
#
# НЕ СМОТРЕЛ:
#   - ни одного ответа модели ни по одному из этих актов;
#   - ни одного знака, ни одной колонки, ни одного пункта чек-листа в ответах;
#   - голосования по этим актам: votes_25.json содержит только 258 строк,
#     уже отфильтрованных старым чек-листом, и группы G в них быть не могло.
#
# Различение, на котором всё держится: смотреть, СКОЛЬКО актов правило
# затрагивает, — определение объёма, и оно законно. Смотреть, ЧТО модели на них
# ответили, и подгонять формулировку — подгонка. Сделано только первое.
# =============================================================================

предсказания:

  - id: P1
    что: сколько законопроектов группа G добавит в перепись
    ожидание: "от 90 до 260"
    почему: >-
      Грубые маркеры дали ~75 при пересечении ДВУХ условий сразу (привилегия И
      приписанный признак). Лексика G шире: она срабатывает по ОДНОМУ токену,
      как и все прочие группы. Нижняя граница — если почти все совпадения уже
      ловились другими группами; верхняя — если «פטור» окажется таким же
      частым, как «מינוי» в группе C (там 933 попадания на 7491).
    чем_опровергается: >-
      Меньше 90 значит, что лексика узка и предмет K8 по-прежнему почти не
      виден — тогда чинить лексику, а не радоваться скромной добавке.
      Больше 260 значит, что «פטור» ведёт себя как канцелярская формула и
      тащит налоговые льготы; тогда токен уходит в NOISE или сужается
      сочетанием, и это правка ИНСТРУМЕНТА, а не критериев.

  - id: P2
    что: найдётся ли акт про отсрочку либо освобождение от службы в 2025 году
    ожидание: "да, минимум один"
    почему: >-
      Не из списка названий, а из criteria/periods.yaml: ШАС вышла из
      правительства 2025-07-22 по вопросу о призыве. Партия не выходит из
      правительства из-за законопроекта, которого нет.
    чем_опровергается: >-
      Пустой результат означает, что либо лексика не ловит предмет, либо
      законодательная форма этого конфликта иная (постановления вместо
      законопроектов) — и второе меняет замысел канала А сильнее, чем первое.
    механизм: ORACLE в scripts/scan_bills.py, запись 2025-01-01

  - id: P3
    что: доля актов, где G окажется ЕДИНСТВЕННОЙ сработавшей группой
    ожидание: "больше половины добавленных"
    почему: >-
      Если бы предмет K8 пересекался с институциональной лексикой, он попадал
      бы в перепись и раньше — а он не попадал: в 851 акте его нет. Значит
      пересечение мало́ по построению.
    чем_опровергается: >-
      Малая доля значит, что акты и так были в переписи и невидим был только
      ПУНКТ, а не популяция. Тогда диагноз «отсечено на входе» неверен, и это
      надо сказать вслух: вся ревизия построена на утверждении о корпусе.

  - id: P4
    что: знак на подложенной норме ctl-k8-exempt после появления G1
    ожидание: "−1, кворум не менее двух из трёх, пункт G1 у большинства норм"
    почему: >-
      Знак −1 вендоры и так давали (двое из трёх 31.07). Новое здесь — ПУТЬ:
      до G1 два вендора кодировали освобождение ешиботников через F3 («норма
      под конкретное лицо, дело либо срок»), а третий не находил пункта вовсе
      и потому ставил 0.
    чем_опровергается: >-
      Если после появления G1 вендоры продолжат ставить F3 — значит пункт
      сформулирован так, что до него не дотягиваются, и виновата формулировка,
      а не модели. Если Anthropic по-прежнему даст 0 — значит его ноль был не
      про отсутствие пункта, и моё объяснение 31.07 было неверным.
    механизм: expect_items в scripts/classify_direction.py, ctl-k8-exempt

  - id: P5
    что: сдвиг распределения знаков по оси после добавления G
    ожидание: "доля −1 вырастет, но не станет подавляющей: от 0.35 до 0.60"
    почему: >-
      Кодбук сам называет цену: «минус получит ЛЮБАЯ партия, вводящая такое
      исключение, включая светские». Освобождения вводят чаще, чем отменяют,
      поэтому крен в минус ожидаем.
    чем_опровергается: >-
      Доля выше 0.60 — прибор, который умеет только осуждать; это прямо
      запрещено требованием двусторонности и означает, что G4 (ограничение
      права) и «+1 за выравнивание» на практике не срабатывают.
    честная_граница: >-
      Это предсказание слабее прочих: старое распределение по оси я помню
      приблизительно, а сверять с ним не пойду — иначе предсказание перестанет
      быть предсказанием. Считать его подтверждённым можно только вместе с
      напечатанным старым числом.

что_НЕ_предсказывается: >-
  Направление конкретных партий. Соблазн назвать заранее, кто получит минус за
  освобождение от призыва, велик и очевиден — и именно поэтому не назван:
  предсказание, совпадающее с симпатиями автора, ничего не проверяет, а
  расходящееся будет объяснено задним числом. Партийный срез считается
  механически и читается один раз, уже после прогона.

  # Добавлено перед Ф27c (перевыгрузка голосований), ДО её запуска.
  - id: P6
    что: сколько законопроектов группы G дошли до поимённого голосования
    ожидание: "не менее 10"
    почему: >-
      В корпусе 212 актов группы G, из них 39 — кандидаты по призыву и
      освобождению от службы. Вопрос разнёс коалицию в июле 2025. Если из
      двухсот с лишним актов до поимённого голосования дошли единицы, значит
      канал А структурально не видит эту тему, и это находка того же размера,
      что сегодняшняя.
    чем_опровергается: >-
      Меньше 10 означает, что предмет K8 живёт не в законопроектах, а в
      постановлениях, приказах и коалиционных решениях — и тогда группа G
      расширила перепись, но не расширила ДОКАЗАТЕЛЬНУЮ базу. Вывод был бы
      неприятный и обязателен к публикации: канал А показывает институты и
      почти не показывает равенство.
    почему_отдельно_от_общего_числа: >-
      Штатная проверка fetch_votes сравнивает ОБЩЕЕ число сшитых
      законопроектов с объявленным, с допуском 20%. При объявленных 145 полоса
      выходит 116–174, а прежнее значение 119 попадает в неё целиком: то есть
      проверка прошла бы, даже если новые акты не дали НИ ОДНОГО голосования.
      Ожидание на общем числе здесь не различает главное, поэтому объявляется
      второе — на приросте.
    механизм: >-
      Счёт сшитых законопроектов, у которых в groups есть G_равенство. Поле
      groups уже пишется в каждую строку data/votes_25.json.

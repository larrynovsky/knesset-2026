# Политические события 25-го Кнессета — список, закрываемый ДО анализа
#
# Зачем. Правило K10 позволяет проверять, есть ли у партии точка перелома —
# момент, до которого записи шли в одну сторону, а после в другую. Само по
# себе это наблюдение бесполезно: найдя перелом, можно пойти искать рядом
# событие, и оно найдётся ВСЕГДА — в израильской политике за три года нет
# недели без события. Постфактумное объяснение любой даты гарантировано.
#
# Поэтому список событий фиксируется ПЕРВЫМ, и совпадение перелома с датой
# засчитывается только против него. Несовпадение — тоже результат.
#
# Это третье место в проекте, где §3 применяется к суждению, а не к отбору
# данных. Первые два: criteria/mechanism_coding.yaml (предиктор кодируется до
# бюджета) и criteria/declared_before_2026-07-31.yaml (предсказание пишется
# до эталона).

# =============================================================================
# ГРАНИЦА §3 — что видел автор списка, а что нет
# =============================================================================
# §3-channel: political-events
# §3-data-markers: data/breakpoints_*.json, data/direction_by_party_*.json
#
# ВИДЕЛ:
#   - criteria/periods.yaml: 17 периодов участия партий в правительстве,
#     включая дату выхода ШАС 2025-07-22;
#   - общедоступную хронологию каденции.
#
# НЕ СМОТРЕЛ:
#   - ни одной точки перелома: анализ направления по партиям не запускался;
#   - распределение знаков по датам — не считалось;
#   - направление ни одной партии по оси 1 — не вычислялось.
#
# Это ЗАЯВЛЕНИЕ, не механизм. Механизируемая часть: коммит с этим файлом
# обязан быть старше первого прогона поиска переломов.
# =============================================================================

version: "1.0"
status: ЧЕРНОВИК — СПИСОК НЕПОЛОН, СМ. ПРАВИЛО ЗАКРЫТИЯ
drafted_at: "2026-07-31"
drafted_by: Claude
approved_at: null
approved_by: null

правило_закрытия: >-
  Список закрывается ДО первого прогона поиска переломов. Дополнение после
  прогона ЗАПРЕЩЕНО: событие, добавленное под уже увиденную дату, — это и есть
  подгонка, против которой список написан. Если после прогона обнаружится
  пропущенное событие, оно записывается отдельно с пометкой «добавлено после
  прогона» и в засчёт совпадений НЕ идёт.

честная_граница_составителя: >-
  Список составлен ассистентом по общедоступной хронологии и заведомо неполон.
  Каждая дата ниже помечена уровнем уверенности. Даты уровня «проверить»
  обязаны быть подтверждены по источнику ДО закрытия списка — иначе они
  выбрасываются, а не остаются как есть. Даты 2025–2026 годов покрыты хуже
  всего, и это названо, а не скрыто.

классы_событий:
  смена_состава: вход партии в правительство или выход из него
  угроза_коалиции: вотум недоверия, ультиматум партнёра, роспуск
  веха_повестки: точка, меняющая ход предмета оси 1
  внешний_шок: событие, меняющее всю повестку независимо от партий

события:
  - date: "2022-11-01"
    class: смена_состава
    what: выборы в 25-й Кнессет
    confidence: высокая

  - date: "2022-12-29"
    class: смена_состава
    what: >-
      приведение к присяге 37-го правительства
    confidence: высокая
    source: criteria/periods.yaml, сгенерирован из источника

  - date: "2023-01-04"
    class: веха_повестки
    what: представлен план изменения судебной системы
    confidence: проверить
    note: месяц уверен, число требует подтверждения

  - date: "2023-03-27"
    class: веха_повестки
    what: >-
      заморозка продвижения реформы после увольнения министра обороны и
      всеобщей забастовки
    confidence: проверить

  - date: "2023-07-24"
    class: веха_повестки
    what: принят закон об отмене основания разумности
    confidence: проверить
    note: >-
      ключевая дата для оси 1: единственная норма реформы, доведённая до
      принятия в этом виде

  - date: "2023-10-07"
    class: внешний_шок
    what: нападение и начало войны
    confidence: высокая

  - date: "2023-10-11"
    class: смена_состава
    what: расширение правительства, вход оппозиционной партии в кабинет
    confidence: проверить

  - date: "2024-01-01"
    class: веха_повестки
    what: отмена Верховным судом закона об основании разумности
    confidence: проверить

  - date: "2024-06-09"
    class: смена_состава
    what: выход партии, вошедшей в кабинет в октябре 2023
    confidence: проверить

  - date: "2025-07-22"
    class: смена_состава
    what: >-
      выход ШАС из правительства с сохранением участия в коалиции
    confidence: высокая
    source: criteria/periods.yaml

  - date: null
    class: смена_состава
    what: >-
      ПРОПУСК, НАЗВАННЫЙ ВСЛУХ: события 2025–2026 годов, включая изменения
      состава коалиции вокруг вопроса о призыве, в список не внесены —
      составитель не располагает надёжной хронологией этого периода.
      До закрытия списка этот пробел обязан быть закрыт по источнику.
    confidence: отсутствует

как_засчитывается_совпадение:
  окно: >-
    перелом считается совпавшим с событием, если он приходится на интервал
    ±30 дней от даты события. Ширина окна объявлена ДО прогона и не
    пересматривается по результату.
  что_совпадение_НЕ_доказывает: >-
    Мотив. «Мечутся ради сохранения места у власти» — гипотеза о причине, а
    причину мы читать не умеем и договорились не читать (то же решение, что и
    по мотиву законодателя в K1). Совпадение перелома с событием — свидетельство
    того, что направление изменилось рядом с событием, и ничего сверх этого.
  отрицательный_результат_публикуется: >-
    Если переломов не окажется вовсе или они не совпадут ни с одним событием,
    это записывается так же громко, как если бы совпали. Гипотеза владельца
    о метании имеет право не подтвердиться.

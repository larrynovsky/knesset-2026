# Названия фракций по-русски. v1.0, 2026-07-28.
#
# Это РЕШЕНИЯ, а не данные: в API Кнессета английских названий нет вообще
# (ноль свойств с "Eng" в метаданных OData v4), поэтому русская форма —
# выбор переводчика, и он версионируется наравне с критериями.
#
# §12: ивритский оригинал остаётся ключом и никуда не девается.
#
# Конвенции:
#   * устоявшаяся русская форма приоритетнее буквального перевода
#     (ШАС, Ликуд, Авода, Мерец — так пишет русскоязычная пресса Израиля);
#   * аббревиатуры оставлены аббревиатурами (БАЛАД, ХАДАШ, РААМ, ТААЛ, МАФДАЛ);
#   * «во главе с N» сохранено: это часть официального названия списка
#     и именно оно отличает записи разных каденций;
#   * КОЛЛИЗИЯ, решённая явно: и האיחוד הלאומי, и המחנה הממלכתי в прессе
#     переводят как «Национальное единство». Развожу: первое — «Ихуд Леуми»
#     (правый блок), второе — «Махане Мамлахти» (список Ганца). Иначе
#     в цепочках было бы две разные партии под одним русским именем.


# Глубина: с 16-го Кнессета (17.02.2003) — предел задан данными,
# поимённых голосований раньше нет. Бюджетный канал режется той же датой.
#
# Файл СГЕНЕРИРОВАН scripts/build_lineage_rule.py. Правки — через правило.

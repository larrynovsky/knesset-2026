# Решения владельца 20.10 19:31 — объявлены ДО пересчёта (§3).
# =============================================================================
# ГРАНИЦА §3 — что видел автор объявления, а что нет
# =============================================================================
# ВИДЕЛ: итог переписи (criteria/census_second_reading_2026-10-20.json) и её эффект на выводы (reviews/refine/E3_result.md);
#   список 24 законов суда, где чтения касаются расизма/дискриминации (reviews/refine/census/antiracism_pairs.json) и их прежние знаки;
#   15 направленных выводов траектории, на линиях которых есть точки «и так, и так» (до переписи);
#   фракции K24/K25 «Новой надежды» и «Государственного лагеря» в data/KNS_Faction.json и число их голосований в K24 (972: 2249, 1085: 4, 1088: 4).
# НЕ ВИДЕЛ: новых чтений 24 законов; выводов траектории с новой меткой; точек линии Саара в K24.
owner: "Саша, 20.10 19:31"
antiracism:
  words: "Законы против расизма — защита равенства при прочих равных"
  rule: "rule_of_law: закон против расизма или дискриминации (запрет расистской агитации, подстрекательства к расизму, запрет дискриминации) — +1, если другие эффекты нормы его не перевешивают; ограничение слова ради защиты от расизма само по себе −1 не даёт"
  apply: "24 закона из reviews/refine/census/antiracism_pairs.json перечитываются двумя слепыми читателями (Claude, Codex) с этим определением; их чтения заменяют прежние для этих пар; правило применения — прежнее (c6114fe, как экономика)"
mixed_direction_label:
  words: "Разнонаправленно"
  rule: "траектория: если по прежнему правилу вывод «системно» (одно направление ясных точек в обеих ролях), но среди точек в коалиции или оппозиции есть «и так, и так», — вывод «разнонаправленно», а не «системно». Остальные метки не меняются."
saar_line:
  words: "добавить прошлое"
  rule: "линия «Государственный правый (Саар)» получает прошлое «Новой надежды»: K24 — 972 (Новая надежда), 1085 (Государственный лагерь, общий с Ганцем), 1088 (Новая надежда — Единство Израиля); K25 — 1098 (Государственный лагерь, общий с Ганцем до раскола), 1108. Общие фракции входят в линию каждой участницы (правило lines траектории). Решение 19.10 «влившиеся партии — не прошлое Ликуда» не меняется."

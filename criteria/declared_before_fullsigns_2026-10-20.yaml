# Полная разметка тем по всем законопроектам, голосовавшимся в пленуме, Кнессеты 20–25.
# Владелец 20.10: «законопроекты без голосований не интересны… остальное качай»; «где не собрали — собери».
# Объявлено ДО разметки и ДО скачивания поимённых голосов по новым законам.
#
# ГРАНИЦА §3 — что автор видел и чего не видел:
#   ВИДЕЛ: число голосованных законопроектов по Кнессетам (probe_voted_bills: 20 — 1714, 21 — 3, 22 — 6, 23 — 262, 24 — 682;
#     25 — считается) и сколько из них уже было в выборке (226 / 1 / 2 / 39 / 78); названия законопроектов в bills_all_names
#     (не читались подряд, только формат записи); прежние знаки срезов и 25-го — они не пересматриваются.
#   НЕ ВИДЕЛ: ни одного знака по новым законам; ни одного поимённого голоса по ним; как изменятся точки траектории.
#
# §3-channel: fullsigns
# §3-data-markers: data/votes_full_*.json, criteria/full_signs_K*.json

run_id: fullsigns_2026-10-20
universe: >-
  Все законопроекты Кнессетов 20–25, по которым в KNS_PlenumVote есть хоть одно голосование, сшитое прямым ключом
  (SessionID, ItemID → KNS_PlmSessionItem.ItemTypeID=2) — data/voted_bills_<n>.json. Законопроекты без голосований не размечаются.
keep_existing: >-
  Законы, у которых уже есть знак (slice_signs_K20–24; для 25-го — знаки оси суда build_line_cards.axis_directions и
  theme_signs_economy/religion_state/security), не переразмечаются. Новая разметка — только для законов, которых в этих файлах нет.
  При чтении знаков прежний знак главнее нового.
meaning: >-
  Смысл знака — тот же, что у сайта, без изменений: суд и права +1 — укрепляет судебную власть, сдержки исполнительной власти
  и гражданские свободы, −1 — ослабляет; экономика — criteria/themes.yaml «признак» (производитель); религия — note
  theme_signs_religion_state (+1 больше места религии и религиозным институтам, −1 меньше); безопасность — note theme_signs_security
  (+1 расширяет полномочия армии/сил безопасности или ужесточает меры против террора, −1 сужает или усиливает гражданский контроль).
  0 — закон не относится к теме или эффект неясен. Знак — свойство закона, не голоса.
evidence: >-
  Только название законопроекта (для 25-го — также текст из data/bill_texts, если он есть). Названия старых Кнессетов
  бывают общими («поправка № 12») — тогда 0; угадывать содержание по номеру поправки запрещено.
procedure:
  readers: "два независимых читателя: Claude (параллельные подагенты, пачками) и Codex; друг друга не видят"
  agree: "одинаковый знак — принят"
  disagree: >-
    любой иной случай (0 против ±1, +1 против −1) — третье чтение отдельным подагентом Claude, который видит название и оба
    знака без указания, чей какой, и выбирает один из трёх ответов; его ответ окончательный. Число расхождений и исходы
    печатаются в criteria/full_signs_K<n>.json (поле adjudication).
  coverage_over_precision: "решение владельца 19.10 действует: знаки по названиям, не выверены вручную, это помечается на странице"
output: "criteria/full_signs_K<n>.json — {bill_id: {theme: sign}} + note + adjudication; голоса — data/votes_full_<n>.json"

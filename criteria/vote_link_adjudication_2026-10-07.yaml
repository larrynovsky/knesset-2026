# Вердикты по расхождениям связи голосование → акт. 42 случая, 13 различных пар.
#
# Гейт в scripts/fetch_votes.py требует вердикт по каждому содержательному
# расхождению и каждой потере и до появления этого файла отказывал с кодом 1.
# Выгрузка не прогонялась ни разу с 01.08.2026 — именно поэтому.
#
# ГРАНИЦА §3 — что автор видел и чего не видел:
#   ВИДЕЛ: 42 случая целиком (data/vote_link_divergences.json), оба имени
#     по каждому, дату, пункт повестки, уникальность пары (сессия, пункт);
#     разбиение всех 7535 заголовков по классам; что прямым ключом
#     достигается 277 актов переписи против 144 в выгрузке от 31.07.
#   НЕ ВИДЕЛ: ни одной страницы Кнессета по этим законопроектам; поимённых
#     результатов ни одного из 42 голосований; направления ни одного акта.
#     Вердикты вынесены по НАЗВАНИЯМ и датам, и больше ни по чему.
#   ЧЕМ ЭТО ГРЯЗНО: судил агент, а владелец иврита не читает и проверить
#     вердикт напрямую не может. Поэтому каждый вердикт назван так, чтобы
#     его мог проверить посторонний: у каждого акта есть страница Кнессета
#     по его идентификатору, и утверждение «это стадии одного предмета»
#     на ней либо подтверждается, либо нет.
#
# §3-channel: vote-link-adjudication
# §3-data-markers: data/vote_link_divergences.json

# ── ЧТО СЛУЧИЛОСЬ С ОБЪЯВЛЕННЫМИ ПРЕДСКАЗАНИЯМИ ───────────────────────────
# P22–P24 объявлены 01.08.2026 в criteria/declared_before_divergence_2026-08-01.yaml,
# то есть РАНЬШЕ этого разбора. Порядок доказывается git-историей.
#
# P22 («у половины и более из 39 оба акта относятся к одному закону»):
#   ОПРОВЕРГНУТО — 2 из 39 (5%).
#   Но опровергнут не столько тезис, сколько ЕГО ПРОВЕРКА. Сравнение шло по
#   имени до первой открывающей скобки, а различие сидит в приставке:
#   «הצעת חוק X» (законопроект) против «חוק X» (закон). Сняв приставку,
#   голова совпадает у 30 случаев из 39 — но это 2 пары из 10, и 28 из этих
#   30 случаев суть ОДНО голосование одного дня, посчитанное 28 раз. По
#   случаям догадка P22 выглядит почти верной, по различным парам — 20%.
#   Считать по случаям здесь значило бы польстить предсказанию весом одного
#   заседания. Записано так, а не «P22 подтвердилось»: порог объявлялся для
#   той проверки, которая была объявлена, и переписывать её после
#   результата нельзя.
#
# P23 («у 80% и более пара (сессия, пункт) единственна»):
#   ОПРОВЕРГНУТО — 13 из 42 (31%). Следствие названо прямо: прямой ключ
#   тоже разрешает неоднозначность молча. Он НЕ «тот, который не выбирал»;
#   он другой, и его преимущество — в охвате, а не в безошибочности.
#
# P24 (три настоящие потери): подтвердилось, их ровно три, и они ниже.

# ── ТРИ КЛАССА ВЕРДИКТА ───────────────────────────────────────────────────
#   ключ   — имя и ключ указывают на один предмет на разных стадиях
#            (законопроект → закон). 9 пар, 36 голосований.
#   оба    — два разных акта одной темы, попавших в один пункт повестки.
#            Выбор не меняет направления. 2 пары, 2 голосования.
#   потеря — пункт повестки не законопроект, акта нет. 3 пары, 3 голосования.
#   И один вердикт НЕ ВЫНЕСЕН и так помечен: 2245052 против 2197909.

# ── НАЙДЕННЫЙ ДЕФЕКТ ГЕЙТА, назван здесь, а не умолчан ────────────────────
# Вердикты читаются (`load_adjudication`), считаются и НИ НА ЧТО НЕ ВЛИЯЮТ:
# после гейта данные уходят наверх по прямому ключу независимо от того, что
# написано в вердикте. То есть гейт — турникет, а не переключатель: он
# заставляет посмотреть и не исполняет увиденное. Вердикт «потеря» этого
# голосования не вернёт, вердикт «оба» второй акт не добавит.
# Это защитимо по §24 (отсутствие артефакта само является нарушением), но
# обязано быть сказано: три голосования останутся потерянными, и ни одна
# строка вывода от этого файла не изменится.


# Ожидания к замеру различающей силы голосований по оговоркам
#
# Записаны ДО замера. Коммит обязан быть старше data/discrim_*.json.
# Промах публикуется наравне с попаданием: за сутки уже три промаха (P1 — мимо
# полосы, P3 — не могло провалиться, P7 — плавающий знаменатель).

version: "1.0"
drafted_at: "2026-07-31"
drafted_by: Claude

повод: >-
  Прямой ключ дал 1805 связей, из них 1199 — голосования по отдельным оговоркам
  (הסתייגות) на 30 актах. Вторая голова доказала, что исключать их нельзя:
  все 30 актов имеют третье чтение, поэтому исключение почти не меняет число
  покрытых законов, но стирает всё, что происходило ВНУТРИ спорных законов, а
  оговорка — преимущественно инструмент оппозиции. Исключение молчит про одну
  сторону и сохраняет другую (§7).
  Но восстановление стоит дорого: 30 стадийных PDF, ~1196 текстов оговорок,
  плюс определение действующей редакции. Прежде чем платить, надо узнать,
  РАЗЛИЧАЮТ ли эти голосования партии вообще.

зачем_именно_этот_замер: >-
  Документ существует, чтобы различить двенадцать строк бюллетеня. Если на
  оговорках все коалиционные фракции голосуют одинаково и все оппозиционные
  одинаково, то 1199 записей заново выводят коалиционную принадлежность,
  которая и так известна, и не помогают вычеркнуть конкретный список.
  Это вопрос о ЦЕНЕ, а не о правоте вердикта второй головы.

# =============================================================================
# ГРАНИЦА §3
# =============================================================================
# §3-channel: vote-discrimination
# §3-data-markers: data/discrim_*.json
#
# ВИДЕЛ: распределение ForOptionDesc по 1805 связям; концентрацию оговорок
#   (30 актов, топ-5 = 46,1%, топ-10 = 71,9%); что VoteSubject у оговорок
#   заполнен у всех и имеет вид «הסתייגות N» с хвостовым пробелом.
# НЕ СМОТРЕЛ: ни одной позиции ни одной фракции ни по одному голосованию
#   этого корпуса. Поимённые результаты по оговоркам не выкачивались ни разу.
# =============================================================================

метод:
  выборка: >-
    Полная выгрузка поимённых по 1486 содержательным голосованиям заняла бы
    больше часа. Берётся ДЕТЕРМИНИРОВАННАЯ подвыборка: голосования каждого
    класса сортируются по vote_id и берётся каждое k-е так, чтобы вышло по 150.
    Никакой случайности — §14 требует воспроизводимости, а случайный отбор без
    зерна невоспроизводим.
  мост_к_фракции: >-
    Замер использует ИСПРАВЛЕННЫЕ правила моста, а не нынешние: только
    PositionID=54 (членство, не председательство), ФИО как основной путь,
    прямое совпадение MkId только как перекрёстная проверка, полуоткрытый
    интервал по дате, БЕЗ запасного пути «единственное членство». Несшитые
    считаются и печатаются, а не прячутся.
  метрика: >-
    Попарное согласие фракций: доля голосований, где обе фракции подали
    большинство голосов в одну сторону (за/против). Воздержания и отсутствие
    в знаменатель не входят. Считается отдельно по оговоркам и по чтениям.

предсказания:

  - id: P11
    что: медиана попарного согласия фракций
    ожидание: "на оговорках ВЫШЕ, чем на чтениях, не менее чем на 0.10"
    почему: >-
      Оговорка ко второму чтению — инструмент борьбы за уже размеченный
      законопроект. Ожидаю, что позиции определяются принадлежностью к
      коалиции почти полностью, тогда как чтения включают предварительные и
      комитетские стадии, где расклад разнообразнее.
    чем_опровергается: >-
      Разница меньше 0.05 означает, что оговорки различают партии не хуже
      чтений. Тогда замер сэкономил ничего, вердикт второй головы принимается
      целиком, и конвейер оговорок строится.
    это_ГЛАВНОЕ_предсказание: да

  - id: P12
    что: доля пар фракций, неразличимых между собой (согласие ≥ 0.95)
    ожидание: "на оговорках не менее 0.40; на чтениях меньше"
    почему: >-
      Если почти половина пар неразличима, слой добавляет объём, а не
      различение.
    чем_опровергается: >-
      Ниже 0.40 на оговорках — слой несёт различение, и дешёвый путь закрыт.

  - id: P13
    что: сколько голосований выпадет из-за исправленного моста
    ожидание: "менее 3% голосов остаются без фракции"
    почему: >-
      Удаление запасного пути создаст пробел; надо знать его размер до того,
      как объявлять источник неполным.
    чем_опровергается: >-
      Больше 10% значит, что дело не в запасном пути, а в фильтре
      KnessetNum eq 25: членство, начавшееся при 24-м Кнессете, может быть
      записано под другим номером, и тогда чинить надо выгрузку, а не логику.

что_НЕ_решается_этим_замером: >-
  Правота вердикта второй головы. Даже при полной неразличимости оговорки
  остаются поступком и обязаны быть посчитаны и названы в отчёте. Замер решает
  ТОЛЬКО, платить ли за восстановление их текстов и знаков сейчас или после
  выборов.

      рекомендовал массовую перечитку 561 закона. Перечитка показала: знак по названию
      верен у 513 из 553 прочитанных (~93%), «без линии» стало 12/19, а не ~7.
    cost: >-
      Рекомендация владельцу дана на ошибочной гипотезе; сама перечитка (12 процессов чтения,
      ~1,5 ч) окупилась — снято 40 знаков, но её ожидаемый эффект был завышен.
    cause: >-
      Чувствительность вывода к УДАЛЕНИЮ знаков принята за свидетельство их ШУМА.
      Удаление любых знаков уменьшает число законов в куске и само сдвигает метки —
      опыт не различает «знаки неверны» и «знаков стало меньше». Дешёвая проверка —
      чтение выборки полных текстов — не была сделана до рекомендации.
    address: {kind: workflow, ref: 'reviews/task_check_v94.md — шаблон диагностики шума знаков'}

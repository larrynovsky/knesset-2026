# Дом произошедших уроков. Формат и страж: health_scripts/project_context/lessons.py.
# date — дата события/разбора; adopted_on — дата изменения в git.
# adopted означает внедрение названного change, а не доказанную защиту от всех повторов.
# Наблюдения тоже подаются: отсутствие исправления не должно делать урок невидимым.
address_kinds: [workflow, check, module]
deliver_statuses: [observation, in_work, adopted, failed, confirmed]
adoption_dates: required
subjects:
  report_design: Принятая форма отчёта и её доставка исполнителю
  votes_ingestion: Вход голосований, вердикты связи и свежесть выгрузки
  check_signal: Содержательный отказ, фоновое предупреждение и ложная тревога
  network_recovery: Повторы запросов и сохранение промежуточного результата
  oracle_validity: Что именно проверил оракул и краснеет ли он на поломке
  source_semantics: Семантика справочников и полнота фильтра источника
  direction_diagnosis: Причины слабости классификации и смещение её выборки
  card_authoring: Авторские ошибки разбора карточек, повторяющиеся между кругами проверки
  codex_tasks: Постановка задач Codex, их запуск и условия готовности
lessons:
  - id: KNS-L001
    date: '2026-08-13'
    thread: accepted-design-invisible
    event: >-
      Отчёт на 1,4 МБ собран без открытия design/mockup_v5/, принятого 01.08.
      Read-first не называл макет; реестр утверждал запрет table/script,
      хотя принятая форма содержала таблицу; генератор выпускал одну страницу.
      Отклонение обнаружено вопросом владельца.
    cost: >-
      К 13.08 собран отчёт не по принятой форме. Между приёмкой и обнаружением
      прошло 12 дней; объём потерянного рабочего времени отдельно не измерен.
    cause: >-
      Целевая форма отсутствовала в маршруте чтения, а инвариант закреплял
      прежний способ исполнения запрета рейтинга вместо самого запрета.
    address: {kind: workflow, ref: 'CLAUDE.md:read-first'}
    subject: [report_design]
    modules: [build_report, render_overview, check_report_canon]
    outcome:
      kind: rule
      text: >-
        Перед работой над отчётом открыть design/mockup_v5/ и его приёмку:
        они внесены нулевым пунктом read-first. Проверять запрет рейтинга по
        существу, не запрещать таблицу как прежний способ его соблюдения.
        Указатель в списке не доказывает, что макет прочитан.
    status: adopted
    adopted_on: '2026-08-14'
    change: 'git:191a23df5328017f0e5d8490ea1a49e3174590b9'
    evidence:
      - docs/explanation/why_design_was_invisible_2026-08-13.md
      - plans/ACCEPTANCE_mockup_v5_2026-08-01.md
      - design/mockup_v5/index.html
      - CLAUDE.md
      - git:191a23df5328017f0e5d8490ea1a49e3174590b9
    owner: Сопровождающий формы отчёта

  - id: KNS-L002
    date: '2026-10-07'
    thread: ingestion-blocked-since-august
    event: >-
      Введённый 01.08 гейт fetch_votes требовал вердикты содержательных
      расхождений связи голосование→акт и потерь, иначе возвращал 1.
      Первый файл вердиктов появился 07.10. Коммит 226577c фиксирует отсутствие
      успешной выгрузки с 01.08 и использование прежних данных от 31.07.
    cost: >-
      Два месяца заблокирован штатный вход. В старой выгрузке было 144 акта
      и 212 поимённых голосований против 277 и 1809 при восстановлении входа
      (числа из 226577c). Недобор связан также со старой сшивкой по имени
      и горизонтом, а не только с возрастом данных.
    cause: >-
      Отказ защищал новый запуск, но потребление старого результата не
      свидетельствовало об успешном прохождении нового гейта. Разбор печатал
      числа классов, не сами случаи, необходимые для вынесения вердиктов.
    address: {kind: module, ref: 'scripts/fetch_votes.py:adjudication'}
    subject: [votes_ingestion, oracle_validity]
    modules: [fetch_votes, check_votes_freshness]
    outcome:
      kind: check
      text: >-
        Гейт должен давать материал для устранения отказа: добавлен
        --dump-divergences, внесены 42 вердикта и расширен горизонт окна.
        Старый файл не доказывает живость входа после изменения гейта;
        нужен след успешного нового запуска. Общий сторож этой живости
        данным исправлением не подтверждён. Файл вердиктов отдельно
        признаёт: гейт требует запись, но не исполняет её содержание;
        восстановленный запуск не доказывает правильность всех связей.
    status: adopted
    adopted_on: '2026-10-07'
    change: 'git:226577ccf6359af92f50165a966ab48a0852b8ed'
    evidence:
      - git:8075c21
      - git:226577ccf6359af92f50165a966ab48a0852b8ed
      - scripts/fetch_votes.py
      - criteria/declared_before_divergence_2026-08-01.yaml
      - criteria/vote_link_adjudication_2026-10-07.yaml
    owner: Сопровождающий входа голосований

  - id: KNS-L003
    date: '2026-10-07'
    thread: permanent-alarm-becomes-background
    event: >-
      01.08 предупреждение об отсутствии budget_takanot.json на MacBook
      проскроллили 13 раз: сверка бюджетных чисел не работала всю сессию (§21).
      07.10 в 226577c зафиксирован родственный дефект: проверка состава
      требовала имена примеров макета вместо видов страниц по сущностям.
      В макете четыре f-страницы и одна c-страница с примерными именами.
    cost: >-
      День без сверки бюджетных чисел и ложный отказ проверки состава
      при допустимых именах сгенерированных страниц. Трудозатраты второго
      эпизода отдельно не измерены.
    cause: >-
      Отсутствие обязательного входа оставалось фоновым предупреждением,
      а контракт состава смешивал обязательную форму с именами примеров.
      Ожидаемый постоянный сигнал переставал различать поломку и норму.
    address: {kind: check, ref: 'scripts/check_report_canon.py:check_outputs'}
    subject: [check_signal, report_design]
    modules: [check_report_canon, build_report]
    outcome:
      kind: check
      text: >-
        Проверять одиночные страницы по имени, страницы фракций и карточек
        по виду (f-/c-); отсутствие обязательного вида остаётся отказом.
        Проверку бюджетных чисел выполнять с её входами на Studio (§21).
        Исправление ложных тревог не разрешает игнорировать настоящие;
        общего контроля исполнения §21 по-прежнему нет.
    status: adopted
    adopted_on: '2026-10-07'
    change: 'git:226577ccf6359af92f50165a966ab48a0852b8ed'
    evidence:
      - CLAUDE.md
      - scripts/check_report_canon.py
      - design/mockup_v5/f-likud.html
      - design/mockup_v5/c-likud-inst-in.html
      - git:226577ccf6359af92f50165a966ab48a0852b8ed
    owner: Сопровождающий проверок отчёта

  - id: KNS-L004
    date: '2026-10-07'
    thread: interrupted-rollcall-fetch
    event: >-
      Выгрузка остановилась на 994-м голосовании из 1809 с
      RemoteDisconnected. В _get не было повтора, промежуточные строки
      сохранялись только в памяти до завершения всего прогона.
    cost: Час выгрузки потерян; незавершённый прогон пришлось возобновлять после исправления.
    cause: >-
      Длинная сетевая серия не имела ни ограниченного повтора временного
      сбоя, ни сохранения завершённых единиц работы. Минимализм применили
      к обработке ошибки, теряющей результат, вопреки исключению лестницы.
    address: {kind: module, ref: 'scripts/guarded_fetch.py:_get'}
    subject: [network_recovery, votes_ingestion]
    modules: [guarded_fetch, fetch_votes]
    outcome:
      kind: check
      text: >-
        _get делает до четырёх попыток при временных сетевых ошибках и 5xx,
        не повторяет 4xx. fetch_votes сохраняет результат по голосованию.
        Самопроверка _get провоцирует обрыв, исчерпание попыток и 404.
        Кэш даёт смесь моментов: возраст печатается, --no-vote-cache
        отключает чтение кэша. Испытание аварийного возобновления кэша
        в этих уликах не предъявлено.
    status: adopted
    adopted_on: '2026-10-07'
    change: 'git:226577ccf6359af92f50165a966ab48a0852b8ed'
    evidence:
      - git:226577ccf6359af92f50165a966ab48a0852b8ed
      - scripts/guarded_fetch.py
      - scripts/fetch_votes.py
    owner: Сопровождающий сетевой выгрузки

  - id: KNS-L005
    date: '2026-08-01'
    thread: green-check-with-empty-sample
    event: >-
      Проверка закрытого списка искала class="v", а макет использовал
      class=v: ноль осмотренных клеток выдавался за отсутствие нарушений.
      При построении самопроверки обнаружены также пять мутантов-пустышек,
      не менявших вход. Счётчик мог считать одну стрелку вместо значения.
    cost: >-
      Зелёный результат не удостоверял канон клеток; дефекты найдены
      подложенными нарушениями, а не обычным прогоном.
    cause: >-
      У проверки не было обязательства показать осмотренную выборку,
      у подлога — доказать изменение входа. Синтаксическое совпадение
      принималось за проверенное значение предмета.
    address: {kind: check, ref: 'scripts/check_report_canon.py:CHECKS'}
    subject: [oracle_validity, report_design]
    modules: [check_report_canon, check_layout]
    outcome:
      kind: check
      text: >-
        Считать объекты, давшие значение; нулевая выборка требует причины.
        Проверка должна отвергать подложенное нарушение, а самопроверка —
        мутанта, не изменившего вход. Каркас описан в dead_checks и реализован
        в check_report_canon; защита ограничена известными поломками,
        слабость набора мутантов автоматически не обнаруживается.
    status: observation
    evidence:
      - docs/explanation/dead_checks_2026-08-01.md
      - plans/ACCEPTANCE_mockup_v5_2026-08-01.md
      - scripts/check_report_canon.py
    owner: Сопровождающий оракулов отчёта

  - id: KNS-L006
    date: '2026-08-01'
    thread: position-filter-omits-women
    event: >-
      Замер P16 опроверг трактовку PositionID=43 как министерской должности:
      это депутатский мандат. Справочник разделяет министерские должности
      по грамматическому роду: 39 и 57, заместителей — 40 и 59.
    cost: >-
      Фильтр только PositionID=39 исключал бы 15 женщин из 61 персоны
      министров в измеренной выборке; счётчик того же фильтра дал бы
      согласованные 91 из 91 записи. Это измеренная ловушка, не утверждение
      о выпуске ошибочного отчёта.
    cause: >-
      Название одной записи справочника принималось за весь предметный
      класс. Серверный count независим от пагинации, но разделяет ошибку
      нашего фильтра и потому не проверяет его семантическую полноту.
    address: {kind: workflow, ref: 'KNS_Position:selection'}
    subject: [source_semantics, oracle_validity]
    outcome:
      kind: none
      text: >-
        Перед фильтрацией KNS_Position просмотреть весь класс должностей,
        включая формы рода; сверка count по тому же фильтру этого не заменяет.
        Замер записан, постоянный оракул семантической полноты фильтра
        по найденным уликам не подтверждён.
    status: observation
    evidence:
      - docs/explanation/exposure_probe_2026-08-01.md
      - criteria/declared_before_exposure_2026-08-01.yaml
      - CLAUDE.md
    owner: Сопровождающий справочников канала В

  - id: KNS-L007
    date: '2026-08-12'
    thread: weak-direction-is-not-one-failure
    event: >-
      На 55 актах с ответами обоих вендоров 38 были слабыми: в 20 случаях
      один или оба не извлекли норм, в 12 извлекли разные множества,
      в 6 разошлись в чтении общих норм. У 11 из 20 пустых случаев
      базовый текст был полным. Ранее K2d отсеивал именно смешанные акты,
      а сравнение сырых префиксов цитат скрывало конфликты общих норм.
    cost: >-
      Общая метрика не указывала, что чинить. Проба правки промпта 11.08
      не выполнила P28 (0 из 7); разбор фиксирует потерю норм Anthropic
      на 19 актах. Увеличение контекста не было доказанным лечением.
    cause: >-
      Агрегация смешивала пустое извлечение, разный состав норм и разное
      прочтение, а формальная приёмка смещала измеряемую выборку.
      Ненормализованные цитаты дополнительно скрывали совпадающие предметы.
    address: {kind: workflow, ref: 'direction_coding:failure_diagnosis'}
    subject: [direction_diagnosis, oracle_validity]
    modules: [classify_direction, direction_confidence]
    outcome:
      kind: none
      text: >-
        Перед изменением порога, промпта или контекста разделить пустое
        извлечение, разные множества и конфликт чтений; проверить отсев
        приёмки и нормализацию цитат. Числа относятся к пилоту августа,
        не к текущему прогону. Структурированный дифф был предложением,
        его эффективность этим разбором не доказана.
    status: observation
    evidence:
      - docs/explanation/why_weak_2026-08-12.md
      - docs/explanation/direction_stall_2026-08-01.md
    owner: Сопровождающий диагностики направления

  - id: KNS-L008
    date: '2026-10-18'
    thread: same-defects-four-rounds
    event: >-
      Четыре круга проверки Codex подряд (10.10 ×2, 18.10 ×2) находили в
      карточках канала Б один и тот же набор: обрезанный пункт (хвост с
      переходным механизмом, инструментом или ограничениями не дочитан),
      «не вижу строки → не было», кратности и нули на глаз (0,24 млн →
      «ноль»; «почти не исполнен» при исполнении 0), один широкий носитель
      как ответ о цели, непросмотренные смежные и капитальные ветки,
      подмена инструмента (денежные колонки за разрешения на обязательства).
      Третий круг: 19 из 21 блока править или отвергнуть; четвёртый: 10 из 20.
      Структурный валидатор все четыре раза был зелёным.
    cost: >-
      Два полных круга переписывания 21 блока за один день 18.10 и два
      отчёта Codex по ~400–600 строк; три блока отвергнуты целиком
      (ЯТ 1659, ШАС 1531, ШАС 1673). Число блоков с дефектом по кругам:
      19/21 → 10/20.
    cause: >-
      Единица записи по правилу v1.4 — одна строка OCR с суммой, и автор
      читал ту строку, которую правило выделило, а не пункт целиком; классы
      дефектов жили только в отчётах рецензента и в заметке состояния, а в
      рабочем маршруте автора перед сдачей шага «прогнать прежний список
      классов по каждому блоку» не было. Контракт карточки по замыслу
      проверяет наличие, не смысл (card_contract.presence_not_quality).
    address: {kind: workflow, ref: 'criteria/budget_mapping.yaml:reading_unit'}
    subject: [card_authoring, oracle_validity]
    modules: [map_commitments, validate_cards]
    outcome:
      kind: rule
      text: >-
        Единица записи — строка с суммой, единица чтения — пункт целиком:
        до разбора блока автор перечитывает OCR от начала пункта до конца и
        переносит в quote_ru адресата, инструмент, срок, исключения. Перед
        сдачей на проверку — список классов дефектов прошлого круга
        прогоняется по каждому блоку. Подмена инструмента с 18.10 ловится
        буквальным правилом validate_cards («בהרשאה להתחייב» → not_found);
        остальные классы механического сторожа не имеют.
    status: observation
    evidence:
      - reviews/codex_review_v14_rest.md
      - reviews/codex_review_v14_round4.md
      - git:4126f0b29c13a5ffa77233302175ed28cb013f7c
    owner: Сопровождающий канала Б

  - id: KNS-L009
    date: '2026-10-19'
    thread: knesset
    event: >-
      На шпаргалке «Яшар!» × «Разделить юрсоветника» стояло «не голос.», хотя
      Тропер голосовал «против» (vote 44617). Канон (23 проверки, ~100 мутантов)
      и selftest были зелёными; ошибку нашёл только независимый пересчёт Codex v68
      по сырым поимённым голосам без вызова кода рендера.
    cost: >-
      Одна неверная клетка на распечатке, по которой владелец вычёркивает списки;
      шпаргалку пришлось перепечатывать. Пересчёт v68 — один прогон Codex (~15 мин).
    cause: >-
      Для пары депутатов в законах переиспользовано правило стрелок тем
      («строгое большинство двоих: оба одинаково»), тогда как на сайте словами
      объявлено правило фракций (≥1/3 голосовавших → большинство). Ни одна
      проверка не сверяла клетку с правилом, написанным для читателя: канон
      сравнивал рендер с рендером, а не с первичными голосами.
    address: {kind: check, ref: 'scripts/render_overview.py:owner_law_positions'}
    subject: [oracle_validity]
    modules: [render_overview, check_report_canon]
    outcome:
      kind: check
      text: >-
        Клетки 4 законов, по которым вычёркивают, раз в выпуск сверяются
        независимым пересчётом по сырым голосам (reviews/crosscheck_v68.py), а
        найденная клетка закреплена в selftest. Сам пересчёт в make report не
        включён — это открытое место.
    status: observation
    evidence:
      - reviews/crosscheck_owner_laws_v68.md
      - git:4ff929b
    owner: Claude (сопровождающий сайта)
  - id: KNS-L010
    date: '2026-10-19'
    thread: knesset
    event: >-
      Studio не пересобирал сайт с 14:04 до 15:40 (пять пушей подряд) — сначала
      из-за отсутствующих на Studio файлов data/ (named_votes_cache, денежные
      файлы), затем из-за §24 (MANIFEST отставал). Локальный make report был
      зелёным всё это время.
    cost: >-
      ~1,5 часа владелец мог смотреть устаревший сайт; обнаружено случайно, по
      строке «СТОП» в выводе push.
    cause: >-
      data/ в .gitignore, и новые входы, добавленные на MacBook, на Studio не
      доезжают; check_artifacts (§24) запускался только в post-receive, а не в
      локальном make report — стенд и прод проверяли разное.
    address: {kind: check, ref: 'Makefile:report'}
    subject: [check_signal]
    modules: [check_artifacts, guarded_fetch]
    outcome:

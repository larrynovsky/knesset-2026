conclusion: >-
  Фракция участвовала в 1365 голосованиях по законопроектам, которые голосовались в пленуме,
  охватив 351 акт из 1645.
  Что означало «за» в каждом случае, читается из поля смысла опции, а не
  предполагается. Направление — в блоке «Суд, парламент, свободы» выше.
  Деньги: партия правила; обязательства соглашения сверены с бюджетом по одному, сводного вывода нет — записи — в блоке «Деньги» выше на этой странице. Должности: данных пока нет — это наша недоработка, к
  партии она отношения не имеет.

readings:

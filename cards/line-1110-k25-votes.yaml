    text: >-
      актов темы без участия — 1294 из 1645, 79%. Причину выгрузка не показывает: отсутствие в зале, снятие с повестки и объединённое голосование выглядят одинаково
  - type: strengthening
    text: >-
      позиция зафиксирована 1365 раз за период 2025-07-09 — 2026-07-28; в Кнессете 92% голосований электронные и пишут каждого депутата, так что «не голосовать» не является способом скрыть позицию
  - type: reframing
    text: >-
      в окне этих голосований фракция в правительство не входила; по этим голосам нельзя отделить предпочтение по предмету от согласованного голосования с другими фракциями


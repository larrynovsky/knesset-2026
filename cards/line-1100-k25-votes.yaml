conclusion: >-
  Фракция участвовала в 1572 голосованиях по вопросам правового государства,
  охватив 194 акта из 277.
  Что означало «за» в каждом случае, читается из поля смысла опции, а не
  предполагается. Направление — в блоке «Суд, парламент, свободы» выше.
  Деньги: партия правила; в коалиционном соглашении денежных обещаний не найдено, сверять с бюджетом нечего. Должности: данных пока нет — это наша недоработка, к
  партии она отношения не имеет.


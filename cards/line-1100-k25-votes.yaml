conclusion: >-
  Фракция участвовала в 4800 голосованиях по законопроектам, которые голосовались в пленуме,
  охватив 949 актов из 1645.
  Что означало «за» в каждом случае, читается из поля смысла опции, а не
  предполагается. Направление — в блоке «Суд, парламент, свободы» выше.
  Деньги: партия правила; обязательства соглашения сверены с бюджетом по одному, сводного вывода нет — записи — в блоке «Деньги» выше на этой странице. Должности: данных пока нет — это наша недоработка, к
  партии она отношения не имеет.

readings:
  - type: weakening
    text: >-
      актов темы без участия — 696 из 1645, 42%. Причину выгрузка не показывает: отсутствие в зале, снятие с повестки и объединённое голосование выглядят одинаково
  - type: strengthening
    text: >-
      позиция зафиксирована 4800 раз за период 2022-12-13 — 2026-07-28; в Кнессете 92% голосований электронные и пишут каждого депутата, так что «не голосовать» не является способом скрыть позицию
  - type: reframing
    text: >-
      фракция входила в правительство в наблюдаемый период, и её голосование по правительственным законопроектам может отражать коалиционную дисциплину, а не предпочтение по предмету; голосованиями это не разделяется


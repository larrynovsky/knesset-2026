conclusion: >-
  Фракция участвовала в 4602 голосованиях по законопроектам, которые голосовались в пленуме,
  охватив 1031 акт из 1645.
  Что означало «за» в каждом случае, читается из поля смысла опции, а не
  предполагается. Направление — в блоке «Суд, парламент, свободы» выше.
  Деньги: в 25-м Кнессете партия в правительство не входила — по списку составов правительства. Должности: данных пока нет — это наша недоработка, к
  партии она отношения не имеет.

readings:
  - type: weakening
    text: >-
      актов темы без участия — 614 из 1645, 37%. Причину выгрузка не показывает: отсутствие в зале, снятие с повестки и объединённое голосование выглядят одинаково
  - type: strengthening
    text: >-
      позиция зафиксирована 4602 раз за период 2022-12-13 — 2026-07-17; в Кнессете 92% голосований электронные и пишут каждого депутата, так что «не голосовать» не является способом скрыть позицию
  - type: reframing
    text: >-
      канал денег у этой строки пуст по устройству измерения: коалиционного соглашения она не подписывала. Это свойство измерителя, а не партии, и читать пустоту как «к этой вопросов нет» — ошибка того же рода, что читать её как обвинение


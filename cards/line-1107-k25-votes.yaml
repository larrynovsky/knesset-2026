  - type: strengthening
    text: >-
      позиция зафиксирована 962 раз за период 2022-12-13 — 2026-07-16; в Кнессете 92% голосований электронные и пишут каждого депутата, так что «не голосовать» не является способом скрыть позицию
  - type: reframing
    text: >-
      фракция входила в правительство в наблюдаемый период, и её голосование по правительственным законопроектам может отражать коалиционную дисциплину, а не предпочтение по предмету; голосованиями это не разделяется


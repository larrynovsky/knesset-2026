    conclusion: >-
      Найдена общая статья «Мероприятия» под узлом 00045702 «Управление по продвижению положения» в Министерстве
      социального равенства. Сопоставление частичное: ни рекомендации комиссии, ни база резюме, ни информационная
      кампания в суммах не выделены. Отрицательное исполнение 2022 сохранено как в источнике; его бухгалтерская
      причина неизвестна, оно не означает отрицательный объём помощи женщинам. 2021, 0004570210, «Мероприятия

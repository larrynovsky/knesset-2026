  why: >-
    Разобраны пять записей исходной карты. Записи 61 и 63 — общий транспортный пункт: стратегические
    20 млрд и ежегодный этап 1 млрд; это пересекающиеся масштабы, суммы не складываются. Счётчик относится
    к пяти записям, а не пяти независимым программам. Период правительства 13.06.2021–29.12.2022; годовые
    расходы 2021 включают месяцы до его формирования. 2023–2026 не проверены. Найденные строки — частичные
    носители, не доказательство исполнения обещанных сумм. Переносы и получатели средств адресно не
    проверялись.

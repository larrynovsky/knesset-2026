conclusion: >-
  Фракция участвовала в 1471 из 1809 голосований по вопросам правового
  государства, охватив 205 актов из 277. Семидесяти двух актов темы она не
  касалась вовсе — это самый большой пропуск среди строк, вошедших в сборку,
  и объяснения ему в данных нет. По деньгам и по должностям карточек
  нет: соглашения не подписывала, портфелей не держала, и в обоих каналах
  наблюдать было нечего по устройству измерения, а не по итогу проверки.
  Отдельно: источник канала В не выгружался ни разу — это наша авария, и
  она не имеет отношения к этой партии.


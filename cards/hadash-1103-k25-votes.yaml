conclusion: >-
  Фракция участвовала в 162 из 212 выгруженных голосований по вопросам
  правового государства, охватив 105 актов из 144. Тридцати девяти актов темы
  она не касалась вовсе — это самый большой пропуск среди строк, вошедших в
  сборку, и объяснения ему в данных нет. По деньгам и по должностям карточек
  нет: соглашения не подписывала, портфелей не держала, и в обоих каналах
  наблюдать было нечего по устройству измерения, а не по итогу проверки.
  Отдельно: источник канала В не выгружался ни разу — это наша авария, и
  она не имеет отношения к этой партии.

readings:
  - type: weakening
    text: >-
      39 актов темы без участия — почти четверть. Это может означать
      отсутствие в зале, снятие с повестки, объединённые голосования или
      что-то ещё; данные выгрузки различить не позволяют, и приписывать
      пропуску смысл нельзя
  - type: strengthening
    text: >-
      162 голосования за три с половиной года — сопоставимо с фракциями
      вдвое большего размера; фиксация позиции происходила регулярно, а не
      эпизодически
  - type: reframing
    text: >-
      пустота каналов Б и В у этой строки — свойство ИЗМЕРИТЕЛЯ, а не партии.
      Канал денег устроен вокруг коалиционного соглашения и покрывает пять-шесть
      строк бюллетеня из шестнадцати; партия, не подписывавшая соглашения, не
      может быть в нём ни хорошей, ни плохой. Читать её пустые каналы как
      «к этой вопросов нет» — ошибка того же рода, что читать их как обвинение


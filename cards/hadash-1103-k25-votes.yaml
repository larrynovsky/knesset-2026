      что-то ещё; данные выгрузки различить не позволяют, и приписывать
      пропуску смысл нельзя
  - type: strengthening
    text: >-
      1471 голосование за три с половиной года — сопоставимо с фракциями
      вдвое большего размера; фиксация позиции происходила регулярно, а не
      эпизодически
  - type: reframing
    text: >-
      пустота каналов Б и В у этой строки — свойство ИЗМЕРИТЕЛЯ, а не партии.
      Канал денег устроен вокруг коалиционного соглашения и покрывает пять-шесть
      строк бюллетеня из шестнадцати; партия, не подписывавшая соглашения, не
      может быть в нём ни хорошей, ни плохой. Читать её пустые каналы как
      «к этой вопросов нет» — ошибка того же рода, что читать их как обвинение


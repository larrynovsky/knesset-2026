conclusion: >-
  Фракция участвовала в 1471 из 1809 голосований по вопросам правового
  государства, охватив 205 актов из 277. По 72 из 277 актов темы в выгрузке
  нет записи участия фракции; причина не установлена. По деньгам карточек нет: в 25-м
  Кнессете коалиционного соглашения она не подписывала, и сверять с бюджетом
  нечего. Это не результат проверки, не выявившей проблем.
  Отдельно: источник канала В не выгружался ни разу — это наша авария, и
  она не имеет отношения к этой партии.

readings:
  - type: weakening
    text: >-
      72 акта темы без участия — больше четверти. Это может означать
      отсутствие в зале, снятие с повестки, объединённые голосования или
      что-то ещё; данные выгрузки различить не позволяют, и приписывать
      пропуску смысл нельзя
  - type: strengthening
    text: >-
      1471 голосование за три с половиной года — сопоставимо с фракциями
      вдвое большего размера; фиксация позиции происходила регулярно, а не
      эпизодически
  - type: reframing
    text: >-
      пустота канала денег у этой строки — свойство ИЗМЕРИТЕЛЯ, а не партии.
      Канал денег устроен вокруг коалиционного соглашения и покрывает пять-шесть
      строк бюллетеня из шестнадцати; партия, не подписывавшая соглашения, не
      может быть в нём ни хорошей, ни плохой. Читать её пустые каналы как
      «к этой вопросов нет» — ошибка того же рода, что читать их как обвинение


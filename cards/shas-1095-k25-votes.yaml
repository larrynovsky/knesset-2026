conclusion: >-
  Фракция участвовала в 1761 из 1809 голосований по вопросам правового
  государства, охватив 265 актов из 277. Двенадцати актов темы она не
  касалась вовсе. Что означало «за» в каждом случае, читается из поля смысла
  опции, а не предполагается: из 1809 голосований 1216 относятся не к самому
  акту, а к оговоркам, процедурным решениям и передачам между комитетами, и
  одинаковое «за» в них означает разное. Направление — в блоке «Суд,
  парламент, свободы» выше.


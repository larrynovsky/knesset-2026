conclusion: >-
  Фракция участвовала в 205 из 212 выгруженных голосований по вопросам
  правового государства, охватив 138 актов из 144. Шести актов темы она не
  касалась вовсе. Что означало «за» в каждом случае, читается из поля смысла
  опции, а не предполагается: часть голосований — о передаче законопроекта в
  комиссию, часть — об отклонении, и одинаковое «за» в них означает разное.
  Направление этих голосований документ не утверждает: измеритель направления
  остановлен собственным объявленным порогом.

readings:
  - type: strengthening
    text: >-
      участие почти полное — 205 из 212. Фракция фиксировала позицию
      практически всегда, и это не свойство выборки: в Кнессете 92%
      голосований электронные, они пишут каждого депутата поимённо, так что
      «не голосовать» здесь не является способом скрыть позицию
  - type: weakening
    text: >-
      205 голосований — это 2,7% от 7562 голосований 25-го Кнессета. Перепись
      сделана по одной объявленной теме, и о позиции фракции по всему
      остальному карточка не говорит ничего
  - type: reframing
    text: >-
      фракция входила в правящую коалицию весь наблюдаемый период, и её
      голосование по правительственным законопроектам может отражать
      коалиционную дисциплину, а не предпочтение по предмету. Отличить одно
      от другого голосованиями нельзя в принципе


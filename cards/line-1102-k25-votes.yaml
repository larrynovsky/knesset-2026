conclusion: >-
  Фракция участвовала в 6283 голосованиях по законопроектам, которые голосовались в пленуме,
  охватив 1539 актов из 1645.
  Что означало «за» в каждом случае, читается из поля смысла опции, а не
  предполагается. Направление — в блоке «Суд, парламент, свободы» выше.
  Деньги: партия правила как ведущая сторона коалиционных соглашений; сводка подписанных партнёрам обещаний — в блоке «Деньги» выше на этой странице. Должности: данных пока нет — это наша недоработка, к
  партии она отношения не имеет.

readings:
  - type: weakening
    text: >-
      актов темы без участия — 106 из 1645, 6%. Причину выгрузка не показывает: отсутствие в зале, снятие с повестки и объединённое голосование выглядят одинаково
  - type: strengthening
    text: >-
      позиция зафиксирована 6283 раз за период 2022-12-13 — 2026-07-28; в Кнессете 92% голосований электронные и пишут каждого депутата, так что «не голосовать» не является способом скрыть позицию
  - type: reframing
    text: >-
      фракция входила в правительство в наблюдаемый период, и её голосование по правительственным законопроектам может отражать коалиционную дисциплину, а не предпочтение по предмету; голосованиями это не разделяется


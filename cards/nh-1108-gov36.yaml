  why: >-
    Разобраны все денежные записи исходной карты, с чтением окружающих пунктов OCR. Период 13.06.2021–29.12.2022;
    годовые расходы 2021 включают месяцы до формирования правительства. Найденная строка не доказывает исполнения
    всего обещания и причинной связи с соглашением. Переносы и конечные получатели адресно не проверялись.
    Одинаковые носители развития Севера у разных партнёров не являются отдельными расходами.

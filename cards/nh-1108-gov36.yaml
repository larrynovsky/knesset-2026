    codes: []
    plan_year: 2022
    fact_year: 2022
    conclusion: >-
      Носитель именно первоначальных мер по приёму яслей не установлен. Найдены широкие расходы на раннее образование
      и передача строительства яслей из ведомства труда. Это контекст реформы, но строительство не равно надзору
      и обучению персонала, а раннее образование шире яслей. Поэтому коды ниже не засчитаны как найденный носитель
      обещания. 2021, 0020600163, «Развитие раннего образования» («קידום החינוך בגיל הרך»): первоначальный
      план {0020600163:2021:allocated}, исполнение {0020600163:2021:executed}. 2022, 0020600163, «Развитие
      раннего образования» («קידום החינוך בגיל הרך»): первоначальный план {0020600163:2022:allocated}, исполнение
      {0020600163:2022:executed}. 2022, 0020620201, «Укрепление раннего образования — закупки» («חיזוק החינוך
      בגיל הרך - רכישות»): первоначальный план {0020620201:2022:allocated}, исполнение {0020620201:2022:executed}.
      2022, 0020620202, «Укрепление раннего образования — ассигнования» («חיזוק החינוך בגיל הרך - הקצבות»):
      первоначальный план {0020620202:2022:allocated}, исполнение {0020620202:2022:executed}. 2022, 0060021002,
      «Планирование и строительство яслей — передача из ведомства труда» («תכנון ובינוי מעונות יום - העברה
      מזרוע העבודה»): первоначальный план {0060021002:2022:allocated}, исполнение {0060021002:2022:executed}.
    readings:
      - type: reframing
        text: >-

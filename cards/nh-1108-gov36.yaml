  - id: nh-p5-148
    quote_he: >-
      יהיו בהסכמה עס משרד האוצר. מיד לאחר אישור החלטת הממשלה יתוקצבו מספר צעדים
    quote_ru: >-
      [Изменения стоимости] согласуются с Министерством финансов. Сразу после утверждения решения правительства
      будет профинансирован ряд шагов [контекст: передача яслей Министерству образования, надзор, обучение
      персонала и особые группы].

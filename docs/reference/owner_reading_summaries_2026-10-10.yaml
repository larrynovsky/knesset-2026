# Пересказы актов для страницы чтения владельцем. АВТОР — Claude (автор
# документа), написано 2026-10-10 по тексту актов (data/bill_texts/<id>.txt)
# и по цитатам, найденным в тексте дословно (quote_found == exact).
#
# Это не нейтральный источник: автор знает метки моделей по этим актам.
# Защита: правило criteria/declared_before_owner_reading_2026-10-10.yaml —
# ≤ 3 предложений, без словаря направления (ослабля/усилива/сдерж/коалиц/
# оппозиц/правительств/большинств — проверяется render_owner_reading.py),
# без имён фракций, без исходов голосований. Иврит рядом на странице —
# чтобы читающий мог оспорить. Оракула на ПРАВИЛЬНОСТЬ пересказа нет.
#
# Формат: одна строка на акт (читается без pyyaml).

summaries:
  2207472: Верховный суд, заседая как Высший суд справедливости, больше не рассматривает вопрос о разумности решений кабинета, главы кабинета или отдельного министра и не выдаёт по этому основанию предписаний. Другие основания судебной проверки — законность, полномочие, процедура — поправка не трогает. Это единственное содержательное изменение акта.
  2201200: В комиссию по назначению судей входят девять членов; двух представителей общественности избирает Кнессет — одного депутаты фракций, входящих в кабинет, другого остальные депутаты; председатель — министр юстиции. Судья Верховного суда избирается пятью голосами из девяти при обязательном голосе по одному члену с каждой из этих двух сторон; если за месяц кандидат не выбран, выбирают члены, предложившие кандидатов. Порядок вступает в силу с 26-го созыва Кнессета.
  2201202: Закон-спутник к поправке об отборе судей — Кнессет избирает двух представителей общественности в комиссию тайной подачей бюллетеней, среди избранных с каждой стороны должна быть хотя бы одна женщина, и предусмотрена их замена при смене кабинета или изменении численности поддерживающих его фракций. Два новых ценза для Верховного суда — кандидат моложе 55 лет избирается только с согласия всех членов комиссии, и не менее двух третей судей Верховного суда должны прежде служить в окружном суде.
  2199044: Законопроект добавляет в Основной закон о достоинстве человека и его свободе статью 5а — все равны перед законом, дискриминация между людьми, прямая или косвенная, юридическая или фактическая, не допускается. Механизмов применения, исключений или санкций текст не содержит, это общий принцип. В окне выгрузки законопроект дошёл только до передачи в комитет к первому чтению.
  2226047: Законопроект делит должность юридического советника — решение о начале расследования или предъявлении обвинения главе кабинета, министру или депутату Кнессета переходит к государственному прокурору, а его решение требует утверждения «комитета старших» из трёх членов, куда входят судья Верховного суда и бывший юридический советник, назначаемый министром юстиции. Решения комитета принимаются по числу голосов его членов. В окне выгрузки законопроект дошёл до передачи в комитет после предварительного чтения.

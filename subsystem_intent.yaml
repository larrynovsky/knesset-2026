# Реестр замысла подсистем — машинный слой (reference, Diátaxis).
#
# Зачем он здесь. Пять дней проект рос быстрее, чем описывался: docs/ZAMYSEL.md
# написан 27.07 и до сегодня описывал конвейер, половины которого не
# существует (select_keyvotes.py, votes.duckdb, cards/votes/, cards/pledges/).
# Замысел, разошедшийся с кодом, хуже отсутствующего: он уверенно врёт.
# Здесь замысел лежит рядом с якорями в коде, и расхождение видно машине.
#
# Три связи, как в health_scripts:
#   1. КОД → сюда: якоря `code_anchors`;
#   2. сюда → ТЁПЛЫЙ СЛОЙ: `explanation` — производное, реестр первичен;
#   3. сюда ↔ КОД: `invariants[].check` — сторож сверяет не «символ жив», а
#      что смысл кода не разошёлся с утверждением.
#
# invariants[].status: holds | doc_drift | designed_not_built | open
#   open = расхождение на решение человека, НЕ бетонируем.
#
# Составлен 2026-07-31 по фактическому состоянию `54c2577`, не по памяти:
# каждый якорь проверен грепом, каждый статус — прогоном.

- id: epistemic_gates
  title: "Дисциплина порядка: нельзя подогнать задним числом"
  intent: >
    Три правила свода защищают не код, а добросовестность автора, и все три
    об одном: утверждение, сделанное ПОСЛЕ взгляда на результат, неотличимо
    от утверждения, сделанного до, — если только порядок не зафиксирован
    механически. Критерии отбора коммитятся раньше данных, ожидаемый объём
    выгрузки объявляется раньше выгрузки, а у каждого правила есть артефакт,
    отсутствие которого само является нарушением. Проверить это, глядя на
    результат, невозможно в принципе; проверяется только порядок.
  explanation: docs/explanation/anchors_2026-07-31.md
  code_anchors:
    - check_criteria_order.py::check_added
    - check_criteria_order.py::decide
    - guarded_fetch.py::fetch_all
    - guarded_fetch.py::count
    - check_artifacts.py::check_no_fetch_bypass
    - check_artifacts.py::check_manifest
  invariants:
    - id: criteria_before_data
      claim: "Файл в criteria/ обязан быть закоммичен раньше данных своего канала и нести блок «ГРАНИЦА §3» с заявлением, что автор видел и чего не видел."
      status: holds
      check:
        file: check_criteria_order.py
        present: ["ГРАНИЦА §3", "§3-channel:", "§3-data-markers:"]
    - id: expectation_before_fetch
      claim: "Выгрузка без объявленного ожидания и без названной причины отказа от проверки бросает ShortRead; при расхождении данные наверх не отдаются."
      status: holds
      check:
        file: guarded_fetch.py
        present: ["ShortRead", "ТИХИЙ НЕДОБОР"]
    - id: bypass_is_visible
      claim: "Скрипт, ходящий в источник мимо guarded_fetch, ловится и обязан нести громкую пометку §23-exempt с причиной."
      status: holds
      check:
        file: check_artifacts.py
        present: ["§23-exempt", "check_no_fetch_bypass"]
    - id: mention_is_not_mechanism
      claim: "Проверка (A) в check_artifacts требует лишь УПОМИНАНИЯ §N в коде — это доказывает намерение, а не работу механизма. Файл с комментарием «§23» и пустым телом пройдёт."
      status: open
      note: >
        Названо в своде 27.07 как открытая дыра, не закрыто. Закрывается только
        тестами на каждый § по отдельности; их нет.

- id: channel_a_votes
  title: "Канал А — что фракция делала руками в пленуме"
  intent: >
    Голос в Кнессете стоит немного: проголосовать за непроходной закон ничего
    не стоит. Но это ЕДИНСТВЕННЫЙ канал, покрывающий все фракции, включая те,
    что никогда не были в правительстве и потому не подписывали соглашений.
    После решения владельца от 31.07 («отбор, а не проверка» — увидеть тех,
    кого точно вычеркнуть) этот канал становится несущим: без него документ
    не может сказать ничего про половину бюллетеня.
  code_anchors:
    - fetch_votes.py::fetch_headers
    - fetch_votes.py::fetch_faction_bridge
    - fetch_votes.py::fetch_named_votes
    - scan_bills.py::hits
    - probe_vote_publicity.py::schema_vote_entities
  invariants:
    - id: source_is_odatav4
      claim: "Голосования берутся только из OdataV4/ParliamentInfo. Легаси Odata/Votes.svc отвечает HTTP 200 и отдаёт ноль записей за 25-й Кнессет — молча."
      status: holds
      check:
        file: fetch_votes.py
        absent: ["Votes.svc"]
    - id: no_self_selection
      claim: "Возражение о самоотборе поимённых голосований (Ainsley et al., APSR 2020) к Кнессету не применяется: 92% голосований электронные, и электроника фиксирует каждого. Выборка 40 из 40 имеет поимённые записи. Партия не выбирает, зафиксировать ли позицию."
      status: holds
      check:
        file: probe_vote_publicity.py
        present: ["VoteMethodDesc", "SEED"]
    - id: bridge_by_name_not_id
      claim: "Мост «кто голосовал → какая фракция» идёт по ФИО, а не по MkId: MkId и PersonID — разные пространства идентификаторов, прямой мост давал 22,5% сшивки."
      status: holds
      check:
        file: fetch_votes.py
        present: ["fetch_faction_bridge"]
    - id: coverage_is_ours_not_source
      claim: "Выгружено 258 голосований из 7562 — это 3,4%. Ограничение НЕ в источнике: это перепись по одной объявленной теме rule_of_law. Любое утверждение о голосованиях обязано нести уточнение темы."
      status: open
      note: >
        Для решения «отбор» одной темы недостаточно: документ ответит про
        правовое государство и промолчит про всё остальное. Расширение требует
        новых предметных чек-листов, закоммиченных до просмотра результатов.
        Какие темы — решение владельца (§17), не выводится из данных.
    - id: direction_coding_stalled
      claim: "Классификация направления актов встала 29.07 на согласии вендоров 83,3% при объявленном пороге 85%. Правило остановки предписывает разбирать конкретные случаи, а не число."
      status: open

- id: channel_b_money
  title: "Канал Б — что партия выторговала и что из этого стало деньгами"
  intent: >
    Коалиционное соглашение судебному принуждению не подлежит: БАГАЦ 1990
    обязал их публиковать, но санкция чисто политическая. Ценность не в
    соглашении и не в бюджете по отдельности, а в зазоре между обещанным,
    утверждённым и исполненным. Канал покрывает только партии, подписавшие
    соглашение, — то есть пять-шесть из бюллетеня, и это его предел.
  explanation: docs/explanation/budget_mapping.md
  code_anchors:
    - fetch_agreements.py::verdict
    - ocr_agreements.py::fix_gershayim
    - fetch_budget.py::fetch_takanot
    - map_commitments.py::search
    - map_commitments.py::narrow
  invariants:
    - id: unit_is_branch_not_line
      claim: "Единица сопоставления — восьмизначная ветка, а не строка: обязательство ложится на несколько строк, и по отдельности каждая врёт."
      status: holds
    - id: search_is_hint_not_decision
      claim: "Поиск по совпадению слов — подсказка, а не механизм решения. Язык соглашения политический, бюджета административный; четыре итерации подкрутки 30.07 удвоили метрику и не дали ни одного попадания."
      status: holds
      check:
        file: map_commitments.py
        present: ["term_too_generic", "doc_freq"]
    - id: search_resolution_is_zero
      claim: "Негативный контроль 31.07: на десяти чужих ветках сопоставимого размера медиана попаданий 0%, худшая 25% — ровно столько же, сколько на настоящей ветке. Поиск различает предмет в среднем и не различает на уровне одной ветки."
      status: holds
      check:
        file: probe_placebo.py
        present: ["ПЛАЦЕБО-ВЕТКА", "медианная доля"]
    - id: absence_is_about_nomenclature
      claim: "«Слова X нет среди названий статей» — утверждение о бюджетной классификации, а не о поведении партии: слов «синагоги» и «миквы» нет и в до-соглашенческом 2022 году. Бюджет именует администрации, а не объекты."
      status: holds
      check:
        file: probe_placebo.py
        present: ["ПЛАЦЕБО-ПЕРИОД", "PLACEBO_YEAR"]
    - id: transfers_prove_nothing
      claim: "Переносы записаны на кодах длиной 8, обязательства — на 10. Перенос не доказывает адресность никогда; канал transfers в ссылках карточки — отказ сборки, а не пустое место."
      status: holds
      check:
        file: build_report.py
        present: ["канал transfers не реализован"]
    - id: supports_layer_missing
      claim: "Слой субсидий учреждениям (תמיכות) не выгружался. Именно там обычно лежат деньги, невидимые на уровне תקנה, и без него перепись даёт ложное «не найдено»."
      status: designed_not_built

- id: channel_c_executive
  title: "Канал В — что делают их люди в должностях"
  intent: >
    Поправка владельца 31.07: предмет проекта — не соглашения, а деятельность
    партии через поступки. Третья арена — исполнительная: решения
    правительства и их исполнение по министерствам. Канцелярия премьера
    публикует годовой отчёт: 256 решений, около 2029 задач, исполняемость по
    министерствам, и главный названный барьер — «бюджетное управление».
    Министерство атрибутируется к партии, которая его держит.
  code_anchors: []
  invariants:
    - id: source_exists_unfetched
      claim: "Источник существует, публикуется ежегодно и не выгружался ни разу. Формат — PDF."
      status: designed_not_built
    - id: attribution_via_portfolio
      claim: "Партия связывается с ареной через портфель министра, а не напрямую. Это допущение, а не факт: министр может отклоняться от линии партии (ministerial drift)."
      status: open

- id: card_contract
  title: "Карточка — форма, в которой суждение становится проверяемым"
  intent: >
    Карточка существует, чтобы утверждение о партии нельзя было сделать, не
    предъявив вместе с ним области поиска опровержения, двух прочтений,
    уровня уверенности с названной причиной и того, чем это опровергается.
    Схема не живёт отдельным файлом: она уже записана в своде, по одной
    строке «Механизм» на правило, и валидатор — её единственная реализация.
  explanation: docs/reference/card_schema.md
  code_anchors:
    - validate_cards.py::check_card
    - validate_cards.py::load_yaml_ish
    - validate_cards.py::emit_schema
    - validate_cards.py::selftest
  invariants:
    - id: fourteen_rules_red
      claim: "Каждый из четырнадцати механизмов свода краснеет на подложенном нарушении именно этого механизма: 23 провокации в самопроверке."
      status: holds
      check:
        file: validate_cards.py
        present: ["def selftest", "САМОПРОВЕРКА ПРОВАЛЕНА"]
    - id: parser_refuses_what_it_cannot
      claim: "Мини-разборщик YAML отказывает на конструкциях, которые не умеет, вместо тихого усечения. До 31.07 он терял 6 из 17 номеров строк в потоковом списке и обрывал многострочные значения — молча."
      status: holds
      check:
        file: validate_cards.py
        present: ["строка без ключа", "незакрытый список"]
    - id: presence_not_quality
      claim: "Проверяется НАЛИЧИЕ носителя, не его качество. Структурно полная карточка с бессодержательным поиском опровержения пройдёт всё до одной. Осмысленность машинно неотличима."
      status: holds
      check:
        file: validate_cards.py
        present: ["проверено НАЛИЧИЕ"]
    - id: no_numbers_cached
      claim: "Карточка хранит решение и ссылки, не числа: obudget перерезает таблицы задним числом, и кэш разошёлся бы с источником молча."
      status: holds
      check:
        file: validate_cards.py
        present: ["net_allocated", "кэширует число"]
    - id: votes_need_theme_caveat
      claim: "Утверждение, опирающееся на голосование, обязано нести уточнение о тематическом охвате канала А."
      status: designed_not_built
      note: >
        Обязательство написать эту проверку зафиксировано в
        criteria/declared_before_2026-07-31.yaml до того, как стал известен
        исход Ф22. Исход оказался другим, но необходимость осталась.

- id: report_output
  title: "Отчёт — единственный выход проекта"
  intent: >
    Всё, что делает проект, существует ради одного документа, который можно
    открыть перед бюллетенем. Генератор ничего не считает: числа берутся из
    выгрузки по ссылкам карточки и подставляются как есть. Ни одной таблицы и
    ни одной строки JavaScript — сортировать нечем, значит колонка «качества»
    не появится случайно.
  code_anchors:
    - build_report.py::build
    - build_report.py::substitute
    - build_report.py::fingerprint
    - build_report.py::write_site
  invariants:
    - id: accepted_shape_is_mockup_v5
      claim: "Целевая форма отчёта принята 01.08.2026: design/mockup_v5, восемь страниц, приёмка plans/ACCEPTANCE_mockup_v5_2026-08-01.md, пятнадцать проверок из пятнадцати. Многостраничный сайт: обзор с таблицей на 56 клеток, страницы фракций, карточка, оси, метод. Генератор к этой форме НЕ приведён: OUTPUTS зашит константой (index.html, robots.txt), scripts/check_report_canon.py существует и никем не запускается."
      status: open
    - id: no_aggregation_exists
      claim: "Функции агрегирования по партии в генераторе НЕ СУЩЕСТВУЕТ — не «не вызывается». Запрет по существу: нет сортируемой колонки «качества». ВНИМАНИЕ 13.08: прежняя редакция добавляла «в выводе нет ни <table>, ни <script>» и тем зафиксировала СПОСОБ, которым запрет достигался в одну эпоху, а не сам запрет. Принятый 01.08 макет mockup_v5 содержит одну таблицу — обзор на 56 клеток с закрытым списком пяти значений и без единой цифры, то есть достигает той же нормы другим способом. Инвариант в прежней редакции объявлял принятый дизайн нарушением."
      status: open
      check:
        file: build_report.py
        present: ["<table", "<script"]
    - id: prose_and_numbers_same_snapshot
      claim: "data_fingerprint — свёртка ячеек, которые читает карточка. Изменились данные под прозой — сборка отказывает и печатает текущие значения. Не сверка времени: она краснела бы на каждой штатной перевыгрузке."
      status: holds
      check:
        file: build_report.py
        present: ["data_fingerprint", "данные под выводами изменились"]
    - id: robots_allows_crawl
      claim: "robots.txt обход РАЗРЕШАЕТ, noindex стоит мета-тегом в каждом документе. Disallow запрещает обход, а не индексацию, и мешает краулеру прочитать noindex — пара взаимоисключающая."
      status: holds
      check:
        file: build_report.py
        present: ["noindex, nofollow", "Обход РАЗРЕШЁН"]
    - id: site_is_whitelist
      claim: "Отчёт пишется в site/, а не в report/: в report/ пишут три разведочных рендерера, и отдача каталога опубликовала бы сырой машинный вывод без рамки и без noindex."
      status: holds
      check:
        file: build_report.py
        present: ["OUTPUTS", "посторонний файл публикуется"]
    - id: bidi_refused
      claim: "Управляющие символы направления письма в цитате — отказ сборки. html.escape их не трогает, а они меняют отображаемый порядок, не меняя байтов: посимвольное сравнение с источником проходит."
      status: holds
      check:
        file: build_report.py
        present: ["BIDI", "управляющие символы направления"]

- id: party_identity
  title: "Кто есть кто во времени"
  intent: >
    «ШАС в 2023» и «ШАС во второй половине 2025, вышедшая из правительства но
    оставшаяся в коалиции» — два наблюдения, а не одно. Списки сливаются,
    распадаются и переименовываются между выборами. Преемственность — решение
    человека, а не факт из данных, и потому живёт в критериях.
  code_anchors:
    - build_periods.py::main
    - build_lineage_rule.py::main
    - verify_names_wikidata.py
  invariants:
    - id: period_from_registry
      claim: "period_id обязан быть из criteria/periods.yaml; период вне справочника отвергается валидатором. Справочник генерируется из источника, а не пишется рукой."
      status: holds
      check:
        file: validate_cards.py
        present: ["periods.yaml", "отсутствует в criteria/periods.yaml"]
    - id: ballot_lineage_draft
      claim: "Преемственность списков к бюллетеню 27.10.2026 существует только черновиком (criteria/ballot_lineage_draft.json) и не утверждена."
      status: open
      note: >
        Для решения «отбор» это блокирующее: без сопоставления списков
        бюллетеня с фракциями 25-го Кнессета документ не сможет сказать
        ничего про половину строк бюллетеня.

- id: self_falsification
  title: "Проверка себя: механизмы против собственной уверенности"
  intent: >
    Главный риск проекта не технический. Структурно полная карточка, за
    которой нет думания, выглядит точно так же, как та, за которой оно есть,
    и отличается только исходом для читателя. Поэтому отдельная подсистема
    существует ради того, чтобы регулярно пытаться опровергнуть собственные
    выводы: негативный контроль, отложенный период, внешние якоря и
    предсказание, записанное до того, как эталон открыт.
  explanation: docs/explanation/anchors_2026-07-31.md
  code_anchors:
    - probe_placebo.py::main
    - probe_vote_publicity.py::main
    - select_pilot.py::pick_holdout
  invariants:
    - id: prediction_before_anchor
      claim: "Предсказание о том, что скажет внешний эталон, коммитится ДО открытия его файлов. Порядок доказывается git-историей. 31.07 два предсказания из четырёх оказались опровергнуты."
      status: holds
      check:
        file: probe_placebo.py
        present: ["declared_before", "6a38d58"]
    - id: control_must_be_powerful
      claim: "Негативный контроль обязан быть сопоставим по мощности с настоящим случаем. Контроль из шести строк против сорока четырёх проходит при любой методике и не проверяет ничего."
      status: holds
      check:
        file: probe_placebo.py
